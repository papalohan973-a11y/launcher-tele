      - name: "Installer Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: "Configurer Android SDK"
        uses: android-actions/setup-android@v3

      - name: "Installer Gradle 8.9"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: "Compiler l'APK et executer les tests"
        shell: bash
        working-directory: nova
        run: |
          set -euo pipefail
          if ! gradle assembleRelease testReleaseUnitTest --no-daemon --console=plain 2>&1 | tee build.log; then
            {
              echo "## La compilation NOVA TV DUO a echoue"
              echo "Ne telechargez aucun ancien APK. Voici la fin du journal :"
              echo '```text'
              tail -100 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: "Controler et nommer le nouvel APK"
        shell: bash
        run: |
          set -euo pipefail
          cp nova/app/build/outputs/apk/release/app-release.apk nova-tv-duo.apk
          test "$(stat -c %s nova-tv-duo.apk)" -gt 1000000
          unzip -t nova-tv-duo.apk > /dev/null
          sha256sum nova-tv-duo.apk

      - name: "Sauvegarder l'APK dans Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-TV-DUO-v2-APK
          path: nova-tv-duo.apk
          if-no-files-found: error
          retention-days: 30

      - name: "Publier NOVA TV DUO en release privee"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="nova-tv-duo-v2"
          APK="nova-tv-duo.apk"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" -R "$GITHUB_REPOSITORY" \
              --title "NOVA TV DUO v2 - Arnaud et Vikiana" \
              --notes "Deux interfaces : hologrammes cyan Arnaud, edition cinema fuchsia Vikiana. Code 20, version 2.0.0-duo-cinematic."
          fi
          {
            echo "## NOVA TV DUO - APK compile"
            echo "APK: nova-tv-duo.apk"
            echo "Version: 2.0.0-duo-cinematic / code 20"
            echo "Release GitHub privee : https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo "Attention: cette release privee NE peut pas etre ouverte directement par Downloader sans connexion GitHub."
          } >> "$GITHUB_STEP_SUMMARY"
