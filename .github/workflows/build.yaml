          package com.launchertele.plus;

          import android.content.Context;
          import android.content.SharedPreferences;

          import java.util.ArrayList;
          import java.util.List;

          /** Tous les réglages du launcher, enregistrés sur la télé. */
          final class Prefs {
              private static SharedPreferences sp;

              private Prefs() {}

              static SharedPreferences sp(Context c) {
                  if (sp == null) sp = c.getApplicationContext().getSharedPreferences("launcher", Context.MODE_PRIVATE);
                  return sp;
              }

              static String s(Context c, String k, String d) {
                  return sp(c).getString(k, d);
              }

              static int i(Context c, String k, int d) {
                  return sp(c).getInt(k, d);
              }

              static long l(Context c, String k, long d) {
                  return sp(c).getLong(k, d);
              }

              static boolean b(Context c, String k, boolean d) {
                  return sp(c).getBoolean(k, d);
              }

              static void set(Context c, String k, Object v) {
                  set(c, k, v, true);
              }

              /** bump = true : l'accueil se redessine au retour. */
              static void set(Context c, String k, Object v, boolean bump) {
                  SharedPreferences.Editor e = sp(c).edit();
                  if (v instanceof String) e.putString(k, (String) v);
                  else if (v instanceof Integer) e.putInt(k, (Integer) v);
                  else if (v instanceof Long) e.putLong(k, (Long) v);
                  else if (v instanceof Boolean) e.putBoolean(k, (Boolean) v);
                  else if (v == null) e.remove(k);
                  if (bump) e.putInt("rev", sp(c).getInt("rev", 0) + 1);
                  e.apply();
              }

              static void bump(Context c) {
                  sp(c).edit().putInt("rev", sp(c).getInt("rev", 0) + 1).apply();
              }

              static int rev(Context c) {
                  return i(c, "rev", 0);
              }

              static ArrayList<String> list(Context c, String k) {
                  ArrayList<String> out = new ArrayList<>();
                  String raw = s(c, k, "");
                  if (raw.isEmpty()) return out;
                  for (String p : raw.split("\n")) if (!p.isEmpty()) out.add(p);
                  return out;
              }

              static void setList(Context c, String k, List<String> v, boolean bump) {
                  StringBuilder sb = new StringBuilder();
                  for (String s : v) {
                      if (sb.length() > 0) sb.append('\n');
                      sb.append(s);
                  }
                  set(c, k, sb.toString(), bump);
              }

              static void clearAll(Context c) {
                  int rev = rev(c);
                  sp(c).edit().clear().putInt("rev", rev + 1).apply();
              }
          }
