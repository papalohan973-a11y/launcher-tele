          import android.graphics.SurfaceTexture;
          import android.media.MediaPlayer;
          import android.view.Surface;
          import android.view.TextureView;

          import java.io.File;

          /** Fond d'écran vidéo : lecture en boucle, sans son, image recadrée plein écran. */
          final class VideoWallpaperView extends TextureView implements TextureView.SurfaceTextureListener {
              private MediaPlayer mp;
              private Surface surface;
              private File file;
              private boolean prepared, wantPlay;

              VideoWallpaperView(Context c) {
                  super(c);
                  setSurfaceTextureListener(this);
                  setOpaque(false);
              }

              void setFile(File f) {
                  if (f.equals(file) && mp != null) return;
                  file = f;
                  if (surface != null) prepare();
              }

              File getFile() {
                  return file;
              }

              void resume() {
                  wantPlay = true;
                  if (mp != null && prepared && !mp.isPlaying()) {
                      try {
                          mp.start();
                      } catch (Exception ignored) {
                      }
                  }
              }

              void pause() {
                  wantPlay = false;
                  if (mp != null && prepared) {
                      try {
                          if (mp.isPlaying()) mp.pause();
                      } catch (Exception ignored) {
                      }
                  }
              }

              void release() {
                  prepared = false;
                  if (mp != null) {
                      try {
                          mp.release();
                      } catch (Exception ignored) {
                      }
                      mp = null;
                  }
              }

              private void prepare() {
                  release();
                  if (file == null || !file.exists()) return;
                  try {
                      mp = new MediaPlayer();
                      mp.setDataSource(file.getAbsolutePath());
                      mp.setSurface(surface);
                      mp.setLooping(true);
                      mp.setVolume(0f, 0f);
                      mp.setOnPreparedListener(p -> {
                          prepared = true;
                          crop(p.getVideoWidth(), p.getVideoHeight());
                          if (wantPlay) p.start();
                      });
                      mp.setOnErrorListener((p, what, extra) -> {
                          release();
                          return true;
                      });
                      mp.prepareAsync();
                  } catch (Exception e) {
                      release();
                  }
              }

              private void crop(int vw, int vh) {
                  int w = getWidth(), h = getHeight();
                  if (vw <= 0 || vh <= 0 || w == 0 || h == 0) return;
                  float viewRatio = (float) w / h, videoRatio = (float) vw / vh;
                  float sx = 1f, sy = 1f;
                  if (videoRatio > viewRatio) sx = videoRatio / viewRatio;
                  else sy = viewRatio / videoRatio;
                  Matrix m = new Matrix();
                  m.setScale(sx, sy, w / 2f, h / 2f);
                  setTransform(m);
              }

              @Override
              public void onSurfaceTextureAvailable(SurfaceTexture st, int w, int h) {
                  surface = new Surface(st);
                  prepare();
              }

              @Override
              public void onSurfaceTextureSizeChanged(SurfaceTexture st, int w, int h) {
                  if (mp != null && prepared) crop(mp.getVideoWidth(), mp.getVideoHeight());
              }

              @Override
              public boolean onSurfaceTextureDestroyed(SurfaceTexture st) {
                  release();
                  if (surface != null) {
                      surface.release();
                      surface = null;
                  }
                  return true;
              }

              @Override
              public void onSurfaceTextureUpdated(SurfaceTexture st) {
              }
          }
