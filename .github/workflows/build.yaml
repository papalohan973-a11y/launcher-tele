              }

              @SuppressWarnings("deprecation")
              static int localVersion(Context c) {
                  try {
                      PackageInfo pi = c.getPackageManager().getPackageInfo(c.getPackageName(), 0);
                      return pi.versionCode;
                  } catch (Exception e) {
                      return 0;
                  }
              }

              static String versionName(Context c) {
                  try {
                      return c.getPackageManager().getPackageInfo(c.getPackageName(), 0).versionName;
                  } catch (Exception e) {
                      return "?";
                  }
              }

              static boolean configured() {
                  return !REPO.startsWith("__");
              }

              static void check(final Context ctx, final Result cb) {
                  final Context c = ctx.getApplicationContext();
                  Util.IO.execute(() -> {
                      String err = null;
                      int remote = 0;
                      String url = null;
                      try {
                          if (!configured()) throw new Exception("dépôt inconnu");
                          JSONObject rel = new JSONObject(Util.get("https://api.github.com/repos/" + REPO + "/releases/latest"));
                          String tag = rel.optString("tag_name", "");
                          String digits = tag.replaceAll("[^0-9]", "");
                          remote = digits.isEmpty() ? 0 : Integer.parseInt(digits);
                          JSONArray assets = rel.optJSONArray("assets");
                          if (assets != null) {
                              for (int i = 0; i < assets.length(); i++) {
                                  JSONObject a = assets.getJSONObject(i);
                                  if (a.optString("name").endsWith(".apk")) {
                                      url = a.optString("browser_download_url");
                                      break;
                                  }
                              }
                          }
                      } catch (Exception e) {
                          err = e.getMessage();
                      }
                      Prefs.set(c, "upd_last", System.currentTimeMillis(), false);
                      final boolean newer = err == null && url != null && remote > localVersion(c);
                      Prefs.set(c, "upd_remote", newer ? remote : 0, false);
                      Prefs.set(c, "upd_url", newer ? url : "", false);
                      final int r = remote;
                      final String u = url, e2 = err;
                      Util.MAIN.post(() -> cb.on(newer, r, u, e2));
                  });
              }

              static boolean due(Context c) {
                  return Prefs.b(c, "auto_update", true)
                          && System.currentTimeMillis() - Prefs.l(c, "upd_last", 0) > 6L * 3600 * 1000;
              }

              static void install(final Activity a, final String url) {
                  if (Build.VERSION.SDK_INT >= 26 && !a.getPackageManager().canRequestPackageInstalls()) {
                      Util.toast(a, "Autorise « Launcher Télé » à installer des applis, puis reviens et relance la mise à jour.");
                      try {
                          a.startActivity(new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + a.getPackageName())));
                      } catch (Exception ignored) {
                      }
                      return;
                  }
                  Util.toast(a, "Téléchargement de la mise à jour…");
                  final Context c = a.getApplicationContext();
                  Util.IO.execute(() -> {
                      try {
                          File f = new File(c.getCacheDir(), "update.apk");
                          Util.download(url, f);
                          PackageInstaller pi = c.getPackageManager().getPackageInstaller();
                          PackageInstaller.SessionParams params = new PackageInstaller.SessionParams(PackageInstaller.SessionParams.MODE_FULL_INSTALL);
                          params.setAppPackageName(c.getPackageName());
                          int id = pi.createSession(params);
                          PackageInstaller.Session s = pi.openSession(id);
                          InputStream in = new FileInputStream(f);
                          OutputStream out = s.openWrite("base.apk", 0, f.length());
                          Util.copy(in, out);
                          s.fsync(out);
                          in.close();
                          out.close();
                          Intent i = new Intent(c, InstallReceiver.class);
                          int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                          if (Build.VERSION.SDK_INT >= 31) flags |= 0x02000000; // FLAG_MUTABLE
                          PendingIntent p = PendingIntent.getBroadcast(c, id, i, flags);
                          s.commit(p.getIntentSender());
                          s.close();
                      } catch (Exception e) {
                          Util.MAIN.post(() -> Util.toast(c, "Mise à jour impossible : " + e.getMessage()));
                      }
                  });
              }
          }
