                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(Util.dp(32), Util.dp(44), Util.dp(32), Util.dp(28));
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0xF2141720);
                  float r = Util.dp(30);
                  bg.setCornerRadii(new float[]{r, r, 0, 0, 0, 0, r, r});
                  panel.setBackground(bg);

                  TextView t = new TextView(a);
                  t.setText(title);
                  t.setTextColor(0xFFFFFFFF);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, 26);
                  t.setTypeface(Theme.font(a, true));
                  panel.addView(t);
                  if (subtitle != null && !subtitle.isEmpty()) {
                      TextView st = new TextView(a);
                      st.setText(subtitle);
                      st.setTextColor(0xB3FFFFFF);
                      st.setTextSize(TypedValue.COMPLEX_UNIT_SP, 15);
                      st.setTypeface(Theme.font(a, false));
                      st.setPadding(0, Util.dp(6), 0, 0);
                      panel.addView(st);
                  }

                  ScrollView sv = new ScrollView(a);
                  sv.setVerticalScrollBarEnabled(false);
                  sv.setClipToPadding(false);
                  sv.setPadding(0, Util.dp(18), 0, Util.dp(12));
                  LinearLayout list = new LinearLayout(a);
                  list.setOrientation(LinearLayout.VERTICAL);
                  sv.addView(list);
                  View first = null;
                  for (int i = 0; i < items.length; i++) {
                      final int idx = i;
                      TextView row = new TextView(a);
                      row.setText((i == checked ? "✓   " : "") + items[i]);
                      row.setTextColor(0xFFFFFFFF);
                      row.setTextSize(TypedValue.COMPLEX_UNIT_SP, 18);
                      row.setTypeface(Theme.font(a, i == checked));
                      row.setSingleLine(true);
                      row.setEllipsize(TextUtils.TruncateAt.END);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setPadding(Util.dp(20), Util.dp(14), Util.dp(20), Util.dp(14));
                      row.setBackground(Util.focusBg(accent, 0, 16));
                      row.setFocusable(true);
                      row.setClickable(true);
                      row.setOnClickListener(v -> {
                          close();
                          if (pick != null) pick.on(idx);
                      });
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                      lp.bottomMargin = Util.dp(4);
                      list.addView(row, lp);
                      if (first == null || i == checked) first = row;
