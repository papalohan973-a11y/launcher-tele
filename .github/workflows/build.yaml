              }

              private Sheet(Activity a, ViewGroup blocked, String title, String subtitle, String[] items, int checked, final Pick pick) {
                  super(a);
                  this.blocked = blocked;
                  this.prevFocus = a.getCurrentFocus();
                  setBackgroundColor(0x99000000);
                  setClickable(true);
