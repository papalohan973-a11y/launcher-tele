              private void cycleType(int d) {
                  int i = Theme.indexOf(Backdrop.TYPE_KEYS, Prefs.s(this, "wp_type", "anim"));
                  int n = Backdrop.TYPE_KEYS.length;
                  set("wp_type", Backdrop.TYPE_KEYS[(i + d + n) % n], true);
              }

              private void chooseType(String type) {
                  if ("photo".equals(type) && !Backdrop.file(this, "wall_photo.jpg").exists()) {
                      pick(false);
                      return;
                  }
                  if ("video".equals(type) && !Backdrop.file(this, "wall_video.mp4").exists()) {
                      pick(true);
                      return;
                  }
                  if ("url".equals(type) && !Backdrop.file(this, "wall_url.jpg").exists()) {
                      askUrl();
                      return;
                  }
                  set("wp_type", type, true);
                  if ("daily".equals(type)) Util.toast(this, "Une nouvelle image chaque jour.");
              }

              private void pick(boolean video) {
                  Intent i = new Intent(this, MediaPickerActivity.class);
                  i.putExtra("video", video);
                  startActivity(i);
              }

              private void askUrl() {
                  Util.input(this, "Lien d'une image", "https://…", Prefs.s(this, "wp_url", ""), txt -> {
                      if (txt.isEmpty()) return;
                      final String url = txt.startsWith("http") ? txt : "https://" + txt;
                      Util.toast(this, "Chargement de l'image…");
                      Backdrop.downloadUrl(this, url, () -> {
                          if (Backdrop.file(this, "wall_url.jpg").exists()) {
                              Prefs.set(this, "wp_url", url);
                              set("wp_type", "url", true);
                          }
                      });
                  });
              }

              private void askCity() {
                  Util.input(this, "Ville pour la météo", "ex. Paris", Prefs.s(this, "city", "Cayenne"), txt -> {
                      if (txt.isEmpty()) return;
                      Prefs.set(this, "city", txt);
                      Prefs.set(this, "wx_time", 0L, false);
                      Weather.refresh(this, () -> {
                          if ("Ville introuvable".equals(Weather.text(this))) Util.toast(this, "Ville introuvable, vérifie l'orthographe.");
                      });
                      refresh();
                  });
              }

              private void hiddenApps() {
                  final ArrayList<String> hidden = Prefs.list(this, "hidden");
                  if (hidden.isEmpty()) {
                      Util.toast(this, "Aucune appli masquée.");
                      return;
                  }
                  HashMap<String, String> names = new HashMap<>();
                  for (AppRepo.App a : allApps) names.put(a.key, a.label);
                  final String[] labels = new String[hidden.size()];
                  for (int i = 0; i < hidden.size(); i++) {
                      String n = names.get(hidden.get(i));
                      labels[i] = n != null ? n : hidden.get(i).split("/")[0];
                  }
                  openSheet("Applis masquées", "Choisis une appli pour la réafficher.", labels, -1, i -> {
                      hidden.remove(i);
                      Prefs.setList(this, "hidden", hidden, true);
                      refresh();
                  });
              }

              private String vpnName() {
                  String pkg = Vpn.chosen(this);
                  if (pkg == null) return "Aucune installée";
                  for (String[] a : Vpn.apps(this)) if (a[0].equals(pkg)) return a[1];
                  return pkg;
              }

              private void chooseVpn() {
                  final List<String[]> vpns = Vpn.apps(this);
                  String[] labels = new String[vpns.size() + 1];
                  int checked = -1;
                  String cur = Vpn.chosen(this);
                  for (int i = 0; i < vpns.size(); i++) {
                      labels[i] = vpns.get(i)[1];
                      if (vpns.get(i)[0].equals(cur)) checked = i;
                  }
                  labels[vpns.size()] = "Installer Proton VPN (gratuit)";
                  openSheet("Application VPN", vpns.isEmpty() ? "Aucune appli VPN trouvée sur la télé." : "Celle qui s'ouvre avec le bouton VPN.",
                          labels, checked, i -> {
                              if (i == vpns.size()) Vpn.installProton(this);
                              else set("vpn_pkg", vpns.get(i)[0], false);
                          });
              }

              private void checkUpdate() {
                  if (!Updater.configured()) {
                      Util.toast(this, "Mise à jour indisponible pour cette version.");
                      return;
                  }
                  Util.toast(this, "Recherche…");
                  Updater.check(this, (newer, remote, url, err) -> {
                      if (err != null) {
                          Util.toast(this, "Impossible de vérifier (internet ?).");
                      } else if (newer) {
                          openSheet("Version " + remote + " disponible", "Tu as la version " + Updater.localVersion(this) + ".",
                                  new String[]{"Installer maintenant", "Plus tard"}, -1, i -> {
                                      if (i == 0) Updater.install(this, url);
                                  });
                      } else {
                          Util.toast(this, "Tu as déjà la dernière version.");
                      }
                  });
              }

              private void resetAll() {
                  openSheet("Tout réinitialiser ?", "Fond, icônes, favoris, ordre et applis masquées reviendront par défaut.",
                          new String[]{"Oui, tout réinitialiser", "Annuler"}, -1, i -> {
                              if (i != 0) return;
                              Prefs.clearAll(this);
                              for (String n : new String[]{"wall_photo.jpg", "wall_video.mp4", "wall_url.jpg", "wall_daily.jpg"}) {
                                  File f = Backdrop.file(this, n);
                                  if (f.exists()) f.delete();
                              }
                              IconFactory.clear();
                              backdrop.apply();
                              sig = "";
                              refresh();
                              Util.toast(this, "Tout est revenu par défaut.");
                          });
              }

              private boolean start(Intent i) {
                  try {
                      startActivity(i);
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private static String shorten(String s, String empty) {
                  if (s == null || s.isEmpty()) return empty;
                  s = s.replaceFirst("^https?://", "");
                  return s.length() > 28 ? s.substring(0, 27) + "…" : s;
              }
          }
