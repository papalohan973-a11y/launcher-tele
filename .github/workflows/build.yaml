              // ================= Applis =================

              private void reloadApps() {
                  final Context c = getApplicationContext();
                  Util.IO.execute(() -> {
                      final List<AppRepo.App> list = AppRepo.load(c);
                      Util.MAIN.post(() -> {
                          apps = list;
                          ensureDefaultFavs();
                          if (grid != null) populate(focusedKey());
                      });
                  });
              }

              private void ensureDefaultFavs() {
                  if (Prefs.b(this, "favs_init", false) || apps.isEmpty()) return;
                  String[] known = {"com.google.android.youtube.tv", "com.netflix.ninja", "com.amazon.amazonvideo.livingroom",
                          "com.disney.disneyplus", "com.canal.android.canal", "com.plexapp.android", "org.videolan.vlc",
                          "com.spotify.tv.android", "com.google.android.youtube.tvmusic", "com.esaba.downloader"};
                  ArrayList<String> favs = new ArrayList<>();
                  for (String p : known) {
                      for (AppRepo.App a : apps) {
                          if (a.pkg.equals(p) && favs.size() < 6) favs.add(a.key);
                      }
                  }
                  for (AppRepo.App a : apps) {
                      if (favs.size() >= 4) break;
                      if (!favs.contains(a.key)) favs.add(a.key);
                  }
                  Prefs.setList(this, "favs", favs, false);
                  Prefs.set(this, "favs_init", true, false);
              }

              private List<AppRepo.App> visibleApps() {
                  HashSet<String> hidden = new HashSet<>(Prefs.list(this, "hidden"));
                  List<AppRepo.App> out = new ArrayList<>();
                  for (AppRepo.App a : apps) if (!hidden.contains(a.key)) out.add(a);
                  return out;
              }

              private List<AppRepo.App> favApps() {
                  HashMap<String, AppRepo.App> m = new HashMap<>();
                  for (AppRepo.App a : apps) m.put(a.key, a);
                  List<AppRepo.App> out = new ArrayList<>();
                  for (String k : Prefs.list(this, "favs")) {
                      AppRepo.App a = m.get(k);
                      if (a != null) out.add(a);
                  }
                  return out;
              }

              /** Remplit les favoris et la grille (icônes calculées en arrière-plan si besoin). */
              private void populate(final String focusKey) {
                  final int gen = ++loadGen;
                  final List<AppRepo.App> vis = visibleApps();
                  final List<AppRepo.App> favs = favApps();
                  final int ip = iconPx, fp = favIconPx;
                  final Context c = getApplicationContext();
                  Util.IO.execute(() -> {
                      final HashMap<String, Bitmap> icons = new HashMap<>();
                      for (AppRepo.App a : favs) icons.put("F|" + a.key, AppRepo.icon(c, a, fp));
                      for (AppRepo.App a : vis) icons.put("A|" + a.key, AppRepo.icon(c, a, ip));
                      Util.MAIN.post(() -> {
                          if (gen != loadGen || grid == null) return;
                          fill(vis, favs, icons, focusKey);
                      });
                  });
              }

              private void fill(List<AppRepo.App> vis, List<AppRepo.App> favs, HashMap<String, Bitmap> icons, String focusKey) {
                  boolean labels = Prefs.b(this, "labels", true);
                  favRow.removeAllViews();
                  for (final AppRepo.App a : favs) {
                      TileView t = new TileView(this, "F|" + a.key, icons.get("F|" + a.key), a.label, favIconPx, favTileW, labels, 15);
                      wireApp(t, a, true);
                      favRow.addView(t, new LinearLayout.LayoutParams(favTileW, -2));
                  }
                  if (favs.isEmpty()) {
                      TextView hint = new TextView(this);
                      hint.setText("Appuie longuement sur OK sur une appli pour l'ajouter à tes favoris.");
                      hint.setTextColor(0xB3FFFFFF);
                      hint.setTextSize(TypedValue.COMPLEX_UNIT_SP, 16);
                      hint.setPadding(Util.dp(16), Util.dp(20), 0, Util.dp(20));
                      favRow.addView(hint);
                  }

                  grid.removeAllViews();
                  LinearLayout row = null;
                  for (int i = 0; i < vis.size(); i++) {
                      if (i % cols == 0) {
                          row = new LinearLayout(this);
                          row.setOrientation(LinearLayout.HORIZONTAL);
                          row.setClipChildren(false);
                          row.setPadding(0, Util.dp(4), 0, Util.dp(4));
                          grid.addView(row, new LinearLayout.LayoutParams(-1, -2));
                      }
                      final AppRepo.App a = vis.get(i);
                      TileView t = new TileView(this, "A|" + a.key, icons.get("A|" + a.key), a.label, iconPx, tileW, labels, 14);
                      wireApp(t, a, false);
                      row.addView(t, new LinearLayout.LayoutParams(tileW, -2));
                  }
                  appsTitle.setText("Toutes les applications  ·  " + vis.size());

                  View target = null;
                  if (movingKey != null) {
                      TileView mt = findTile((movingFav ? "F|" : "A|") + movingKey);
                      if (mt != null) {
                          mt.setMoving(true);
                          target = mt;
                      }
                  }
                  if (target == null && focusKey != null) target = findTile(focusKey);
                  if (target != null) target.requestFocus();
                  else if (!focusedOnce || getCurrentFocus() == null || !getCurrentFocus().isAttachedToWindow()) focusFirst();
                  if (!vis.isEmpty() || !favs.isEmpty()) focusedOnce = true;
              }

              private void wireApp(TileView t, final AppRepo.App a, final boolean inFav) {
                  t.setOnClickListener(v -> launch(a, v));
                  t.setOnLongClickListener(v -> {
                      appMenu(a, inFav);
                      return true;
                  });
              }

              private void launch(AppRepo.App a, View v) {
                  Bundle opts = null;
                  if (Theme.anim(this)) {
                      try {
                          opts = ActivityOptions.makeScaleUpAnimation(v, 0, 0, v.getWidth(), v.getHeight()).toBundle();
                      } catch (Exception ignored) {
                      }
                  }
                  if (!AppRepo.launch(this, a, opts)) Util.toast(this, "Impossible d'ouvrir " + a.label);
              }

              private String focusedKey() {
                  View f = getCurrentFocus();
                  return f instanceof TileView ? ((TileView) f).key : null;
              }

              private TileView findTile(String key) {
                  TileView t = findIn(favRow, key);
                  if (t == null) t = findIn(grid, key);
                  if (t == null) t = findIn(shortRow, key);
                  return t;
              }

              private TileView findIn(ViewGroup g, String key) {
                  if (g == null) return null;
                  for (int i = 0; i < g.getChildCount(); i++) {
                      View v = g.getChildAt(i);
                      if (v instanceof TileView && key.equals(((TileView) v).key)) return (TileView) v;
                      if (v instanceof ViewGroup) {
                          TileView t = findIn((ViewGroup) v, key);
                          if (t != null) return t;
                      }
                  }
                  return null;
              }

              private void focusFirst() {
                  if (favRow != null && favRow.getChildCount() > 0 && favRow.getChildAt(0) instanceof TileView) {
                      favRow.getChildAt(0).requestFocus();
                  } else if (grid != null && grid.getChildCount() > 0) {
                      ViewGroup r = (ViewGroup) grid.getChildAt(0);
                      if (r.getChildCount() > 0) r.getChildAt(0).requestFocus();
                  } else if (shortRow != null && shortRow.getChildCount() > 0) {
                      shortRow.getChildAt(0).requestFocus();
                  }
              }

              // ================= Menu d'une appli =================

              private void appMenu(final AppRepo.App a, final boolean inFav) {
                  final ArrayList<String> favs = Prefs.list(this, "favs");
                  final boolean isFav = favs.contains(a.key);
                  final List<String> labels = new ArrayList<>();
                  final List<Runnable> acts = new ArrayList<>();
                  labels.add(isFav ? "Retirer des favoris" : "Ajouter aux favoris");
                  acts.add(() -> {
                      ArrayList<String> f = Prefs.list(this, "favs");
                      if (f.contains(a.key)) f.remove(a.key);
                      else f.add(a.key);
                      Prefs.setList(this, "favs", f, false);
                      populate(isFav && inFav ? null : focusedKey());
                  });
                  labels.add("Déplacer");
                  acts.add(() -> startMove(a.key, inFav));
                  labels.add("Masquer l'application");
                  acts.add(() -> {
                      ArrayList<String> h = Prefs.list(this, "hidden");
                      if (!h.contains(a.key)) h.add(a.key);
                      Prefs.setList(this, "hidden", h, false);
                      ArrayList<String> f = Prefs.list(this, "favs");
                      f.remove(a.key);
                      Prefs.setList(this, "favs", f, false);
                      Util.toast(this, a.label + " est masquée. Pour la réafficher : Paramètres › Accueil › Applis masquées.");
                      populate(null);
                  });
                  labels.add("Infos de l'application");
                  acts.add(() -> startSafe(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + a.pkg))));
                  labels.add("Désinstaller");
                  acts.add(() -> startSafe(new Intent(Intent.ACTION_DELETE, Uri.parse("package:" + a.pkg))));
                  openSheet(a.label, "Que veux-tu faire ?", labels.toArray(new String[0]), -1, i -> acts.get(i).run());
              }

              private void openSheet(String title, String sub, String[] items, int checked, Sheet.Pick pick) {
                  if (sheet != null) sheet.close();
                  final Sheet s = Sheet.open(this, root, content, title, sub, items, checked, pick);
                  s.setOnClose(() -> {
                      if (sheet == s) sheet = null;
                  });
                  sheet = s;
              }

              // ================= Déplacement des applis =================

              private void startMove(String key, boolean fav) {
                  movingKey = key;
                  movingFav = fav;
                  TileView t = findTile((fav ? "F|" : "A|") + key);
                  if (t == null) {
                      movingKey = null;
                      return;
                  }
                  t.setMoving(true);
                  t.requestFocus();
                  Toast.makeText(this, "Utilise les flèches pour déplacer, puis OK pour valider.", Toast.LENGTH_LONG).show();
              }

              private void moveBy(int delta) {
                  List<String> list = new ArrayList<>();
                  if (movingFav) {
                      for (AppRepo.App a : favApps()) list.add(a.key);
                  } else {
                      for (AppRepo.App a : visibleApps()) list.add(a.key);
                  }
                  int i = list.indexOf(movingKey);
                  if (i < 0) {
                      stopMove();
                      return;
                  }
                  int j = Math.max(0, Math.min(list.size() - 1, i + delta));
                  if (j == i) return;
                  list.remove(i);
                  list.add(j, movingKey);
                  if (movingFav) {
                      Prefs.setList(this, "favs", list, false);
                  } else {
                      ArrayList<String> full = new ArrayList<>(list);
                      HashMap<String, AppRepo.App> m = new HashMap<>();
                      for (AppRepo.App a : apps) {
                          m.put(a.key, a);
                          if (!full.contains(a.key)) full.add(a.key);
                      }
                      Prefs.setList(this, "order", full, false);
                      List<AppRepo.App> re = new ArrayList<>();
                      for (String k : full) if (m.containsKey(k)) re.add(m.get(k));
                      apps = re;
                  }
                  populate(null);
              }

              private void stopMove() {
                  String key = movingKey;
                  boolean fav = movingFav;
                  movingKey = null;
                  if (key == null) return;
                  TileView t = findTile((fav ? "F|" : "A|") + key);
                  if (t != null) {
                      t.setMoving(false);
                      t.requestFocus();
                  }
              }

              // ================= En-tête =================

              private void updateDate() {
                  if (dateView == null) return;
                  String d = new SimpleDateFormat("EEEE d MMMM", Locale.getDefault()).format(new Date());
                  if (!d.isEmpty()) d = d.substring(0, 1).toUpperCase(Locale.getDefault()) + d.substring(1);
                  dateView.setText(d);
              }

              private void refreshWeather() {
                  if (weatherChip == null) return;
                  String t = Weather.text(this);
                  weatherChip.setText(t.isEmpty() ? "Météo…" : t);
              }

              private void refreshVpn() {
                  if (vpnChip == null) return;
                  boolean on = Vpn.active(this);
                  int accent = Theme.accent(this);
                  vpnChip.setText(on ? "🛡  VPN activé" : "🛡  VPN désactivé");
                  vpnChip.setBackground(Util.focusBg(accent, on ? 0x8022C55E : 0x2EFFFFFF, 26));
              }

              private void refreshUpdate() {
                  if (updChip == null) return;
                  int remote = Prefs.i(this, "upd_remote", 0);
                  boolean show = remote > Updater.localVersion(this) && !Prefs.s(this, "upd_url", "").isEmpty();
                  updChip.setText("⬇  Mise à jour v" + remote);
                  updChip.setVisibility(show ? View.VISIBLE : View.GONE);
              }

              private void openVpn() {
                  if (Vpn.open(this)) return;
                  openSheet("Aucune appli VPN", "Installe un VPN gratuit pour l'activer en un clic depuis l'accueil.",
                          new String[]{"Installer Proton VPN (gratuit)", "Réglages VPN de la télé"}, -1, i -> {
                              if (i == 0) Vpn.installProton(this);
                              else Vpn.systemSettings(this);
                          });
              }

              private void openSettings() {
                  startActivity(new Intent(this, SettingsActivity.class));
              }

              private void startSafe(Intent i) {
                  try {
                      startActivity(i);
                  } catch (Exception e) {
                      Util.toast(this, "Action indisponible sur cette télé.");
                  }
              }
          }
