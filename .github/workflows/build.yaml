          cat > app/java/com/launchertele/plus/AppRepo.java <<'LT_EOF'
          package com.launchertele.plus;

          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ActivityInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.content.res.Resources;
          import android.graphics.Bitmap;
          import android.graphics.drawable.Drawable;
          import android.util.DisplayMetrics;

          import java.text.Collator;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;

          /** Liste des applications installées, ordre personnalisé, icônes en cache. */
          final class AppRepo {
              private AppRepo() {}

              static final class App {
                  final String key, pkg, cls;
                  final boolean leanback;
                  String label;

                  App(String pkg, String cls, boolean leanback) {
                      this.pkg = pkg;
                      this.cls = cls;
                      this.leanback = leanback;
                      this.key = pkg + "/" + cls;
                  }
              }

              /** Toutes les applis, dans l'ordre choisi par l'utilisateur. */
              static List<App> load(Context c) {
                  PackageManager pm = c.getPackageManager();
                  LinkedHashMap<String, App> map = new LinkedHashMap<>();
                  add(c, pm, map, Intent.CATEGORY_LEANBACK_LAUNCHER, true);
                  add(c, pm, map, Intent.CATEGORY_LAUNCHER, false);
                  List<App> apps = new ArrayList<>(map.values());
                  final Collator col = Collator.getInstance(Locale.FRENCH);
                  Collections.sort(apps, (a, b) -> col.compare(a.label, b.label));
                  List<String> order = Prefs.list(c, "order");
                  if (!order.isEmpty()) {
                      final HashMap<String, Integer> pos = new HashMap<>();
                      for (int i = 0; i < order.size(); i++) pos.put(order.get(i), i);
                      final int big = order.size() + 1;
                      List<App> sorted = new ArrayList<>(apps);
                      Collections.sort(sorted, (a, b) -> {
                          Integer pa = pos.get(a.key), pb = pos.get(b.key);
                          int ia = pa == null ? big : pa, ib = pb == null ? big : pb;
                          if (ia != ib) return ia - ib;
                          return col.compare(a.label, b.label);
                      });
                      apps = sorted;
                  }
                  return apps;
              }

              private static void add(Context c, PackageManager pm, LinkedHashMap<String, App> map, String cat, boolean leanback) {
                  Intent i = new Intent(Intent.ACTION_MAIN);
                  i.addCategory(cat);
                  List<ResolveInfo> list;
                  try {
                      list = pm.queryIntentActivities(i, 0);
                  } catch (Exception e) {
                      return;
                  }
                  for (ResolveInfo ri : list) {
                      ActivityInfo ai = ri.activityInfo;
                      if (ai == null) continue;
                      if (ai.packageName.equals(c.getPackageName())) continue;
                      if (map.containsKey(ai.packageName)) continue;
                      App a = new App(ai.packageName, ai.name, leanback);
                      CharSequence l = ri.loadLabel(pm);
                      a.label = l == null ? ai.packageName : l.toString().trim();
                      map.put(ai.packageName, a);
                  }
              }

              static Drawable rawIcon(Context c, App a) {
                  PackageManager pm = c.getPackageManager();
                  try {
                      ActivityInfo ai = pm.getActivityInfo(new ComponentName(a.pkg, a.cls), 0);
                      int res = ai.getIconResource();
                      if (res != 0) {
                          try {
                              Resources r = pm.getResourcesForApplication(ai.applicationInfo);
                              Drawable d = r.getDrawableForDensity(res, DisplayMetrics.DENSITY_XXXHIGH, null);
                              if (d != null) return d;
                          } catch (Exception ignored) {
                          }
                      }
                      return ai.loadIcon(pm);
                  } catch (Exception e) {
                      return pm.getDefaultActivityIcon();
                  }
              }

              /** Icône déjà mise en forme (avec cache mémoire pour la fluidité). */
              static Bitmap icon(Context c, App a, int sizePx) {
                  String shape = Prefs.s(c, "icon_shape", "squircle");
                  String bg = Prefs.s(c, "icon_bg", "auto");
                  String key = a.key + "|" + shape + "|" + bg + "|" + sizePx;
                  Bitmap b = IconFactory.cached(key);
                  if (b != null) return b;
                  try {
                      b = IconFactory.app(rawIcon(c, a), shape, bg, sizePx);
                  } catch (Throwable t) {
                      b = IconFactory.glyph("web", 0xFF64748B, 0xFF334155, shape, sizePx);
                  }
                  IconFactory.put(key, b);
                  return b;
              }

              static boolean launch(Context c, App a, android.os.Bundle opts) {
                  try {
                      Intent i = new Intent(Intent.ACTION_MAIN);
                      i.addCategory(a.leanback ? Intent.CATEGORY_LEANBACK_LAUNCHER : Intent.CATEGORY_LAUNCHER);
                      i.setComponent(new ComponentName(a.pkg, a.cls));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                      c.startActivity(i, opts);
                      return true;
                  } catch (Exception e) {
                      return launchPackage(c, a.pkg);
                  }
              }

              static boolean launchPackage(Context c, String pkg) {
                  PackageManager pm = c.getPackageManager();
                  Intent i = pm.getLeanbackLaunchIntentForPackage(pkg);
                  if (i == null) i = pm.getLaunchIntentForPackage(pkg);
                  if (i == null) return false;
                  try {
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      c.startActivity(i);
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              static boolean installed(Context c, String pkg) {
                  try {
                      c.getPackageManager().getPackageInfo(pkg, 0);
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }
          }
          LT_EOF

          cat > app/java/com/launchertele/plus/Backdrop.java <<'LT_EOF'
          package com.launchertele.plus;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.drawable.GradientDrawable;
          import android.util.DisplayMetrics;
          import android.view.View;
          import android.widget.FrameLayout;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.File;

          /** Couche d'arrière-plan : fond (animé / image / vidéo) + voile d'assombrissement. */
          final class Backdrop extends FrameLayout {

              interface AccentListener {
                  void onAccent(int color);
              }

              static final String[] TYPE_KEYS = {"anim", "grad", "daily", "photo", "video", "url"};
              static final String[] TYPE_NAMES = {"Animé", "Dégradé", "Image du jour", "Photo de la télé", "Vidéo de la télé", "Image depuis un lien"};

              private final WallpaperView wall;
              private VideoWallpaperView video;
              private final View dim;
              private AccentListener listener;
              private boolean resumed;
              private String imageKey = "";
              private int gen;

              Backdrop(Context c) {
                  super(c);
                  wall = new WallpaperView(c);
                  addView(wall, new LayoutParams(LayoutParams.MATCH_PARENT, LayoutParams.MATCH_PARENT));
                  dim = new View(c);
                  addView(dim, new LayoutParams(LayoutParams.MATCH_PARENT, LayoutParams.MATCH_PARENT));
              }

              void setAccentListener(AccentListener l) {
                  listener = l;
              }

              static File file(Context c, String name) {
                  return new File(c.getFilesDir(), name);
              }

              void apply() {
                  final Context c = getContext();
                  String type = Prefs.s(c, "wp_type", "anim");
                  int d = Prefs.i(c, "wp_dim", 30);
                  int top = (int) (255 * d * 0.55f / 100f), midA = (int) (255 * d / 100f), bot = (int) (255 * Math.min(92, d + 32) / 100f);
                  dim.setBackground(new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM,
                          new int[]{top << 24, midA << 24, bot << 24}));
                  gen++;
                  if (!"video".equals(type)) removeVideo();
                  switch (type) {
                      case "grad": {
                          int g = Prefs.i(c, "wp_grad", 0);
                          imageKey = "";
                          wall.setGradient(g);
                          accent(WallpaperView.GRAD_ACCENT[Math.min(g, WallpaperView.GRAD_ACCENT.length - 1)]);
                          break;
                      }
                      case "photo":
                          loadImage(file(c, "wall_photo.jpg"));
                          break;
                      case "url":
                          loadImage(file(c, "wall_url.jpg"));
                          break;
                      case "daily": {
                          File f = file(c, "wall_daily.jpg");
                          loadImage(f);
                          if (!f.exists() || System.currentTimeMillis() - f.lastModified() > 12L * 3600 * 1000) fetchDaily(f);
                          break;
                      }
                      case "video": {
                          imageKey = "";
                          wall.setGradient(4);
                          File f = file(c, "wall_video.mp4");
                          if (f.exists()) {
                              if (video == null) {
                                  video = new VideoWallpaperView(c);
                                  addView(video, 1, new LayoutParams(LayoutParams.MATCH_PARENT, LayoutParams.MATCH_PARENT));
                              }
                              video.setFile(f);
                              if (resumed) video.resume();
                          }
                          accent(Prefs.i(c, "video_accent", 0xFF4C8DFF));
                          break;
                      }
                      default: {
                          imageKey = "";
                          int a = Prefs.i(c, "wp_anim", 0);
                          wall.setAnimation(a, Prefs.i(c, "wp_fps", 30));
                          accent(WallpaperView.ANIM_ACCENT[Math.min(a, WallpaperView.ANIM_ACCENT.length - 1)]);
                      }
                  }
                  if (resumed) wall.resume();
              }

              private void removeVideo() {
                  if (video != null) {
                      video.release();
                      removeView(video);
                      video = null;
                  }
              }

              void resume() {
                  resumed = true;
                  wall.resume();
                  if (video != null) video.resume();
              }

              void pause() {
                  resumed = false;
                  wall.pause();
                  if (video != null) video.pause();
              }

              private void accent(int col) {
                  Context c = getContext();
                  if (Prefs.i(c, "auto_accent", 0) != col) {
                      Prefs.set(c, "auto_accent", col, false);
                      if (listener != null) listener.onAccent(col);
                  }
              }

              private void loadImage(final File f) {
                  if (!f.exists()) {
                      imageKey = "";
                      wall.setGradient(0);
                      return;
                  }
                  final String key = f.getPath() + ":" + f.lastModified();
                  if (key.equals(imageKey)) return;
                  imageKey = key;
                  final int myGen = gen;
                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  final int tw = Math.max(dm.widthPixels, dm.heightPixels), th = Math.min(dm.widthPixels, dm.heightPixels);
                  Util.IO.execute(() -> {
                      final Bitmap b = decode(f, tw, th);
                      if (b == null) return;
                      final int acc = Util.vivid(IconFactory.dominant(b));
                      Util.MAIN.post(() -> {
                          if (myGen != gen) return;
                          wall.setImage(b);
                          accent(acc);
                      });
                  });
              }

              static Bitmap decode(File f, int tw, int th) {
                  try {
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      BitmapFactory.decodeFile(f.getPath(), o);
                      int s = 1;
                      while (o.outWidth / (s * 2) >= tw && o.outHeight / (s * 2) >= th) s *= 2;
                      BitmapFactory.Options o2 = new BitmapFactory.Options();
                      o2.inSampleSize = s;
                      return BitmapFactory.decodeFile(f.getPath(), o2);
                  } catch (Throwable t) {
                      return null;
                  }
              }

              private void fetchDaily(final File f) {
                  final Context c = getContext().getApplicationContext();
                  Util.IO.execute(() -> {
                      try {
                          String js = Util.get("https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=fr-FR");
                          JSONArray arr = new JSONObject(js).getJSONArray("images");
                          String url = arr.getJSONObject(0).getString("url");
                          if (!url.startsWith("http")) url = "https://www.bing.com" + url;
                          Util.download(url, f);
                          Util.MAIN.post(() -> {
                              if ("daily".equals(Prefs.s(c, "wp_type", "anim"))) {
                                  imageKey = "";
                                  apply();
                              }
                          });
                      } catch (Exception ignored) {
                      }
                  });
              }

              /** Télécharge une image depuis un lien pour en faire le fond. */
              static void downloadUrl(final Context c, final String url, final Runnable done) {
                  Util.IO.execute(() -> {
                      boolean ok;
                      try {
                          File f = file(c, "wall_url.jpg");
                          File tmp = file(c, "wall_url.tmp");
                          Util.download(url, tmp);
                          DisplayMetrics dm = c.getResources().getDisplayMetrics();
                          Bitmap b = decode(tmp, Math.max(dm.widthPixels, dm.heightPixels), Math.min(dm.widthPixels, dm.heightPixels));
                          ok = b != null;
                          if (ok) Util.moveInto(tmp, f);
                          else tmp.delete();
                      } catch (Exception e) {
                          ok = false;
                      }
                      final boolean success = ok;
                      Util.MAIN.post(() -> {
                          if (!success) Util.toast(c, "Impossible de charger cette image. Vérifie le lien.");
                          done.run();
                      });
                  });
              }
          }
          LT_EOF

          cat > app/java/com/launchertele/plus/IconFactory.java <<'LT_EOF'
          package com.launchertele.plus;

          import android.graphics.Bitmap;
          import android.graphics.BitmapShader;
          import android.graphics.BlurMaskFilter;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.graphics.drawable.AdaptiveIconDrawable;
          import android.graphics.drawable.Drawable;
          import android.os.Build;
          import android.util.LruCache;

          /** Dessine les icônes : forme arrondie façon WhatsApp/iPhone, fond, reflet, halo. */
          final class IconFactory {
              private IconFactory() {}

              private static final LruCache<String, Bitmap> CACHE = new LruCache<String, Bitmap>(
                      (int) Math.min(Runtime.getRuntime().maxMemory() / 6, 64L * 1024 * 1024)) {
                  @Override
                  protected int sizeOf(String key, Bitmap b) {
                      return b.getByteCount();
                  }
              };

              private static final Paint FILTER = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.FILTER_BITMAP_FLAG);

              static Bitmap cached(String key) {
                  return CACHE.get(key);
              }

              static void put(String key, Bitmap b) {
                  if (key != null && b != null) CACHE.put(key, b);
              }

              static void clear() {
                  CACHE.evictAll();
              }

              // ---------- Formes ----------

              static Path shape(String shape, float s) {
                  Path p = new Path();
                  switch (shape) {
                      case "circle":
                          p.addCircle(s / 2f, s / 2f, s / 2f, Path.Direction.CW);
                          break;
                      case "round":
                          p.addRoundRect(new RectF(0, 0, s, s), s * 0.22f, s * 0.22f, Path.Direction.CW);
                          break;
                      case "square":
                          p.addRoundRect(new RectF(0, 0, s, s), s * 0.06f, s * 0.06f, Path.Direction.CW);
                          break;
                      default: {
                          // "Squircle" (super-ellipse) : la forme des icônes iPhone / WhatsApp.
                          float r = s / 2f;
                          double n = 4.6;
                          int steps = 180;
                          for (int i = 0; i < steps; i++) {
                              double t = 2 * Math.PI * i / steps;
                              double ct = Math.cos(t), st = Math.sin(t);
                              float x = (float) (r + r * Math.signum(ct) * Math.pow(Math.abs(ct), 2.0 / n));
                              float y = (float) (r + r * Math.signum(st) * Math.pow(Math.abs(st), 2.0 / n));
                              if (i == 0) p.moveTo(x, y);
                              else p.lineTo(x, y);
                          }
                          p.close();
                      }
                  }
                  return p;
              }

              // ---------- Icônes d'applis ----------

              static Bitmap app(Drawable d, String shapeKey, String bgMode, int size) {
                  if ("none".equals(shapeKey)) {
                      Bitmap out = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                      Canvas c = new Canvas(out);
                      int pad = size / 14;
                      d.setBounds(pad, pad, size - pad, size - pad);
                      d.draw(c);
                      return out;
                  }
                  Bitmap content = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(content);
                  if (Build.VERSION.SDK_INT >= 26 && d instanceof AdaptiveIconDrawable) {
                      AdaptiveIconDrawable a = (AdaptiveIconDrawable) d;
                      int o = size / 4;
                      Drawable bg = a.getBackground();
                      Drawable fg = a.getForeground();
                      if (bg != null) {
                          bg.setBounds(-o, -o, size + o, size + o);
                          bg.draw(c);
                      } else {
                          c.drawColor(Color.WHITE);
                      }
                      if (fg != null) {
                          fg.setBounds(-o, -o, size + o, size + o);
                          fg.draw(c);
                      }
                  } else {
                      Bitmap raw = toBitmap(d, size);
                      int dom = dominant(raw);
                      if (opaqueSquare(raw)) {
                          c.drawColor(dom);
                          int z = Math.round(size * 0.06f);
                          c.drawBitmap(raw, new Rect(z, z, size - z, size - z), new RectF(0, 0, size, size), FILTER);
                      } else {
                          paintBackground(c, size, bgMode, dom);
                          float inner = size * 0.70f;
                          float off = (size - inner) / 2f;
                          c.drawBitmap(raw, null, new RectF(off, off, off + inner, off + inner), FILTER);
                      }
                      raw.recycle();
                  }
                  return finish(content, shapeKey, size);
              }

              private static void paintBackground(Canvas c, int size, String mode, int dom) {
                  int top, bottom;
                  switch (mode) {
                      case "white":
                          top = 0xFFFFFFFF;
                          bottom = 0xFFE6E9F0;
                          break;
                      case "glass":
                          top = 0x55FFFFFF;
                          bottom = 0x22FFFFFF;
                          break;
                      case "dark":
                          top = 0xFF2C303B;
                          bottom = 0xFF15181F;
                          break;
                      default: {
                          float l = Util.lum(dom);
                          if (l > 0.72f) {
                              top = Util.mix(dom, Color.BLACK, 0.70f);
                              bottom = Util.mix(dom, Color.BLACK, 0.82f);
                          } else if (l < 0.16f) {
                              top = 0xFFFFFFFF;
                              bottom = 0xFFE6E9F0;
                          } else {
                              top = Util.mix(dom, Color.WHITE, 0.86f);
                              bottom = Util.mix(dom, Color.WHITE, 0.72f);
                          }
                      }
                  }
                  Paint p = new Paint(Paint.DITHER_FLAG);
                  p.setShader(new LinearGradient(0, 0, 0, size, top, bottom, Shader.TileMode.CLAMP));
                  c.drawRect(0, 0, size, size, p);
              }

              /** Découpe le contenu dans la forme choisie, avec bords lisses + léger reflet. */
              static Bitmap finish(Bitmap content, String shapeKey, int size) {
                  String sk = "none".equals(shapeKey) ? "squircle" : shapeKey;
                  Bitmap out = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(out);
                  Path p = shape(sk, size);
                  Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.FILTER_BITMAP_FLAG);
                  paint.setShader(new BitmapShader(content, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP));
                  c.drawPath(p, paint);
                  Paint gloss = new Paint(Paint.ANTI_ALIAS_FLAG);
                  gloss.setShader(new LinearGradient(0, 0, 0, size * 0.55f, 0x26FFFFFF, 0x00FFFFFF, Shader.TileMode.CLAMP));
                  c.drawPath(p, gloss);
                  Paint stroke = new Paint(Paint.ANTI_ALIAS_FLAG);
                  stroke.setStyle(Paint.Style.STROKE);
                  stroke.setStrokeWidth(Math.max(1f, size / 90f));
                  stroke.setColor(0x2EFFFFFF);
                  c.drawPath(p, stroke);
                  content.recycle();
                  return out;
              }

              private static Bitmap toBitmap(Drawable d, int size) {
                  Bitmap b = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(b);
                  d.setBounds(0, 0, size, size);
                  d.draw(c);
                  return b;
              }

              private static boolean opaqueSquare(Bitmap b) {
                  int s = b.getWidth();
                  int a = Math.round(s * 0.12f), e = Math.round(s * 0.035f), m = s / 2, z = s - 1;
                  int[][] pts = {{a, a}, {z - a, a}, {a, z - a}, {z - a, z - a}, {e, m}, {z - e, m}, {m, e}, {m, z - e}};
                  for (int[] pt : pts) if (Color.alpha(b.getPixel(pt[0], pt[1])) < 200) return false;
                  return true;
              }

              /** Couleur principale d'une image (favorise les couleurs vives). */
              static int dominant(Bitmap src) {
                  Bitmap b = Bitmap.createScaledBitmap(src, 24, 24, true);
                  float r = 0, g = 0, bl = 0, w = 0;
                  float[] hsv = new float[3];
                  for (int y = 0; y < 24; y++) {
                      for (int x = 0; x < 24; x++) {
                          int px = b.getPixel(x, y);
                          if (Color.alpha(px) < 140) continue;
                          Color.colorToHSV(px, hsv);
                          float wt = 1f + hsv[1] * 3f;
                          r += Color.red(px) * wt;
                          g += Color.green(px) * wt;
                          bl += Color.blue(px) * wt;
                          w += wt;
                      }
                  }
                  if (b != src) b.recycle();
                  if (w == 0) return 0xFF8A93A6;
                  return Color.rgb(Math.round(r / w), Math.round(g / w), Math.round(bl / w));
              }

              // ---------- Halo / contour de sélection ----------

              static Bitmap glow(String shapeKey, int iconPx, int pad, boolean ring) {
                  String key = "glow:" + shapeKey + ":" + iconPx + ":" + pad + ":" + ring;
                  Bitmap hit = CACHE.get(key);
                  if (hit != null) return hit;
                  int s = iconPx + pad * 2;
                  Bitmap b = Bitmap.createBitmap(s, s, Bitmap.Config.ALPHA_8);
                  Canvas c = new Canvas(b);
                  String sk = "none".equals(shapeKey) ? "round" : shapeKey;
                  Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  paint.setColor(Color.WHITE);
                  if (ring) {
                      int grow = Util.dp(5);
                      Path p = shape(sk, iconPx + grow * 2);
                      p.offset(pad - grow, pad - grow);
                      paint.setStyle(Paint.Style.STROKE);
                      paint.setStrokeWidth(Util.dp(3));
                      c.drawPath(p, paint);
                  } else {
                      Path p = shape(sk, iconPx);
                      p.offset(pad, pad);
                      paint.setMaskFilter(new BlurMaskFilter(pad * 0.85f, BlurMaskFilter.Blur.NORMAL));
                      c.drawPath(p, paint);
                  }
                  CACHE.put(key, b);
                  return b;
              }

              // ---------- Icônes dessinées (raccourcis) ----------

              static Bitmap glyph(String kind, int c1, int c2, String shapeKey, int size) {
                  Bitmap content = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(content);
                  Paint bg = new Paint(Paint.DITHER_FLAG);
                  bg.setShader(new LinearGradient(0, 0, size, size, c1, c2, Shader.TileMode.CLAMP));
                  c.drawRect(0, 0, size, size, bg);
                  Paint w = new Paint(Paint.ANTI_ALIAS_FLAG);
                  w.setColor(Color.WHITE);
                  float s = size, cx = s / 2f, cy = s / 2f;
                  int mid = Util.mix(c1, c2, 0.5f);
                  switch (kind) {
                      case "claude": {
                          c.drawRoundRect(new RectF(s * 0.20f, s * 0.24f, s * 0.80f, s * 0.68f), s * 0.14f, s * 0.14f, w);
                          Path tail = new Path();
                          tail.moveTo(s * 0.30f, s * 0.62f);
                          tail.lineTo(s * 0.26f, s * 0.80f);
                          tail.lineTo(s * 0.47f, s * 0.66f);
                          tail.close();
                          c.drawPath(tail, w);
                          Paint sp = new Paint(Paint.ANTI_ALIAS_FLAG);
                          sp.setColor(c1);
                          c.drawPath(star(s * 0.5f, s * 0.46f, s * 0.15f, s * 0.045f), sp);
                          break;
                      }
                      case "vpn": {
                          Path sh = new Path();
                          sh.moveTo(cx, s * 0.18f);
                          sh.lineTo(s * 0.77f, s * 0.29f);
                          sh.lineTo(s * 0.77f, s * 0.50f);
                          sh.cubicTo(s * 0.77f, s * 0.67f, s * 0.65f, s * 0.77f, cx, s * 0.84f);
                          sh.cubicTo(s * 0.35f, s * 0.77f, s * 0.23f, s * 0.67f, s * 0.23f, s * 0.50f);
                          sh.lineTo(s * 0.23f, s * 0.29f);
                          sh.close();
                          c.drawPath(sh, w);
                          Paint ck = new Paint(Paint.ANTI_ALIAS_FLAG);
                          ck.setColor(c2);
                          ck.setStyle(Paint.Style.STROKE);
                          ck.setStrokeWidth(s * 0.065f);
                          ck.setStrokeCap(Paint.Cap.ROUND);
                          ck.setStrokeJoin(Paint.Join.ROUND);
                          Path p = new Path();
                          p.moveTo(s * 0.38f, s * 0.50f);
                          p.lineTo(s * 0.47f, s * 0.60f);
                          p.lineTo(s * 0.63f, s * 0.41f);
                          c.drawPath(p, ck);
                          break;
                      }
                      case "sliders": {
                          Paint ln = new Paint(Paint.ANTI_ALIAS_FLAG);
                          ln.setColor(Color.WHITE);
                          ln.setStrokeWidth(s * 0.05f);
                          ln.setStrokeCap(Paint.Cap.ROUND);
                          float[] ys = {0.32f, 0.50f, 0.68f};
                          float[] xs = {0.62f, 0.38f, 0.66f};
                          Paint in = new Paint(Paint.ANTI_ALIAS_FLAG);
                          in.setColor(mid);
                          for (int i = 0; i < 3; i++) {
                              c.drawLine(s * 0.24f, s * ys[i], s * 0.76f, s * ys[i], ln);
                              c.drawCircle(s * xs[i], s * ys[i], s * 0.075f, w);
                              c.drawCircle(s * xs[i], s * ys[i], s * 0.035f, in);
                          }
                          break;
                      }
                      case "gear": {
                          for (int i = 0; i < 8; i++) {
                              c.save();
                              c.rotate(i * 45f, cx, cy);
                              c.drawRoundRect(new RectF(cx - s * 0.065f, cy - s * 0.34f, cx + s * 0.065f, cy - s * 0.18f), s * 0.025f, s * 0.025f, w);
                              c.restore();
                          }
                          c.drawCircle(cx, cy, s * 0.24f, w);
                          Paint hole = new Paint(Paint.ANTI_ALIAS_FLAG);
                          hole.setColor(mid);
                          c.drawCircle(cx, cy, s * 0.10f, hole);
                          break;
                      }
                      case "web": {
                          Paint ln = new Paint(Paint.ANTI_ALIAS_FLAG);
                          ln.setColor(Color.WHITE);
                          ln.setStyle(Paint.Style.STROKE);
                          ln.setStrokeWidth(s * 0.045f);
                          float r = s * 0.28f;
                          c.drawCircle(cx, cy, r, ln);
                          c.drawOval(new RectF(cx - r * 0.45f, cy - r, cx + r * 0.45f, cy + r), ln);
                          c.drawLine(cx - r, cy, cx + r, cy, ln);
                          c.drawLine(cx - r * 0.86f, cy - r * 0.5f, cx + r * 0.86f, cy - r * 0.5f, ln);
                          c.drawLine(cx - r * 0.86f, cy + r * 0.5f, cx + r * 0.86f, cy + r * 0.5f, ln);
                          break;
                      }
                      default: { // "update" : flèche circulaire
                          Paint ln = new Paint(Paint.ANTI_ALIAS_FLAG);
                          ln.setColor(Color.WHITE);
                          ln.setStyle(Paint.Style.STROKE);
                          ln.setStrokeWidth(s * 0.07f);
                          ln.setStrokeCap(Paint.Cap.ROUND);
                          float r = s * 0.24f;
                          c.drawArc(new RectF(cx - r, cy - r, cx + r, cy + r), -60f, 290f, false, ln);
                          double end = Math.toRadians(230);
                          float px = (float) (cx + r * Math.cos(end)), py = (float) (cy + r * Math.sin(end));
                          float dx = (float) -Math.sin(end), dy = (float) Math.cos(end);
                          float a = s * 0.12f;
                          Path tri = new Path();
                          tri.moveTo(px + dx * a, py + dy * a);
                          tri.lineTo(px - dy * a * 0.8f - dx * a * 0.2f, py + dx * a * 0.8f - dy * a * 0.2f);
                          tri.lineTo(px + dy * a * 0.8f - dx * a * 0.2f, py - dx * a * 0.8f - dy * a * 0.2f);
                          tri.close();
                          c.drawPath(tri, w);
                      }
                  }
                  return finish(content, shapeKey, size);
              }

              private static Path star(float cx, float cy, float big, float small) {
                  Path p = new Path();
                  for (int i = 0; i < 8; i++) {
                      double ang = Math.toRadians(-90 + i * 45);
                      float r = (i % 2 == 0) ? big : small;
                      float x = (float) (cx + r * Math.cos(ang)), y = (float) (cy + r * Math.sin(ang));
                      if (i == 0) p.moveTo(x, y);
                      else p.lineTo(x, y);
                  }
                  p.close();
                  return p;
              }
          }
