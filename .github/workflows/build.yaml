          package com.launchertele.plus;

          import android.content.Context;
          import android.graphics.Typeface;

          /** Couleurs, polices et tailles choisies dans les paramètres. */
          final class Theme {
              private Theme() {}

              static final String[] ACCENT_KEYS = {"auto", "blue", "violet", "pink", "orange", "green", "gold", "red", "cyan", "white"};
              static final String[] ACCENT_NAMES = {"Automatique (selon le fond)", "Bleu", "Violet", "Rose", "Orange", "Vert", "Or", "Rouge", "Turquoise", "Blanc"};
              static final int[] ACCENT_COLORS = {0, 0xFF4C8DFF, 0xFF9B6BFF, 0xFFFF5FA2, 0xFFFF8A3D, 0xFF2ED47A, 0xFFF5C451, 0xFFFF4D5E, 0xFF22D3EE, 0xFFE8ECF4};

              static final String[] FONT_KEYS = {"sans", "light", "medium", "condensed", "serif", "mono"};
              static final String[] FONT_NAMES = {"Moderne", "Fine", "Affirmée", "Condensée", "Élégante", "Technique"};
              static final String[] FONT_FAMILIES = {"sans-serif", "sans-serif-light", "sans-serif-medium", "sans-serif-condensed", "serif", "monospace"};

              static final String[] SHAPE_KEYS = {"squircle", "circle", "round", "square", "none"};
              static final String[] SHAPE_NAMES = {"Arrondie (style WhatsApp)", "Ronde", "Carré arrondi", "Carré", "Originale"};

              static final String[] SIZE_KEYS = {"s", "m", "l", "xl"};
              static final String[] SIZE_NAMES = {"Petite", "Moyenne", "Grande", "Très grande"};

              static final String[] ICONBG_KEYS = {"auto", "white", "glass", "dark"};
              static final String[] ICONBG_NAMES = {"Automatique", "Blanc", "Verre", "Sombre"};

              static final String[] FX_KEYS = {"halo", "outline", "zoom"};
              static final String[] FX_NAMES = {"Halo lumineux", "Contour", "Zoom"};

              static int accent(Context c) {
                  String k = Prefs.s(c, "accent", "auto");
                  for (int i = 1; i < ACCENT_KEYS.length; i++) if (ACCENT_KEYS[i].equals(k)) return ACCENT_COLORS[i];
                  return Prefs.i(c, "auto_accent", 0xFF5EEAD4);
              }

              static String family(Context c) {
                  String k = Prefs.s(c, "font", "sans");
                  for (int i = 0; i < FONT_KEYS.length; i++) if (FONT_KEYS[i].equals(k)) return FONT_FAMILIES[i];
                  return "sans-serif";
              }

              static Typeface font(Context c, boolean bold) {
                  String fam = family(c);
                  if (bold && fam.equals("sans-serif-light")) fam = "sans-serif-medium";
                  if (bold && fam.equals("sans-serif-medium")) return Typeface.create(fam, Typeface.BOLD);
                  return Typeface.create(fam, bold ? Typeface.BOLD : Typeface.NORMAL);
              }

              /** Police fine pour la grande horloge. */
              static Typeface clockFont(Context c) {
                  String fam = family(c);
                  if (fam.equals("sans-serif") || fam.equals("sans-serif-light")) fam = "sans-serif-thin";
                  return Typeface.create(fam, Typeface.NORMAL);
              }

              static int iconDp(Context c) {
                  switch (Prefs.s(c, "icon_size", "m")) {
                      case "s": return 64;
                      case "l": return 104;
                      case "xl": return 124;
                      default: return 84;
                  }
              }

              static boolean anim(Context c) {
                  return Prefs.b(c, "ui_anim", true);
              }

              static int indexOf(String[] keys, String k) {
                  for (int i = 0; i < keys.length; i++) if (keys[i].equals(k)) return i;
                  return 0;
              }
          }
