          import android.view.Choreographer;
          import android.view.View;

          import java.util.Random;

          /** Fond d'écran : animations dessinées en direct, dégradés ou image. */
          final class WallpaperView extends View implements Choreographer.FrameCallback {

              static final String[] ANIM_NAMES = {"Aurore", "Particules", "Vagues", "Étoiles"};
              static final int[] ANIM_ACCENT = {0xFF5EEAD4, 0xFF8AB4FF, 0xFF4CC9F0, 0xFFA78BFA};
              private static final int[][] ANIM_BASE = {
                      {0xFF040714, 0xFF0B1530, 0xFF0A0F24},
                      {0xFF070B1A, 0xFF151034, 0xFF0A1428},
                      {0xFF03101C, 0xFF06263D, 0xFF0A1E33},
                      {0xFF000004, 0xFF07071A, 0xFF0D0820}};

              static final String[] GRAD_NAMES = {"Océan nocturne", "Améthyste", "Coucher de soleil", "Forêt", "Graphite", "Rubis"};
              static final int[][] GRADS = {
                      {0xFF0B132B, 0xFF1C2541, 0xFF3A506B},
                      {0xFF12051F, 0xFF3B185F, 0xFF7B2CBF},
                      {0xFF1A1A2E, 0xFF6A2C70, 0xFFF08A5D},
                      {0xFF071A14, 0xFF134E3A, 0xFF2D6A4F},
                      {0xFF0B0B0D, 0xFF1C1C21, 0xFF2E2E36},
                      {0xFF14060A, 0xFF4A0E1F, 0xFF8E1B3A}};
              static final int[] GRAD_ACCENT = {0xFF5BC0EB, 0xFFB67CFF, 0xFFFF8A5C, 0xFF52D49A, 0xFF4C8DFF, 0xFFFF5A7A};

              private static final int MODE_GRAD = 0, MODE_ANIM = 1, MODE_IMAGE = 2;

              private int mode = MODE_ANIM, grad = 0, anim = 0, fps = 30;
              private Bitmap image;
              private final Matrix matrix = new Matrix();
              private final Paint imgPaint = new Paint(Paint.FILTER_BITMAP_FLAG | Paint.DITHER_FLAG);
              private final Paint bgPaint = new Paint(Paint.DITHER_FLAG);
              private final Paint spritePaint = new Paint(Paint.FILTER_BITMAP_FLAG);
              private final Paint dotPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint wavePaint = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.DITHER_FLAG);
              private final Path wavePath = new Path();
              private final Shader[] waveShaders = new Shader[4];
              private int waveH = -1;
              private final RectF tmp = new RectF();
              private final Bitmap sprite;

              private boolean running, resumed;
              private long lastNs;
              private final long startNs = System.nanoTime();

              private static final int N = 180;
              private final float[] px = new float[N], py = new float[N], pz = new float[N], ps = new float[N], pp = new float[N];

              WallpaperView(Context c) {
                  super(c);
                  // Tache lumineuse douce, réutilisée par toutes les animations (rapide à dessiner).
                  sprite = Bitmap.createBitmap(256, 256, Bitmap.Config.ALPHA_8);
                  Canvas sc = new Canvas(sprite);
                  Paint rp = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.DITHER_FLAG);
                  rp.setShader(new RadialGradient(128, 128, 128,
                          new int[]{0xFFFFFFFF, 0x99FFFFFF, 0x33FFFFFF, 0x00FFFFFF},
                          new float[]{0f, 0.35f, 0.7f, 1f}, Shader.TileMode.CLAMP));
                  sc.drawCircle(128, 128, 128, rp);
                  Random r = new Random(42);
                  for (int i = 0; i < N; i++) {
                      px[i] = r.nextFloat();
                      py[i] = r.nextFloat();
                      pz[i] = r.nextFloat();
                      ps[i] = r.nextFloat();
                      pp[i] = r.nextFloat() * 6.283f;
                  }
              }

              // ---------- Contrôle ----------

              void setGradient(int i) {
                  mode = MODE_GRAD;
                  grad = Math.max(0, Math.min(GRADS.length - 1, i));
                  image = null;
                  stop();
                  updateShader();
                  invalidate();
              }

              void setAnimation(int i, int fps) {
                  mode = MODE_ANIM;
                  anim = Math.max(0, Math.min(ANIM_NAMES.length - 1, i));
                  this.fps = fps;
                  image = null;
                  updateShader();
                  stop();
                  if (resumed && fps > 0) start();
                  invalidate();
              }

              void setImage(Bitmap b) {
                  mode = MODE_IMAGE;
                  image = b;
                  stop();
                  updateMatrix();
                  invalidate();
              }

              void resume() {
                  resumed = true;
                  if (mode == MODE_ANIM && fps > 0) start();
              }

              void pause() {
                  resumed = false;
                  stop();
              }

              private void start() {
                  if (running) return;
                  running = true;
                  Choreographer.getInstance().postFrameCallback(this);
              }

              private void stop() {
                  running = false;
                  Choreographer.getInstance().removeFrameCallback(this);
              }

              @Override
              public void doFrame(long frameTimeNanos) {
                  if (!running) return;
                  long interval = 1_000_000_000L / Math.max(1, fps);
                  if (frameTimeNanos - lastNs >= interval - 3_000_000L) {
                      lastNs = frameTimeNanos;
                      invalidate();
                  }
                  Choreographer.getInstance().postFrameCallback(this);
              }

              @Override
              protected void onDetachedFromWindow() {
                  stop();
                  super.onDetachedFromWindow();
              }

              @Override
              protected void onSizeChanged(int w, int h, int ow, int oh) {
                  super.onSizeChanged(w, h, ow, oh);
                  updateShader();
                  updateMatrix();
              }

              private void updateShader() {
                  int w = Math.max(1, getWidth()), h = Math.max(1, getHeight());
                  int[] cols = mode == MODE_GRAD ? GRADS[grad] : ANIM_BASE[anim];
                  bgPaint.setShader(new LinearGradient(0, 0, w, h, cols, null, Shader.TileMode.CLAMP));
              }

              private void updateMatrix() {
                  if (image == null || getWidth() == 0) return;
                  float vw = getWidth(), vh = getHeight(), bw = image.getWidth(), bh = image.getHeight();
                  float sc = Math.max(vw / bw, vh / bh);
                  matrix.reset();
                  matrix.setScale(sc, sc);
                  matrix.postTranslate((vw - bw * sc) / 2f, (vh - bh * sc) / 2f);
              }

              // ---------- Dessin ----------

              @Override
              protected void onDraw(Canvas c) {
                  int w = getWidth(), h = getHeight();
                  if (w == 0 || h == 0) return;
                  if (mode == MODE_IMAGE && image != null) {
                      c.drawColor(Color.BLACK);
                      c.drawBitmap(image, matrix, imgPaint);
                      return;
                  }
                  c.drawRect(0, 0, w, h, bgPaint);
                  float m = Math.max(w, h);
                  if (mode == MODE_GRAD) {
                      sprite(c, w * 0.85f, h * 0.12f, m * 0.55f, 0x1CFFFFFF);
                      sprite(c, w * 0.08f, h * 0.98f, m * 0.5f, Util.alpha(GRAD_ACCENT[grad], 0x38));
                      return;
                  }
                  float t = fps > 0 ? (System.nanoTime() - startNs) / 1e9f : 20f;
                  switch (anim) {
                      case 1: particles(c, w, h, m, t); break;
                      case 2: waves(c, w, h, m, t); break;
                      case 3: stars(c, w, h, m, t); break;
                      default: aurora(c, w, h, m, t);
                  }
              }

              private void sprite(Canvas c, float cx, float cy, float r, int color) {
                  spritePaint.setColor(color);
                  tmp.set(cx - r, cy - r, cx + r, cy + r);
                  c.drawBitmap(sprite, null, tmp, spritePaint);
              }

              private static float sin(double v) {
                  return (float) Math.sin(v);
              }

              private static float cos(double v) {
                  return (float) Math.cos(v);
              }

              private void aurora(Canvas c, int w, int h, float m, float t) {
                  int[] cols = {0xFF14B8A6, 0xFF8B5CF6, 0xFF3B82F6, 0xFF22D3EE, 0xFFEC4899};
                  for (int i = 0; i < cols.length; i++) {
                      float cx = w * (0.5f + 0.42f * sin(t * (0.11f + 0.03f * i) + i * 1.7f));
                      float cy = h * (0.45f + 0.35f * cos(t * (0.09f + 0.025f * i) + i * 2.3f));
                      float r = m * (0.36f + 0.07f * sin(t * 0.2f + i));
                      sprite(c, cx, cy, r, Util.alpha(cols[i], 0x80));
                  }
              }

              private void particles(Canvas c, int w, int h, float m, float t) {
                  sprite(c, w * (0.25f + 0.05f * sin(t * 0.1f)), h * 0.3f, m * 0.45f, 0x403B82F6);
                  sprite(c, w * (0.8f + 0.05f * cos(t * 0.08f)), h * 0.75f, m * 0.45f, 0x408B5CF6);
                  int n = 90;
                  float base = Util.dp(1.4f);
                  for (int i = 0; i < n; i++) {
                      float speed = 0.012f + 0.03f * pz[i];
                      float y = py[i] - t * speed;
                      y = y - (float) Math.floor(y);
                      float x = px[i] + 0.02f * sin(t * 0.5f + pp[i]);
                      float tw = 0.45f + 0.55f * (0.5f + 0.5f * sin(t * 1.6f + pp[i] * 3f));
                      float r = base + ps[i] * Util.dp(2.6f);
                      int col = (i % 3 == 0) ? 0xFFF9A8D4 : (i % 3 == 1 ? 0xFF93C5FD : 0xFFFFFFFF);
                      sprite(c, x * w, y * h, r * 5f, Util.alpha(col, (int) (110 * tw)));
                      dotPaint.setColor(Util.alpha(Color.WHITE, (int) (230 * tw)));
                      c.drawCircle(x * w, y * h, r * 0.7f, dotPaint);
                  }
              }

              private void waves(Canvas c, int w, int h, float m, float t) {
                  sprite(c, w * 0.78f, h * 0.18f, m * 0.3f, 0x55BDE0FE);
                  sprite(c, w * 0.78f, h * 0.18f, m * 0.08f, 0xAAFFFFFF);
                  int[] cols = {0x5A2EC4B6, 0x4D3A86FF, 0x408338EC, 0x3800F5D4};
                  for (int i = 0; i < cols.length; i++) {
                      float base = h * (0.55f + i * 0.09f);
                      float amp = h * (0.05f + 0.015f * i);
                      float k1 = (2.2f + 0.5f * i) * 6.283f, k2 = 2.5f * 6.283f;
                      wavePath.reset();
                      wavePath.moveTo(0, h);
                      for (int s = 0; s <= 48; s++) {
                          float xn = s / 48f;
                          float y = base + amp * sin(xn * k1 + t * (0.35f + 0.12f * i) + i)
                                  + amp * 0.4f * sin(xn * k2 - t * 0.5f);
                          wavePath.lineTo(xn * w, y);
                      }
                      wavePath.lineTo(w, h);
                      wavePath.close();
                      if (waveH != h) {
                          for (int k = 0; k < cols.length; k++) {
                              float b2 = h * (0.55f + k * 0.09f), a2 = h * (0.05f + 0.015f * k);
                              waveShaders[k] = new LinearGradient(0, b2 - a2, 0, h, cols[k], Util.alpha(cols[k], 0x08), Shader.TileMode.CLAMP);
                          }
                          waveH = h;
                      }
                      wavePaint.setShader(waveShaders[i]);
                      c.drawPath(wavePath, wavePaint);
                  }
              }

              private void stars(Canvas c, int w, int h, float m, float t) {
                  float cx = w / 2f, cy = h / 2f;
                  sprite(c, cx + w * 0.25f * cos(t * 0.03f), cy + h * 0.2f * sin(t * 0.03f), m * 0.45f, 0x406D28D9);
                  sprite(c, cx - w * 0.25f * cos(t * 0.025f), cy - h * 0.2f * sin(t * 0.025f), m * 0.4f, 0x402563EB);
                  float f = Math.min(w, h) * 0.35f;
                  for (int i = 0; i < N; i++) {
                      float z = pz[i] - t * 0.025f;
                      z = z - (float) Math.floor(z);
                      z = 0.03f + z * 0.97f;
                      float sx = cx + (px[i] * 2f - 1f) / z * f;
                      float sy = cy + (py[i] * 2f - 1f) / z * f;
                      if (sx < -10 || sy < -10 || sx > w + 10 || sy > h + 10) continue;
                      float near = 1f - z;
                      float r = Util.dp(0.6f) + near * near * Util.dp(3.2f);
                      int a = (int) (255 * Math.min(1f, near * 1.3f) * (0.7f + 0.3f * sin(t * 2f + pp[i])));
                      dotPaint.setColor(Util.alpha(Color.WHITE, Math.max(0, a)));
                      c.drawCircle(sx, sy, r, dotPaint);
                  }
              }
          }
          LT_EOF

          cat > app/java/com/launchertele/plus/Weather.java <<'LT_EOF'
          package com.launchertele.plus;

          import android.content.Context;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.net.URLEncoder;
          import java.util.Locale;

          /** Météo gratuite via Open-Meteo (aucune clé ni compte). */
          final class Weather {
              private Weather() {}

              static String text(Context c) {
                  return Prefs.s(c, "wx_text", "");
              }

              static boolean stale(Context c) {
                  return System.currentTimeMillis() - Prefs.l(c, "wx_time", 0) > 30L * 60 * 1000
                          || !Prefs.s(c, "wx_for", "").equals(Prefs.s(c, "city", "Cayenne"));
              }

              static void refresh(final Context ctx, final Runnable done) {
                  final Context c = ctx.getApplicationContext();
                  Util.IO.execute(() -> {
                      String city = Prefs.s(c, "city", "Cayenne").trim();
                      if (city.isEmpty()) return;
                      try {
                          if (!city.equals(Prefs.s(c, "wx_geo_city", ""))) {
                              String g = Util.get("https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&name="
                                      + URLEncoder.encode(city, "UTF-8"));
                              JSONObject go = new JSONObject(g);
                              JSONArray res = go.optJSONArray("results");
                              if (res == null || res.length() == 0) {
                                  Prefs.set(c, "wx_text", "Ville introuvable", false);
                                  Prefs.set(c, "wx_for", city, false);
                                  Prefs.set(c, "wx_time", System.currentTimeMillis(), false);
                                  Util.MAIN.post(done);
                                  return;
                              }
                              JSONObject r = res.getJSONObject(0);
                              Prefs.set(c, "wx_lat", String.valueOf(r.getDouble("latitude")), false);
                              Prefs.set(c, "wx_lon", String.valueOf(r.getDouble("longitude")), false);
                              Prefs.set(c, "wx_name", r.optString("name", city), false);
                              Prefs.set(c, "wx_geo_city", city, false);
                          }
                          String url = String.format(Locale.US,
                                  "https://api.open-meteo.com/v1/forecast?latitude=%s&longitude=%s&current=temperature_2m,weather_code,is_day&timezone=auto",
                                  Prefs.s(c, "wx_lat", "0"), Prefs.s(c, "wx_lon", "0"));
                          JSONObject cur = new JSONObject(Util.get(url)).getJSONObject("current");
                          double t = cur.getDouble("temperature_2m");
                          int code = cur.optInt("weather_code", 0);
                          boolean day = cur.optInt("is_day", 1) == 1;
                          String txt = icon(code, day) + "  " + Math.round(t) + "°   " + Prefs.s(c, "wx_name", city);
                          Prefs.set(c, "wx_text", txt, false);
                          Prefs.set(c, "wx_for", city, false);
                          Prefs.set(c, "wx_time", System.currentTimeMillis(), false);
                          Util.MAIN.post(done);
                      } catch (Exception ignored) {
                      }
                  });
              }

              static String icon(int code, boolean day) {
                  if (code == 0) return day ? "☀️" : "🌙";
                  if (code <= 2) return day ? "🌤️" : "☁️";
                  if (code == 3) return "☁️";
                  if (code == 45 || code == 48) return "🌫️";
                  if (code >= 51 && code <= 57) return "🌦️";
                  if (code >= 61 && code <= 67) return "🌧️";
                  if (code >= 71 && code <= 77) return "❄️";
                  if (code >= 80 && code <= 82) return "🌦️";
                  if (code >= 85 && code <= 86) return "🌨️";
                  if (code >= 95) return "⛈️";
                  return "🌡️";
              }
          }
          LT_EOF

          cat > app/java/com/launchertele/plus/WebActivity.java <<'LT_EOF'
          package com.launchertele.plus;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.ResolveInfo;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          /** Petit navigateur intégré, utilisé si la télé n'a pas de navigateur (ex. pour Claude). */
          public class WebActivity extends Activity {
              private WebView web;

              /** Ouvre un lien dans le navigateur de la télé, ou dans le navigateur intégré. */
              static void openUrl(Activity a, String url) {
                  Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  ResolveInfo ri = a.getPackageManager().resolveActivity(i, 0);
                  boolean usable = ri != null && ri.activityInfo != null
                          && !ri.activityInfo.packageName.equals(a.getPackageName())
                          && !ri.activityInfo.packageName.contains("frameworkpackagestubs");
                  if (usable) {
                      try {
                          a.startActivity(i);
                          return;
                      } catch (Exception ignored) {
                      }
                  }
                  Intent w = new Intent(a, WebActivity.class);
                  w.putExtra("url", url);
                  a.startActivity(w);
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  try {
                      web = new WebView(this);
                  } catch (Throwable t) {
                      Util.toast(this, "Le navigateur intégré n'est pas disponible sur cette télé.");
                      finish();
                      return;
                  }
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  web.setBackgroundColor(0xFF111111);
                  setContentView(web);
                  String url = getIntent().getStringExtra("url");
                  web.loadUrl(url == null ? "https://claude.ai" : url);
                  web.requestFocus();
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && web != null && web.canGoBack()) {
                      web.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }

              @Override
              protected void onDestroy() {
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          LT_EOF

