              private void choice(String sec, final String title, final String key, final String[] keys, final String[] names,
                                  final String def, final boolean wall) {
                  Item it = new Item(sec, title);
                  it.arrows = true;
                  it.value = () -> names[Theme.indexOf(keys, Prefs.s(this, key, def))];
                  it.left = () -> set(key, keys[(Theme.indexOf(keys, Prefs.s(this, key, def)) - 1 + keys.length) % keys.length], wall);
                  it.right = () -> set(key, keys[(Theme.indexOf(keys, Prefs.s(this, key, def)) + 1) % keys.length], wall);
                  it.ok = () -> openSheet(title, null, names, Theme.indexOf(keys, Prefs.s(this, key, def)), i -> set(key, keys[i], wall));
                  items.add(it);
              }

              private static int indexOf(int[] vals, int v) {
                  for (int i = 0; i < vals.length; i++) if (vals[i] == v) return i;
                  return 0;
              }

              private void choiceInt(String sec, final String title, final String key, final int[] vals, final String[] names,
                                     final int def, final boolean wall) {
                  Item it = new Item(sec, title);
                  it.arrows = true;
                  it.value = () -> names[indexOf(vals, Prefs.i(this, key, def))];
                  it.left = () -> {
                      int i = indexOf(vals, Prefs.i(this, key, def));
                      if (i > 0) set(key, vals[i - 1], wall);
                  };
                  it.right = () -> {
                      int i = indexOf(vals, Prefs.i(this, key, def));
                      if (i < vals.length - 1) set(key, vals[i + 1], wall);
                  };
                  it.ok = () -> openSheet(title, null, names, indexOf(vals, Prefs.i(this, key, def)), i -> set(key, vals[i], wall));
                  items.add(it);
              }

              private void toggle(String sec, String title, final String key, final boolean def, final String on, final String off) {
                  Item it = new Item(sec, title);
                  it.arrows = true;
                  it.value = () -> Prefs.b(this, key, def) ? on : off;
                  Runnable flip = () -> set(key, !Prefs.b(this, key, def), false);
                  it.left = flip;
                  it.right = flip;
                  it.ok = flip;
                  items.add(it);
              }

              private void action(String sec, String title, Getter value, Runnable ok) {
                  Item it = new Item(sec, title);
                  it.value = value;
                  it.ok = ok;
                  items.add(it);
              }

              private void set(String key, Object v, boolean wall) {
                  Prefs.set(this, key, v);
                  if (wall) backdrop.apply();
                  refresh();
              }

              // ================= Affichage =================

              private void refresh() {
                  buildItems();
                  StringBuilder sb = new StringBuilder();
                  for (Item it : items) sb.append(it.title).append('|');
                  sb.append(Theme.accent(this)).append(Prefs.s(this, "font", ""));
                  String newSig = sb.toString();
                  if (!newSig.equals(sig) || rowViews.size() != items.size()) {
                      sig = newSig;
                      rebuildRows();
                  } else {
                      for (int i = 0; i < items.size(); i++) valueViews.get(i).setText(valueText(items.get(i)));
                  }
                  refreshPreview();
              }

              private String valueText(Item it) {
                  String v = it.value == null ? "" : it.value.get();
                  if (it.arrows) return "‹  " + v + "  ›";
                  return v.isEmpty() ? "›" : v + "   ›";
              }

              private void rebuildRows() {
                  int focusIdx = -1;
                  View f = getCurrentFocus();
                  for (int i = 0; i < rowViews.size(); i++) if (rowViews.get(i) == f) focusIdx = i;
                  list.removeAllViews();
                  rowViews.clear();
                  valueViews.clear();
                  int accent = Theme.accent(this);
                  int secColor = Util.lum(accent) < 0.35f ? 0xFFFFFFFF : accent;
                  String lastSec = null;
                  for (int i = 0; i < items.size(); i++) {
                      final int idx = i;
                      Item it = items.get(i);
                      if (!it.section.equals(lastSec)) {
                          lastSec = it.section;
                          TextView h = new TextView(this);
                          h.setText(it.section.toUpperCase(Locale.FRENCH));
                          h.setTextColor(secColor);
                          h.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                          h.setTypeface(Theme.font(this, true));
                          h.setLetterSpacing(0.12f);
                          h.setPadding(Util.dp(22), Util.dp(i == 0 ? 10 : 26), 0, Util.dp(8));
                          list.addView(h);
                      }
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setPadding(Util.dp(22), Util.dp(15), Util.dp(22), Util.dp(15));
                      row.setBackground(Util.focusBg(accent, 0, 16));
                      row.setFocusable(true);
                      row.setClickable(true);
                      TextView title = new TextView(this);
                      title.setText(it.title);
                      title.setTextColor(Color.WHITE);
                      title.setTextSize(TypedValue.COMPLEX_UNIT_SP, 18);
                      title.setTypeface(Theme.font(this, false));
                      row.addView(title, new LinearLayout.LayoutParams(0, -2, 1f));
                      final TextView value = new TextView(this);
                      value.setText(valueText(it));
                      value.setTextColor(0xB3FFFFFF);
                      value.setTextSize(TypedValue.COMPLEX_UNIT_SP, 16);
                      value.setTypeface(Theme.font(this, false));
                      value.setSingleLine(true);
                      value.setEllipsize(TextUtils.TruncateAt.END);
                      value.setMaxWidth(Util.dp(260));
                      row.addView(value);
                      row.setOnFocusChangeListener((v, has) -> value.setTextColor(has ? 0xFFFFFFFF : 0xB3FFFFFF));
                      row.setOnClickListener(v -> {
                          Item cur = idx < items.size() ? items.get(idx) : null;
                          if (cur != null && cur.ok != null) cur.ok.run();
                      });
                      row.setOnKeyListener((v, keyCode, e) -> {
                          if (keyCode != KeyEvent.KEYCODE_DPAD_LEFT && keyCode != KeyEvent.KEYCODE_DPAD_RIGHT) return false;
                          Item cur = idx < items.size() ? items.get(idx) : null;
                          if (cur == null || !cur.arrows) return keyCode == KeyEvent.KEYCODE_DPAD_RIGHT || keyCode == KeyEvent.KEYCODE_DPAD_LEFT;
                          if (e.getAction() == KeyEvent.ACTION_DOWN) {
                              if (keyCode == KeyEvent.KEYCODE_DPAD_LEFT && cur.left != null) cur.left.run();
                              if (keyCode == KeyEvent.KEYCODE_DPAD_RIGHT && cur.right != null) cur.right.run();
                          }
                          return true;
                      });
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                      lp.bottomMargin = Util.dp(3);
                      list.addView(row, lp);
                      rowViews.add(row);
                      valueViews.add(value);
                  }
                  int target = focusIdx < 0 ? 0 : Math.min(focusIdx, rowViews.size() - 1);
                  if (!rowViews.isEmpty() && sheet == null) rowViews.get(target).requestFocus();
              }

              private void refreshPreview() {
                  if (preview == null) return;
                  final Context c = getApplicationContext();
                  final int ip = Util.dp(Math.min(Theme.iconDp(this), 96));
                  final List<AppRepo.App> sample = new ArrayList<>();
                  for (AppRepo.App a : allApps) {
                      if (sample.size() >= 3) break;
                      sample.add(a);
                  }
                  final String shape = Prefs.s(this, "icon_shape", "squircle");
                  Util.IO.execute(() -> {
                      final List<Bitmap> icons = new ArrayList<>();
                      final List<String> names = new ArrayList<>();
                      for (AppRepo.App a : sample) {
                          icons.add(AppRepo.icon(c, a, ip));
                          names.add(a.label);
                      }
                      icons.add(IconFactory.glyph("claude", 0xFFE08B6A, 0xFFA8432A, shape, ip));
                      names.add("Claude");
                      Util.MAIN.post(() -> {
                          if (isFinishing()) return;
                          preview.removeAllViews();
                          int tw = ip + Util.dp(44);
                          boolean labels = Prefs.b(this, "labels", true);
                          for (int i = 0; i < icons.size(); i++) {
                              TileView t = new TileView(this, "P|" + i, icons.get(i), names.get(i), ip, tw, labels, 14);
                              t.setFocusable(false);
                              t.setClickable(false);
                              preview.addView(t, new LinearLayout.LayoutParams(tw, -2));
                              if (i == 1) t.apply(true, false);
