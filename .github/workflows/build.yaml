                  panel.addView(sv, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  TextView hint = new TextView(a);
                  hint.setText("Retour pour fermer");
                  hint.setTextColor(0x80FFFFFF);
                  hint.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  panel.addView(hint);

                  addView(panel, new LayoutParams(w, LayoutParams.MATCH_PARENT, Gravity.END));

                  blocked.setDescendantFocusability(ViewGroup.FOCUS_BLOCK_DESCENDANTS);
                  if (Theme.anim(a)) {
                      panel.setTranslationX(w);
                      panel.animate().translationX(0).setDuration(240).setInterpolator(new DecelerateInterpolator(2f)).start();
                      setAlpha(0f);
                      animate().alpha(1f).setDuration(180).start();
                  }
                  final View f = first;
                  if (f != null) post(f::requestFocus);
              }

              void setOnClose(Runnable r) {
                  onClose = r;
              }

              void close() {
                  if (closed) return;
                  closed = true;
                  blocked.setDescendantFocusability(ViewGroup.FOCUS_AFTER_DESCENDANTS);
                  ViewGroup parent = (ViewGroup) getParent();
                  if (parent != null) parent.removeView(this);
                  if (prevFocus != null && prevFocus.isAttachedToWindow()) prevFocus.requestFocus();
                  if (onClose != null) onClose.run();
              }

              boolean isClosed() {
                  return closed;
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent e) {
                  int k = e.getKeyCode();
                  if (k == KeyEvent.KEYCODE_BACK || k == KeyEvent.KEYCODE_ESCAPE || k == KeyEvent.KEYCODE_BUTTON_B) {
                      if (e.getAction() == KeyEvent.ACTION_UP) close();
                      return true;
                  }
                  return super.dispatchKeyEvent(e);
              }
          }
