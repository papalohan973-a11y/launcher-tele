          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          /** Petits outils partagés : réseau, couleurs, formes, dialogues. */
          final class Util {
              static final Handler MAIN = new Handler(Looper.getMainLooper());
              static final ExecutorService IO = Executors.newFixedThreadPool(3);
              static float density = 2f;

              private Util() {}

              static void init(Context c) {
                  density = c.getResources().getDisplayMetrics().density;
              }

              static int dp(float v) {
                  return Math.round(v * density);
              }

              // ---------- Réseau ----------

              static HttpURLConnection open(String url) throws IOException {
                  HttpURLConnection con = (HttpURLConnection) new URL(url).openConnection();
                  con.setConnectTimeout(15000);
                  con.setReadTimeout(30000);
                  con.setInstanceFollowRedirects(true);
                  con.setRequestProperty("User-Agent", "LauncherTele/2 (Android TV)");
                  return con;
              }

              static String get(String url) throws IOException {
                  HttpURLConnection con = open(url);
                  con.setRequestProperty("Accept", "application/json");
                  try {
                      int code = con.getResponseCode();
                      if (code >= 400) throw new IOException("HTTP " + code);
                      InputStream in = con.getInputStream();
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      try {
                          copy(in, bo);
                      } finally {
                          in.close();
                      }
                      return bo.toString("UTF-8");
                  } finally {
                      con.disconnect();
                  }
              }

              static void download(String url, File out) throws IOException {
                  HttpURLConnection con = open(url);
                  try {
                      int code = con.getResponseCode();
                      if (code >= 400) throw new IOException("HTTP " + code);
                      File tmp = new File(out.getPath() + ".part");
                      InputStream in = con.getInputStream();
                      OutputStream os = new FileOutputStream(tmp);
                      try {
                          copy(in, os);
                      } finally {
                          in.close();
                          os.close();
                      }
                      moveInto(tmp, out);
                  } finally {
                      con.disconnect();
                  }
              }

              static void moveInto(File tmp, File out) throws IOException {
                  if (out.exists() && !out.delete()) throw new IOException("delete");
                  if (!tmp.renameTo(out)) throw new IOException("rename");
              }

              static void copy(InputStream in, OutputStream out) throws IOException {
                  byte[] b = new byte[65536];
                  int n;
                  while ((n = in.read(b)) > 0) out.write(b, 0, n);
              }

              // ---------- Couleurs ----------

              static int mix(int a, int b, float t) {
                  float u = 1f - t;
                  return Color.argb(
                          Math.round(Color.alpha(a) * u + Color.alpha(b) * t),
                          Math.round(Color.red(a) * u + Color.red(b) * t),
                          Math.round(Color.green(a) * u + Color.green(b) * t),
                          Math.round(Color.blue(a) * u + Color.blue(b) * t));
              }

              static int alpha(int color, int alpha) {
                  return (color & 0x00FFFFFF) | ((alpha & 0xFF) << 24);
              }

              static float lum(int c) {
                  return (0.299f * Color.red(c) + 0.587f * Color.green(c) + 0.114f * Color.blue(c)) / 255f;
              }

              /** Rend une couleur assez vive pour servir de couleur d'accent. */
              static int vivid(int c) {
                  float[] hsv = new float[3];
                  Color.colorToHSV(c, hsv);
                  hsv[1] = Math.max(hsv[1], 0.55f);
                  hsv[2] = Math.max(hsv[2], 0.88f);
                  if (hsv[1] < 0.6f && hsv[2] > 0.95f) hsv[1] = 0.6f;
                  return Color.HSVToColor(hsv);
              }

              // ---------- Formes ----------

              static GradientDrawable pill(int fill, float radiusDp) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(fill);
                  g.setCornerRadius(dp(radiusDp));
                  return g;
              }

              static GradientDrawable pill(int fill, int stroke, float strokeDp, float radiusDp) {
                  GradientDrawable g = pill(fill, radiusDp);
                  g.setStroke(Math.max(1, dp(strokeDp)), stroke);
                  return g;
              }

              /** Fond "verre" au repos, couleur d'accent quand l'élément est sélectionné. */
              static StateListDrawable focusBg(int accent, int idle, float radiusDp) {
                  StateListDrawable s = new StateListDrawable();
                  s.addState(new int[]{android.R.attr.state_focused}, pill(accent, 0x55FFFFFF, 1.5f, radiusDp));
                  s.addState(new int[]{android.R.attr.state_pressed}, pill(accent, radiusDp));
                  s.addState(new int[]{}, idle == 0 ? pill(0x00000000, radiusDp) : pill(idle, 0x22FFFFFF, 1f, radiusDp));
                  return s;
              }

              // ---------- Dialogues ----------

              static void toast(Context c, String s) {
                  Toast.makeText(c.getApplicationContext(), s, Toast.LENGTH_LONG).show();
              }

              interface TextCallback {
                  void onText(String text);
              }

              @SuppressWarnings("deprecation")
              static void input(Activity a, String title, String hint, String value, final TextCallback cb) {
                  final EditText et = new EditText(a);
                  et.setSingleLine(true);
                  et.setHint(hint);
                  et.setText(value);
                  et.setSelection(et.getText().length());
                  et.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_URI);
                  et.setImeOptions(EditorInfo.IME_ACTION_DONE);
                  int p = dp(20);
                  et.setPadding(p, p, p, p);
                  final AlertDialog d = new AlertDialog.Builder(a, AlertDialog.THEME_DEVICE_DEFAULT_DARK)
                          .setTitle(title)
                          .setView(et)
                          .setPositiveButton("Valider", (dialog, which) -> cb.onText(et.getText().toString().trim()))
                          .setNegativeButton("Annuler", null)
                          .create();
                  et.setOnEditorActionListener((v, actionId, event) -> {
                      if (actionId == EditorInfo.IME_ACTION_DONE) {
                          cb.onText(et.getText().toString().trim());
                          d.dismiss();
                          return true;
                      }
                      return false;
                  });
                  d.show();
                  et.requestFocus();
              }
          }
