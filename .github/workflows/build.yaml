          final class Sheet extends FrameLayout {

              interface Pick {
                  void on(int index);
              }

              private final ViewGroup blocked;
              private final View prevFocus;
              private Runnable onClose;
              private boolean closed;

              static Sheet open(Activity a, FrameLayout root, ViewGroup blocked, String title, String subtitle,
                                String[] items, int checked, Pick pick) {
                  Sheet s = new Sheet(a, blocked, title, subtitle, items, checked, pick);
                  root.addView(s, new LayoutParams(LayoutParams.MATCH_PARENT, LayoutParams.MATCH_PARENT));
