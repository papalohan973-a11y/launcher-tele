          package com.launchertele.plus;

          import android.animation.ValueAnimator;
          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Rect;
          import android.text.TextUtils;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.animation.DecelerateInterpolator;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          /** Une tuile d'appli : icône, nom, effet de sélection (halo, contour ou zoom). */
          final class TileView extends LinearLayout {
              final String key;
              private final GlowView glow;
              private final TextView label;
              private final String text;
              private final String fx;
              private final boolean animate;
              private final int iconBoxSize;
              private boolean moving;
              private ValueAnimator pulse;

              TileView(Context c, String key, Bitmap icon, String text, int iconPx, int tileW, boolean showLabel, float textSp) {
                  super(c);
                  this.key = key;
                  this.text = text;
                  setOrientation(VERTICAL);
                  setGravity(Gravity.CENTER_HORIZONTAL);
                  setFocusable(true);
                  setClickable(true);
                  setLongClickable(true);
                  setClipChildren(false);
                  setClipToPadding(false);
                  fx = Prefs.s(c, "focus_fx", "halo");
                  animate = Theme.anim(c);
                  int accent = Theme.accent(c);
                  String shape = Prefs.s(c, "icon_shape", "squircle");

                  int pad = Util.dp(16);
                  iconBoxSize = iconPx + pad * 2;
                  FrameLayout box = new FrameLayout(c);
                  box.setClipChildren(false);
                  glow = new GlowView(c, IconFactory.glow(shape, iconPx, pad, false), IconFactory.glow(shape, iconPx, pad, true), accent);
                  glow.setAlpha(0f);
                  box.addView(glow, new FrameLayout.LayoutParams(iconBoxSize, iconBoxSize, Gravity.CENTER));
                  ImageView img = new ImageView(c);
                  img.setImageBitmap(icon);
                  img.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  box.addView(img, new FrameLayout.LayoutParams(iconPx, iconPx, Gravity.CENTER));
                  addView(box, new LayoutParams(iconBoxSize, iconBoxSize));

                  label = new TextView(c);
                  label.setText(text);
                  label.setTextColor(0xFFFFFFFF);
                  label.setTextSize(TypedValue.COMPLEX_UNIT_SP, textSp);
                  label.setTypeface(Theme.font(c, false));
                  label.setSingleLine(true);
                  label.setEllipsize(TextUtils.TruncateAt.END);
                  label.setGravity(Gravity.CENTER_HORIZONTAL);
                  label.setShadowLayer(Util.dp(4), 0, Util.dp(1), 0xB0000000);
                  label.setAlpha(0.78f);
                  LayoutParams lp = new LayoutParams(Math.max(iconPx, tileW - Util.dp(10)), LayoutParams.WRAP_CONTENT);
                  lp.topMargin = -pad + Util.dp(8);
                  addView(label, lp);
                  label.setVisibility(showLabel ? VISIBLE : GONE);
              }

              @Override
              protected void onSizeChanged(int w, int h, int ow, int oh) {
                  super.onSizeChanged(w, h, ow, oh);
                  setPivotX(w / 2f);
                  setPivotY(iconBoxSize / 2f);
              }

              @Override
              protected void onFocusChanged(boolean focused, int direction, Rect previous) {
                  super.onFocusChanged(focused, direction, previous);
                  apply(focused, animate);
              }

              void apply(boolean focused, boolean anim) {
                  float sc = focused || moving ? ("zoom".equals(fx) ? 1.17f : 1.12f) : 1f;
                  float ga = (focused || moving) && !("zoom".equals(fx) && !moving) ? 1f : 0f;
                  glow.setMode(moving || "outline".equals(fx) ? GlowView.RING : GlowView.HALO);
                  if (anim) {
                      animate().scaleX(sc).scaleY(sc).setDuration(180).setInterpolator(new DecelerateInterpolator(1.6f)).start();
                      glow.animate().alpha(ga).setDuration(180).start();
                  } else {
                      setScaleX(sc);
                      setScaleY(sc);
                      glow.setAlpha(ga);
                  }
                  setTranslationZ(focused || moving ? 20f : 0f);
                  label.setAlpha(focused || moving ? 1f : 0.78f);
                  label.setTypeface(Theme.font(getContext(), focused || moving));
              }

              void setMoving(boolean m) {
                  moving = m;
                  label.setText(m ? "◀  " + text + "  ▶" : text);
                  if (pulse != null) {
                      pulse.cancel();
                      pulse = null;
                  }
                  if (m) {
                      pulse = ValueAnimator.ofFloat(0.45f, 1f);
                      pulse.setDuration(650);
                      pulse.setRepeatMode(ValueAnimator.REVERSE);
                      pulse.setRepeatCount(ValueAnimator.INFINITE);
                      pulse.addUpdateListener(a -> glow.setAlpha((Float) a.getAnimatedValue()));
                      pulse.start();
                  }
                  apply(hasFocus(), false);
              }

              @Override
              protected void onDetachedFromWindow() {
                  if (pulse != null) pulse.cancel();
                  super.onDetachedFromWindow();
              }

              /** Dessine le halo (flou coloré) ou le contour autour de l'icône. */
              static final class GlowView extends View {
                  static final int HALO = 0, RING = 1;
                  private final Bitmap halo, ring;
                  private final Paint paint = new Paint(Paint.FILTER_BITMAP_FLAG);
                  private final Paint ringPaint = new Paint(Paint.FILTER_BITMAP_FLAG);
                  private int mode = HALO;

                  GlowView(Context c, Bitmap halo, Bitmap ring, int accent) {
                      super(c);
                      this.halo = halo;
                      this.ring = ring;
                      paint.setColor(Util.alpha(accent, 0xE6));
                      ringPaint.setColor(accent);
                  }

                  void setMode(int m) {
                      if (m != mode) {
                          mode = m;
                          invalidate();
                      }
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      if (mode == HALO) {
                          c.drawBitmap(halo, (getWidth() - halo.getWidth()) / 2f, (getHeight() - halo.getHeight()) / 2f, paint);
                          ringPaint.setAlpha(0x70);
                          ringPaint.setColor(Util.alpha(0xFFFFFFFF, 0x70));
                          c.drawBitmap(ring, (getWidth() - ring.getWidth()) / 2f, (getHeight() - ring.getHeight()) / 2f, ringPaint);
                      } else {
                          ringPaint.setColor(paint.getColor() | 0xFF000000);
                          c.drawBitmap(ring, (getWidth() - ring.getWidth()) / 2f, (getHeight() - ring.getHeight()) / 2f, ringPaint);
                      }
                  }
              }
          }
