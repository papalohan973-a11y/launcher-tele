          /** VPN : détection des applis VPN installées, état de la connexion, ouverture. */
          final class Vpn {
              static final String PROTON = "ch.protonvpn.android";

              private Vpn() {}

              /** Paires {paquet, nom} des applis VPN installées. */
              static List<String[]> apps(Context c) {
                  PackageManager pm = c.getPackageManager();
                  List<String[]> out = new ArrayList<>();
                  LinkedHashSet<String> seen = new LinkedHashSet<>();
                  try {
                      List<ResolveInfo> l = pm.queryIntentServices(new Intent("android.net.VpnService"), 0);
                      for (ResolveInfo ri : l) {
                          if (ri.serviceInfo == null) continue;
                          String pkg = ri.serviceInfo.packageName;
                          if (!seen.add(pkg)) continue;
                          CharSequence label = ri.serviceInfo.applicationInfo.loadLabel(pm);
                          out.add(new String[]{pkg, label == null ? pkg : label.toString()});
                      }
                  } catch (Exception ignored) {
                  }
                  return out;
              }

              static String chosen(Context c) {
                  String p = Prefs.s(c, "vpn_pkg", "");
                  if (!p.isEmpty() && AppRepo.installed(c, p)) return p;
                  List<String[]> l = apps(c);
                  for (String[] a : l) if (a[0].equals(PROTON)) return PROTON;
                  return l.isEmpty() ? null : l.get(0)[0];
              }

              @SuppressWarnings("deprecation")
              static boolean active(Context c) {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) c.getSystemService(Context.CONNECTIVITY_SERVICE);
                      for (Network n : cm.getAllNetworks()) {
                          NetworkCapabilities nc = cm.getNetworkCapabilities(n);
                          if (nc != null && nc.hasTransport(NetworkCapabilities.TRANSPORT_VPN)) return true;
                      }
                  } catch (Exception ignored) {
                  }
                  return false;
              }

              /** Ouvre l'appli VPN ; renvoie false s'il n'y en a aucune. */
              static boolean open(Activity a) {
                  String pkg = chosen(a);
                  return pkg != null && AppRepo.launchPackage(a, pkg);
              }

              static void installProton(Activity a) {
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=" + PROTON));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      a.startActivity(i);
                  } catch (Exception e) {
                      WebActivity.openUrl(a, "https://play.google.com/store/apps/details?id=" + PROTON);
                  }
              }

              static void systemSettings(Activity a) {
                  try {
                      a.startActivity(new Intent(Settings.ACTION_VPN_SETTINGS));
                  } catch (Exception e) {
                      try {
                          a.startActivity(new Intent(Settings.ACTION_SETTINGS));
                      } catch (Exception ignored) {
                          Util.toast(a, "Réglages indisponibles sur cette télé.");
                      }
                  }
              }
          }
