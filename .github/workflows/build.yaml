# ==========================================================================
#  LAUNCHER TÉLÉ v2 — fichier unique qui contient TOUT le code de l'appli.
#  À chaque enregistrement (Commit), GitHub construit l'APK tout seul et le
#  publie dans « Releases ». Le launcher se met ensuite à jour tout seul.
#  Lien à taper dans Downloader (remplace TON-PSEUDO par ton nom GitHub) :
#  https://github.com/TON-PSEUDO/launcher-tele/releases/latest/download/launcher-tele.apk
# ==========================================================================
name: Construire Launcher Télé

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Écrire le code de l'appli
        run: |
          set -e
          mkdir -p app/res/drawable app/java/com/launchertele/plus
          cat > app/AndroidManifest.xml <<'LT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
