                  }

                  @Override
                  public View getView(int pos, View convert, ViewGroup parent) {
                      final ImageView iv;
                      if (convert instanceof ImageView) {
                          iv = (ImageView) convert;
                      } else {
                          iv = new ImageView(MediaPickerActivity.this);
                          iv.setScaleType(ImageView.ScaleType.CENTER_CROP);
                          iv.setBackground(Util.pill(0x22FFFFFF, 12));
                          iv.setClipToOutline(true);
                          int w = (grid.getWidth() - Util.dp(14) * 4 - Util.dp(12)) / 5;
                          iv.setLayoutParams(new AbsListView.LayoutParams(-1, Math.max(Util.dp(80), w * 9 / 16)));
                      }
                      final Uri uri = items.get(pos);
                      final String key = uri.toString();
                      iv.setTag(key);
                      Bitmap b = thumbs.get(key);
                      iv.setImageBitmap(b);
                      if (b == null) {
                          Util.IO.execute(() -> {
                              final Bitmap t = thumb(uri);
                              if (t == null) return;
                              thumbs.put(key, t);
                              Util.MAIN.post(() -> {
                                  if (key.equals(iv.getTag())) iv.setImageBitmap(t);
                              });
                          });
                      }
                      return iv;
                  }
              }

              private void choose(final Uri uri) {
                  if (busy) return;
                  busy = true;
                  status.setText(video ? "Copie de la vidéo… (patiente un instant)" : "Préparation de la photo…");
                  Util.IO.execute(() -> {
                      boolean ok = video ? copyVideo(uri) : savePhoto(uri);
                      final boolean success = ok;
                      Util.MAIN.post(() -> {
                          busy = false;
                          if (success) {
                              Prefs.set(this, "wp_type", video ? "video" : "photo");
                              Util.toast(this, "Nouveau fond appliqué !");
                              finish();
                          } else {
                              status.setText("Impossible d'utiliser ce fichier, essaie-en un autre.");
                          }
                      });
                  });
              }

              private boolean copyVideo(Uri uri) {
                  try {
                      File out = Backdrop.file(this, "wall_video.mp4");
                      File tmp = Backdrop.file(this, "wall_video.part");
                      InputStream in = getContentResolver().openInputStream(uri);
                      if (in == null) return false;
                      OutputStream os = new FileOutputStream(tmp);
                      try {
                          Util.copy(in, os);
                      } finally {
                          in.close();
                          os.close();
                      }
                      Util.moveInto(tmp, out);
                      Bitmap t = thumbs.get(uri.toString());
                      if (t == null) t = thumb(uri);
                      if (t != null) Prefs.set(this, "video_accent", Util.vivid(IconFactory.dominant(t)), false);
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private boolean savePhoto(Uri uri) {
                  try {
                      DisplayMetrics dm = getResources().getDisplayMetrics();
                      int tw = Math.max(dm.widthPixels, dm.heightPixels), th = Math.min(dm.widthPixels, dm.heightPixels);
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      InputStream in = getContentResolver().openInputStream(uri);
                      if (in == null) return false;
                      BitmapFactory.decodeStream(in, null, o);
                      in.close();
                      int s = 1;
                      while (o.outWidth / (s * 2) >= tw && o.outHeight / (s * 2) >= th) s *= 2;
                      BitmapFactory.Options o2 = new BitmapFactory.Options();
                      o2.inSampleSize = s;
                      in = getContentResolver().openInputStream(uri);
                      Bitmap bmp = BitmapFactory.decodeStream(in, null, o2);
                      if (in != null) in.close();
                      if (bmp == null) return false;
                      int rot = 0;
                      if (Build.VERSION.SDK_INT >= 24) {
                          try (InputStream ei = getContentResolver().openInputStream(uri)) {
                              if (ei != null) {
                                  int or = new ExifInterface(ei).getAttributeInt(ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL);
                                  if (or == ExifInterface.ORIENTATION_ROTATE_90) rot = 90;
                                  else if (or == ExifInterface.ORIENTATION_ROTATE_180) rot = 180;
                                  else if (or == ExifInterface.ORIENTATION_ROTATE_270) rot = 270;
                              }
                          } catch (Exception ignored) {
                          }
                      }
                      if (rot != 0) {
                          Matrix m = new Matrix();
                          m.postRotate(rot);
                          bmp = Bitmap.createBitmap(bmp, 0, 0, bmp.getWidth(), bmp.getHeight(), m, true);
                      }
                      File out = Backdrop.file(this, "wall_photo.jpg");
                      File tmp = Backdrop.file(this, "wall_photo.part");
                      OutputStream os = new FileOutputStream(tmp);
                      bmp.compress(Bitmap.CompressFormat.JPEG, 92, os);
                      os.close();
                      Util.moveInto(tmp, out);
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }
          }
