# Launcher Télé : ce fichier contient tout le code de l'application.
# À chaque modification, GitHub reconstruit l'APK et le publie dans « Releases ».
name: Construire Launcher Tele

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Creer les fichiers du projet
        run: |
          mkdir -p src/main src/main/java/com/launchertele/app src/main/res/drawable src/main/res/values src/main/res/xml
          cat > settings.gradle <<'LTEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'launcher-tele'
          LTEOF
          cat > build.gradle <<'LTEOF'
          plugins {
              id 'com.android.application' version '8.5.2'
          }

          def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

          android {
              namespace 'com.launchertele.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.launchertele.app'
                  minSdk 23
                  targetSdk 34
                  versionCode runNumber
                  versionName "1.0.${runNumber}"
              }

              signingConfigs {
                  release {
                      storeFile file('release.p12')
                      storeType 'pkcs12'
                      storePassword 'launchertele'
                      keyAlias 'launcher'
                      keyPassword 'launchertele'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          LTEOF
          cat > gradle.properties <<'LTEOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          LTEOF
          cat > src/main/AndroidManifest.xml <<'LTEOF'
