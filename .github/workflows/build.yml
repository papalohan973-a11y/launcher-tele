          package com.launchertele.app;

          import android.graphics.drawable.Drawable;

          /** Une application installée, prête à afficher. */
          final class AppEntry {
              final String pkg;
              final String cls;
              final String label;
              final boolean tvApp;
              final Drawable banner;
              final Drawable icon;
              final int color;

              AppEntry(String pkg, String cls, String label, boolean tvApp,
                       Drawable banner, Drawable icon, int color) {
                  this.pkg = pkg;
                  this.cls = cls;
                  this.label = label;
                  this.tvApp = tvApp;
                  this.banner = banner;
                  this.icon = icon;
                  this.color = color;
              }
          }
