          cat > src/main/java/com/launchertele/app/AppLoader.java <<'LTEOF'
          package com.launchertele.app;

          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ActivityInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.drawable.Drawable;

          import java.text.Collator;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;

          /** Récupère la liste des applis lançables (applis TV en priorité). */
          final class AppLoader {

              private AppLoader() {}

              static List<AppEntry> load(Context c) {
                  PackageManager pm = c.getPackageManager();
                  String self = c.getPackageName();
                  Map<String, AppEntry> map = new LinkedHashMap<>();

                  Intent tv = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER);
                  for (ResolveInfo ri : safeQuery(pm, tv)) {
                      add(pm, map, ri, true, self);
                  }
                  Intent phone = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER);
                  for (ResolveInfo ri : safeQuery(pm, phone)) {
                      add(pm, map, ri, false, self);
                  }

                  List<AppEntry> list = new ArrayList<>(map.values());
                  final Collator collator = Collator.getInstance(Locale.FRENCH);
                  collator.setStrength(Collator.PRIMARY);
                  Collections.sort(list, (a, b) -> collator.compare(a.label, b.label));
                  return list;
              }

              private static List<ResolveInfo> safeQuery(PackageManager pm, Intent i) {
                  try {
                      List<ResolveInfo> r = pm.queryIntentActivities(i, 0);
                      return r == null ? new ArrayList<>() : r;
                  } catch (Exception e) {
                      return new ArrayList<>();
                  }
              }

              private static void add(PackageManager pm, Map<String, AppEntry> map,
                                      ResolveInfo ri, boolean tvApp, String self) {
                  ActivityInfo ai = ri.activityInfo;
                  if (ai == null || ai.packageName == null) return;
                  if (ai.packageName.equals(self) || map.containsKey(ai.packageName)) return;
                  try {
                      CharSequence lbl = ri.loadLabel(pm);
                      String label = lbl == null ? ai.packageName : lbl.toString().trim();
                      Drawable banner = ai.loadBanner(pm);
                      if (banner == null && ai.applicationInfo != null) {
                          banner = ai.applicationInfo.loadBanner(pm);
                      }
                      Drawable icon = ri.loadIcon(pm);
                      int color = tileColor(icon);
                      map.put(ai.packageName,
                              new AppEntry(ai.packageName, ai.name, label, tvApp, banner, icon, color));
                  } catch (Exception ignored) {
                      // Une appli défectueuse ne doit pas bloquer tout l'écran d'accueil.
                  }
              }

              /** Couleur de fond de tuile, tirée de l'icône et assombrie. */
              static int tileColor(Drawable d) {
                  int fallback = Color.rgb(0x1E, 0x27, 0x45);
                  if (d == null) return fallback;
                  try {
                      Drawable copy = d.getConstantState() != null
                              ? d.getConstantState().newDrawable().mutate() : d;
                      int size = 16;
                      Bitmap b = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                      Canvas cv = new Canvas(b);
                      copy.setBounds(0, 0, size, size);
                      copy.draw(cv);
                      long r = 0, g = 0, bl = 0, n = 0;
                      for (int x = 0; x < size; x++) {
                          for (int y = 0; y < size; y++) {
                              int p = b.getPixel(x, y);
                              if (Color.alpha(p) < 128) continue;
                              int pr = Color.red(p), pg = Color.green(p), pb = Color.blue(p);
                              int max = Math.max(pr, Math.max(pg, pb));
                              int min = Math.min(pr, Math.min(pg, pb));
                              int weight = 1 + (max - min) / 16; // privilégie les couleurs vives
                              r += (long) pr * weight;
                              g += (long) pg * weight;
                              bl += (long) pb * weight;
                              n += weight;
                          }
                      }
                      b.recycle();
                      if (n == 0) return fallback;
                      float[] hsv = new float[3];
                      Color.RGBToHSV((int) (r / n), (int) (g / n), (int) (bl / n), hsv);
                      hsv[1] = Math.min(1f, hsv[1] * 0.9f);
                      hsv[2] = Math.max(0.18f, Math.min(0.42f, hsv[2] * 0.55f));
                      return Color.HSVToColor(hsv);
                  } catch (Exception e) {
                      return fallback;
                  }
              }
          }
          LTEOF
          cat > src/main/java/com/launchertele/app/HomeService.java <<'LTEOF'
          package com.launchertele.app;

          import android.accessibilityservice.AccessibilityService;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.os.SystemClock;
          import android.provider.Settings;
          import android.view.KeyEvent;
          import android.view.accessibility.AccessibilityEvent;

          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          /**
           * Service d'accessibilité : redirige le bouton Accueil de la télécommande
           * (et l'accueil d'origine quand il apparaît) vers Launcher Télé.
           */
          public class HomeService extends AccessibilityService {

              private final Set<String> stockLaunchers = new HashSet<>();
              private long lastLaunch;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  refreshStockLaunchers();
              }

              private void refreshStockLaunchers() {
                  stockLaunchers.clear();
                  stockLaunchers.add("com.google.android.tvlauncher");
                  stockLaunchers.add("com.google.android.leanbacklauncher");
                  stockLaunchers.add("com.google.android.apps.tv.launcherx");
                  try {
                      Intent home = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME);
                      List<ResolveInfo> list = getPackageManager()
                              .queryIntentActivities(home, PackageManager.MATCH_ALL);
                      for (ResolveInfo ri : list) {
                          if (ri.activityInfo == null) continue;
                          String p = ri.activityInfo.packageName;
                          if (p == null || p.equals(getPackageName())) continue;
                          String lower = p.toLowerCase();
                          // Ne jamais détourner les écrans système (réglages, configuration initiale).
                          if (lower.contains("settings") || lower.contains("setup")
                                  || lower.contains("provision") || lower.contains("wraith")) continue;
                          stockLaunchers.add(p);
                      }
                  } catch (Exception ignored) {
                  }
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null || event.getEventType() != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                      return;
                  }
                  CharSequence pkg = event.getPackageName();
                  if (pkg != null && stockLaunchers.contains(pkg.toString())) {
                      goHome();
                  }
              }

              @Override
              protected boolean onKeyEvent(KeyEvent event) {
                  if (event.getKeyCode() == KeyEvent.KEYCODE_HOME) {
                      if (event.getAction() == KeyEvent.ACTION_UP) goHome();
                      return true;
                  }
                  return false;
              }

              private void goHome() {
                  long now = SystemClock.elapsedRealtime();
                  if (now - lastLaunch < 400) return;
                  lastLaunch = now;
                  Intent i = new Intent(this, MainActivity.class);
                  i.setAction(Intent.ACTION_MAIN);
                  i.addCategory(Intent.CATEGORY_HOME);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK
                          | Intent.FLAG_ACTIVITY_CLEAR_TOP
                          | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  try {
                      startActivity(i);
                  } catch (Exception ignored) {
                  }
              }

              @Override
              public void onInterrupt() {
              }

              /** Indique si l'utilisateur a activé ce service dans Accessibilité. */
              static boolean isEnabled(Context c) {
                  try {
                      String s = Settings.Secure.getString(c.getContentResolver(),
                              Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                      if (s == null) return false;
                      String full = new ComponentName(c, HomeService.class).flattenToString();
                      String shortName = new ComponentName(c, HomeService.class).flattenToShortString();
                      for (String part : s.split(":")) {
                          if (part.equalsIgnoreCase(full) || part.equalsIgnoreCase(shortName)) return true;
                      }
                      return false;
                  } catch (Exception e) {
                      return false;
                  }
              }
          }
          LTEOF
          cat > src/main/java/com/launchertele/app/MainActivity.java <<'LTEOF'
          package com.launchertele.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.BroadcastReceiver;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.util.DisplayMetrics;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextClock;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.List;
          import java.util.Set;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          /** Écran d'accueil principal : horloge, favoris, accès rapide, toutes les applis. */
          public class MainActivity extends Activity {

              private static final int COLUMNS = 5;

              private static final int COLOR_TEXT = Color.WHITE;
              private static final int COLOR_MUTED = Color.argb(170, 214, 222, 245);
              private static final int COLOR_ACCENT = Color.rgb(0x5B, 0x8C, 0xFF);
              private static final int COLOR_CARD = Color.rgb(0x18, 0x21, 0x3D);

              /** Applis mises en favoris au premier lancement si elles sont installées. */
              private static final String[] DEFAULT_FAVORITES = {
                      "com.google.android.youtube.tv",
                      "com.netflix.ninja",
                      "com.amazon.amazonvideo.livingroom",
                      "com.disney.disneyplus",
                      "com.spotify.tv.android",
                      "com.canal.android.canal",
                      "com.google.android.youtube.tvmusic",
              };

              private final ExecutorService executor = Executors.newSingleThreadExecutor();
              private final Handler main = new Handler(Looper.getMainLooper());

              private Prefs prefs;
              private List<AppEntry> apps = new ArrayList<>();
              private boolean dirty = false;

              private int pad, gap, tileW, tileH;

              private ScrollView scroll;
              private TextView greeting;
              private LinearLayout favRow;
              private TextView favEmpty;
              private LinearLayout quickRow;
              private TextView allTitle;
              private LinearLayout grid;
              private TextView homeKeyStatus;
              private BroadcastReceiver packageReceiver;

              // ---------------------------------------------------------------- cycle de vie

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = new Prefs(this);
                  computeSizes();
                  setContentView(buildUi());
                  registerPackageReceiver();
                  loadApps(null, false);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  updateGreeting();
                  updateHomeKeyStatus();
                  if (dirty) {
                      dirty = false;
                      loadApps(null, false);
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  // Bouton Accueil pressé alors qu'on est déjà là : retour en haut.
                  if (scroll != null) scroll.smoothScrollTo(0, 0);
                  focusFirst();
              }

              @Override
              public void onBackPressed() {
                  // Un écran d'accueil ne se ferme pas avec Retour.
                  if (scroll != null) scroll.smoothScrollTo(0, 0);
                  focusFirst();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (packageReceiver != null) {
                      try {
                          unregisterReceiver(packageReceiver);
                      } catch (Exception ignored) {
                      }
                  }
                  executor.shutdownNow();
              }

              private void registerPackageReceiver() {
                  packageReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          if (hasWindowFocus()) loadApps(null, false); else dirty = true;
                      }
                  };
                  IntentFilter f = new IntentFilter();
                  f.addAction(Intent.ACTION_PACKAGE_ADDED);
                  f.addAction(Intent.ACTION_PACKAGE_REMOVED);
                  f.addAction(Intent.ACTION_PACKAGE_CHANGED);
                  f.addAction(Intent.ACTION_PACKAGE_REPLACED);
                  f.addDataScheme("package");
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(packageReceiver, f, Context.RECEIVER_EXPORTED);
                  } else {
                      registerReceiver(packageReceiver, f);
                  }
              }

              // ---------------------------------------------------------------- tailles

              private int dp(float v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v,
                          getResources().getDisplayMetrics());
              }

              private void computeSizes() {
                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  int width = Math.max(dm.widthPixels, dm.heightPixels);
                  pad = dp(56);
                  gap = dp(22);
                  tileW = (width - 2 * pad - (COLUMNS - 1) * gap) / COLUMNS;
                  tileH = tileW * 9 / 16;
              }

              // ---------------------------------------------------------------- construction de l'écran

              private View buildUi() {
                  FrameLayout root = new FrameLayout(this);
                  GradientDrawable bg = new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                          new int[]{Color.rgb(0x10, 0x1A, 0x3A), Color.rgb(0x0A, 0x0F, 0x1E),
                                  Color.rgb(0x15, 0x0C, 0x2A)});
                  root.setBackground(bg);

                  scroll = new ScrollView(this);
                  scroll.setVerticalScrollBarEnabled(false);
                  scroll.setFillViewport(true);
                  scroll.setClipToPadding(false);
                  scroll.setSmoothScrollingEnabled(true);
                  root.addView(scroll, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  LinearLayout content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setClipChildren(false);
                  content.setClipToPadding(false);
                  content.setPadding(0, dp(36), 0, dp(64));
                  scroll.addView(content, new ScrollView.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  content.addView(buildHeader());

                  content.addView(sectionTitle("Favoris"));
                  favEmpty = text("Appuie longuement sur une appli (bouton OK maintenu) pour l'ajouter ici.",
                          16, COLOR_MUTED);
                  favEmpty.setPadding(pad, 0, pad, dp(8));
                  favEmpty.setVisibility(View.GONE);
                  content.addView(favEmpty);
                  favRow = new LinearLayout(this);
                  content.addView(horizontalRow(favRow));

                  content.addView(sectionTitle("Accès rapide"));
                  quickRow = new LinearLayout(this);
                  content.addView(horizontalRow(quickRow));
                  buildQuickActions();

                  allTitle = sectionTitle("Toutes les applications");
                  content.addView(allTitle);
                  grid = new LinearLayout(this);
                  grid.setOrientation(LinearLayout.VERTICAL);
                  grid.setClipChildren(false);
                  grid.setClipToPadding(false);
                  content.addView(grid, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  return root;
              }

              private View buildHeader() {
                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setGravity(Gravity.BOTTOM);
                  header.setPadding(pad, 0, pad, dp(4));

                  LinearLayout left = new LinearLayout(this);
                  left.setOrientation(LinearLayout.VERTICAL);

                  greeting = text("", 22, COLOR_MUTED);
                  left.addView(greeting);

                  TextClock time = new TextClock(this);
                  time.setFormat24Hour("HH:mm");
                  time.setFormat12Hour("HH:mm");
                  time.setTextColor(COLOR_TEXT);
                  time.setTextSize(TypedValue.COMPLEX_UNIT_SP, 76);
                  time.setTypeface(Typeface.create("sans-serif-light", Typeface.NORMAL));
                  time.setIncludeFontPadding(false);
                  left.addView(time);

                  TextClock date = new TextClock(this);
                  date.setFormat24Hour("EEEE d MMMM");
                  date.setFormat12Hour("EEEE d MMMM");
                  date.setTextColor(COLOR_MUTED);
                  date.setTextSize(TypedValue.COMPLEX_UNIT_SP, 22);
                  date.setAllCaps(false);
                  left.addView(date);

                  header.addView(left, new LinearLayout.LayoutParams(0,
                          ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  TextView hint = text("OK maintenu ou touche Menu : options d'une appli", 15, COLOR_MUTED);
                  hint.setGravity(Gravity.END);
                  header.addView(hint, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  return header;
              }

              private TextView sectionTitle(String s) {
                  TextView t = text(s, 21, Color.argb(225, 255, 255, 255));
                  t.setTypeface(Typeface.create("sans-serif-medium", Typeface.NORMAL));
                  t.setLetterSpacing(0.02f);
                  t.setPadding(pad, dp(34), pad, dp(4));
                  return t;
              }

              private TextView text(String s, float sp, int color) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, sp);
                  t.setTextColor(color);
                  return t;
              }

              private View horizontalRow(LinearLayout row) {
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setClipChildren(false);
                  row.setClipToPadding(false);
                  row.setPadding(pad, dp(14), pad, dp(14));
                  HorizontalScrollView hsv = new HorizontalScrollView(this);
                  hsv.setHorizontalScrollBarEnabled(false);
                  hsv.setClipChildren(false);
                  hsv.setClipToPadding(false);
                  hsv.setSmoothScrollingEnabled(true);
                  hsv.addView(row, new HorizontalScrollView.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  hsv.setLayoutParams(new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  return hsv;
              }

              // ---------------------------------------------------------------- accès rapide

              private void buildQuickActions() {
                  quickRow.removeAllViews();

                  Drawable store = null;
                  try {
                      store = getPackageManager().getApplicationIcon("com.android.vending");
                  } catch (PackageManager.NameNotFoundException ignored) {
                  }
                  quickRow.addView(actionTile("Play Store", "Installer des applis", store, false,
                          Color.rgb(0x0F, 0x5C, 0x4A), this::openPlayStore));

                  quickRow.addView(actionTile("Paramètres", "Réglages de la télé",
                          getDrawable(android.R.drawable.ic_menu_preferences), true,
                          Color.rgb(0x2A, 0x34, 0x5C),
                          () -> startFirst(new Intent(Settings.ACTION_SETTINGS))));

                  quickRow.addView(actionTile("Réseau", "Wi-Fi et Internet",
                          getDrawable(android.R.drawable.ic_menu_upload), true,
                          Color.rgb(0x1D, 0x4E, 0x7A),
                          () -> startFirst(new Intent(Settings.ACTION_WIFI_SETTINGS),
                                  new Intent(Settings.ACTION_SETTINGS))));

                  quickRow.addView(actionTile("Gérer les applis", "Stockage, désinstaller",
                          getDrawable(android.R.drawable.ic_menu_manage), true,
                          Color.rgb(0x4A, 0x2C, 0x6E),
                          () -> startFirst(new Intent(Settings.ACTION_APPLICATION_SETTINGS),
                                  new Intent(Settings.ACTION_SETTINGS))));

                  View homeTile = actionTile("Bouton Accueil", "", getDrawable(android.R.drawable.ic_menu_myplaces),
                          true, Color.rgb(0x6E, 0x3A, 0x1C), this::openAccessibility);
                  homeKeyStatus = (TextView) homeTile.findViewWithTag("subtitle");
                  quickRow.addView(homeTile);
                  updateHomeKeyStatus();
              }

              private void updateHomeKeyStatus() {
                  if (homeKeyStatus == null) return;
                  boolean on = HomeService.isEnabled(this);
                  homeKeyStatus.setText(on ? "Activé" : "À activer (Accessibilité)");
                  homeKeyStatus.setTextColor(on ? Color.rgb(0x7D, 0xE3, 0xA0) : Color.rgb(0xFF, 0xC0, 0x7A));
              }

              private void openPlayStore() {
                  PackageManager pm = getPackageManager();
                  Intent i = pm.getLeanbackLaunchIntentForPackage("com.android.vending");
                  if (i == null) i = pm.getLaunchIntentForPackage("com.android.vending");
                  if (i == null) {
                      i = new Intent(Intent.ACTION_VIEW, Uri.parse("market://search?q=apps"));
                  }
                  startFirst(i);
              }

              private void openAccessibility() {
                  Toast.makeText(this,
                          "Choisis « Launcher Télé : bouton Accueil » puis active-le.",
                          Toast.LENGTH_LONG).show();
                  startFirst(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS),
                          new Intent(Settings.ACTION_SETTINGS));
              }

              private void startFirst(Intent... candidates) {
                  for (Intent i : candidates) {
                      if (i == null) continue;
                      try {
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                          return;
                      } catch (Exception ignored) {
                      }
                  }
                  Toast.makeText(this, "Impossible d'ouvrir cet écran sur cette télé.", Toast.LENGTH_SHORT).show();
              }

              // ---------------------------------------------------------------- chargement des applis

              private void loadApps(final String focusPkg, final boolean focusInFavorites) {
                  final Context ctx = getApplicationContext();
                  try {
                      executor.execute(() -> {
                          final List<AppEntry> list = AppLoader.load(ctx);
                          main.post(() -> {
                              if (isFinishing() || isDestroyed()) return;
                              apps = list;
                              seedFavoritesOnce();
                              render(focusPkg, focusInFavorites);
                          });
                      });
                  } catch (Exception ignored) {
                  }
              }

              private void seedFavoritesOnce() {
                  if (prefs.isInitialized() || apps.isEmpty()) return;
                  List<String> favs = new ArrayList<>();
                  for (String p : DEFAULT_FAVORITES) {
                      if (find(p) != null) favs.add(p);
                  }
                  for (AppEntry e : apps) {
                      if (favs.size() >= 4) break;
                      if (e.tvApp && e.banner != null && !favs.contains(e.pkg)
                              && !e.pkg.equals("com.android.vending")) {
                          favs.add(e.pkg);
                      }
                  }
                  prefs.saveFavorites(favs);
                  prefs.setInitialized();
              }

              private AppEntry find(String pkg) {
                  for (AppEntry e : apps) if (e.pkg.equals(pkg)) return e;
                  return null;
              }

              private void render(String focusPkg, boolean focusInFavorites) {
                  Set<String> hidden = prefs.hidden();

                  // Favoris
                  favRow.removeAllViews();
                  for (String p : prefs.favorites()) {
                      AppEntry e = find(p);
                      if (e != null && !hidden.contains(p)) favRow.addView(appTile(e, true));
                  }
                  favEmpty.setVisibility(favRow.getChildCount() == 0 ? View.VISIBLE : View.GONE);

                  // Toutes les applis, en grille
                  grid.removeAllViews();
                  List<AppEntry> visible = new ArrayList<>();
                  for (AppEntry e : apps) if (!hidden.contains(e.pkg)) visible.add(e);
                  allTitle.setText("Toutes les applications  ·  " + visible.size());

                  LinearLayout row = null;
                  for (int i = 0; i < visible.size(); i++) {
                      if (i % COLUMNS == 0) {
                          row = new LinearLayout(this);
                          row.setOrientation(LinearLayout.HORIZONTAL);
                          row.setClipChildren(false);
                          row.setClipToPadding(false);
                          row.setPadding(pad, dp(12), pad, dp(12));
                          grid.addView(row);
                      }
                      row.addView(appTile(visible.get(i), false));
                  }

                  if (!hidden.isEmpty()) {
                      TextView more = text("Applications masquées (" + hidden.size() + ")  ›", 17, COLOR_MUTED);
                      more.setFocusable(true);
                      more.setClickable(true);
                      more.setPadding(dp(18), dp(12), dp(18), dp(12));
                      more.setBackground(rounded(Color.argb(40, 255, 255, 255), dp(24), 0, 0));
                      more.setOnFocusChangeListener((v, has) -> {
                          v.setBackground(rounded(has ? COLOR_ACCENT : Color.argb(40, 255, 255, 255), dp(24), 0, 0));
                          ((TextView) v).setTextColor(has ? COLOR_TEXT : COLOR_MUTED);
                      });
                      more.setOnClickListener(v -> showHiddenApps());
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                      lp.setMargins(pad, dp(24), pad, 0);
                      grid.addView(more, lp);
                  }

                  if (focusPkg != null && restoreFocus(focusPkg, focusInFavorites)) return;
                  View current = getCurrentFocus();
                  if (current == null || current.getParent() == null || !current.isAttachedToWindow()) {
                      focusFirst();
                  }
              }

              private boolean restoreFocus(String pkg, boolean inFavorites) {
                  ViewGroup first = inFavorites ? favRow : grid;
                  ViewGroup second = inFavorites ? grid : favRow;
                  View v = findTile(first, pkg);
                  if (v == null) v = findTile(second, pkg);
                  if (v != null) {
                      v.requestFocus();
                      return true;
                  }
                  focusFirst();
                  return false;
              }

              private View findTile(ViewGroup parent, String pkg) {
                  for (int i = 0; i < parent.getChildCount(); i++) {
                      View c = parent.getChildAt(i);
                      if (pkg.equals(c.getTag())) return c;
                      if (c instanceof ViewGroup && !(c.getTag() instanceof String)) {
                          View r = findTile((ViewGroup) c, pkg);
                          if (r != null) return r;
                      }
                  }
                  return null;
              }

              private void focusFirst() {
                  if (favRow != null && favRow.getChildCount() > 0) {
                      favRow.getChildAt(0).requestFocus();
                  } else if (quickRow != null && quickRow.getChildCount() > 0) {
                      quickRow.getChildAt(0).requestFocus();
                  }
              }

              private void updateGreeting() {
                  if (greeting == null) return;
                  int h = Calendar.getInstance().get(Calendar.HOUR_OF_DAY);
                  String g;
                  if (h < 5) g = "Bonne nuit";
                  else if (h < 12) g = "Bonjour";
                  else if (h < 18) g = "Bon après-midi";
                  else g = "Bonsoir";
                  greeting.setText(g);
              }

              // ---------------------------------------------------------------- tuiles

              private GradientDrawable rounded(int fill, int radius, int strokeW, int strokeColor) {
                  GradientDrawable d = new GradientDrawable();
                  d.setShape(GradientDrawable.RECTANGLE);
                  d.setCornerRadius(radius);
                  d.setColor(fill);
                  if (strokeW > 0) d.setStroke(strokeW, strokeColor);
                  return d;
              }

              /** Tuile d'application 16:9 avec son nom dessous. */
              private View appTile(final AppEntry e, final boolean inFavorites) {
                  LinearLayout box = baseBox(e.pkg);

                  FrameLayout card = new FrameLayout(this);
                  card.setBackground(rounded(e.banner != null ? COLOR_CARD : e.color, dp(14), 0, 0));
                  card.setClipToOutline(true);

                  if (e.banner != null) {
                      ImageView img = new ImageView(this);
                      img.setScaleType(ImageView.ScaleType.CENTER_CROP);
                      img.setImageDrawable(e.banner);
                      card.addView(img, new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  } else {
                      ImageView img = new ImageView(this);
                      img.setScaleType(ImageView.ScaleType.FIT_CENTER);
                      img.setImageDrawable(e.icon);
                      int s = Math.min(dp(64), tileH * 2 / 3);
                      card.addView(img, new FrameLayout.LayoutParams(s, s, Gravity.CENTER));
                  }
                  View border = focusBorder();
                  card.addView(border);
                  box.addView(card, new LinearLayout.LayoutParams(tileW, tileH));

                  TextView label = text(e.label, 15, COLOR_MUTED);
                  label.setSingleLine(true);
                  label.setEllipsize(TextUtils.TruncateAt.END);
                  label.setPadding(dp(4), dp(10), dp(4), 0);
                  box.addView(label, new LinearLayout.LayoutParams(tileW, ViewGroup.LayoutParams.WRAP_CONTENT));

                  wireFocus(box, border, label);
                  box.setOnClickListener(v -> launch(e));
                  box.setOnLongClickListener(v -> {
                      showAppMenu(e, inFavorites);
                      return true;
                  });
                  box.setOnKeyListener((v, keyCode, ev) -> {
                      if (keyCode == KeyEvent.KEYCODE_MENU) {
                          if (ev.getAction() == KeyEvent.ACTION_UP) showAppMenu(e, inFavorites);
                          return true;
                      }
                      return false;
                  });
                  return box;
              }

              /** Tuile d'action (Play Store, Paramètres…). */
              private View actionTile(String title, String subtitle, Drawable icon, boolean tint,
                                      int color, final Runnable action) {
                  LinearLayout box = baseBox("action:" + title);

                  FrameLayout card = new FrameLayout(this);
                  card.setBackground(rounded(color, dp(14), 0, 0));
                  card.setClipToOutline(true);

                  LinearLayout inner = new LinearLayout(this);
                  inner.setOrientation(LinearLayout.HORIZONTAL);
                  inner.setGravity(Gravity.CENTER_VERTICAL);
                  inner.setPadding(dp(16), 0, dp(12), 0);

                  if (icon != null) {
                      Drawable d = icon.mutate();
                      if (tint) d.setTint(Color.WHITE);
                      ImageView img = new ImageView(this);
                      img.setImageDrawable(d);
                      img.setScaleType(ImageView.ScaleType.FIT_CENTER);
                      LinearLayout.LayoutParams ilp = new LinearLayout.LayoutParams(dp(36), dp(36));
                      ilp.rightMargin = dp(12);
                      inner.addView(img, ilp);
                  }

                  LinearLayout texts = new LinearLayout(this);
                  texts.setOrientation(LinearLayout.VERTICAL);
                  TextView t1 = text(title, 17, COLOR_TEXT);
                  t1.setTypeface(Typeface.create("sans-serif-medium", Typeface.NORMAL));
                  t1.setSingleLine(true);
                  t1.setEllipsize(TextUtils.TruncateAt.END);
                  TextView t2 = text(subtitle, 13, Color.argb(200, 255, 255, 255));
                  t2.setSingleLine(true);
                  t2.setEllipsize(TextUtils.TruncateAt.END);
                  t2.setTag("subtitle");
                  texts.addView(t1);
                  texts.addView(t2);
                  inner.addView(texts, new LinearLayout.LayoutParams(0,
                          ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  card.addView(inner, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  View border = focusBorder();
                  card.addView(border);
                  box.addView(card, new LinearLayout.LayoutParams(tileW, dp(78)));

                  wireFocus(box, border, null);
                  box.setOnClickListener(v -> action.run());
                  return box;
              }

              private LinearLayout baseBox(String tag) {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setFocusable(true);
                  box.setClickable(true);
                  box.setLongClickable(true);
                  box.setClipChildren(false);
                  box.setTag(tag);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          tileW, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lp.rightMargin = gap;
                  box.setLayoutParams(lp);
                  return box;
              }

              private View focusBorder() {
                  View border = new View(this);
                  border.setBackground(rounded(Color.TRANSPARENT, dp(14), dp(3), Color.WHITE));
                  border.setVisibility(View.INVISIBLE);
                  border.setLayoutParams(new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  return border;
              }

              private void wireFocus(final View box, final View border, final TextView label) {
                  box.setOnFocusChangeListener((v, has) -> {
                      float s = has ? 1.08f : 1f;
                      v.animate().scaleX(s).scaleY(s).translationZ(has ? dp(10) : 0)
                              .setDuration(150).start();
                      border.setVisibility(has ? View.VISIBLE : View.INVISIBLE);
                      if (label != null) label.setTextColor(has ? COLOR_TEXT : COLOR_MUTED);
                  });
              }

              // ---------------------------------------------------------------- actions

              private void launch(AppEntry e) {
                  Intent i = new Intent(Intent.ACTION_MAIN);
                  i.addCategory(e.tvApp ? Intent.CATEGORY_LEANBACK_LAUNCHER : Intent.CATEGORY_LAUNCHER);
                  i.setComponent(new ComponentName(e.pkg, e.cls));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                  try {
                      startActivity(i);
                  } catch (Exception ex) {
                      PackageManager pm = getPackageManager();
                      Intent alt = pm.getLeanbackLaunchIntentForPackage(e.pkg);
                      if (alt == null) alt = pm.getLaunchIntentForPackage(e.pkg);
                      if (alt != null) {
                          startFirst(alt);
                      } else {
                          Toast.makeText(this, "Impossible d'ouvrir " + e.label, Toast.LENGTH_SHORT).show();
                      }
                  }
              }

              private void showAppMenu(final AppEntry e, final boolean inFavorites) {
                  final boolean fav = prefs.isFavorite(e.pkg);
                  final List<String> labels = new ArrayList<>();
                  final List<Runnable> actions = new ArrayList<>();

                  labels.add("Ouvrir");
                  actions.add(() -> launch(e));

                  labels.add(fav ? "Retirer des favoris" : "Ajouter aux favoris");
                  actions.add(() -> {
                      prefs.toggleFavorite(e.pkg);
                      render(e.pkg, !fav);
                  });

                  if (fav) {
                      labels.add("Déplacer vers la gauche");
                      actions.add(() -> {
                          prefs.moveFavorite(e.pkg, -1);
                          render(e.pkg, true);
                      });
                      labels.add("Déplacer vers la droite");
                      actions.add(() -> {
                          prefs.moveFavorite(e.pkg, 1);
                          render(e.pkg, true);
                      });
                  }

                  labels.add("Masquer l'application");
                  actions.add(() -> {
                      prefs.setHidden(e.pkg, true);
                      render(null, false);
                      Toast.makeText(this, e.label + " est masquée.", Toast.LENGTH_SHORT).show();
                  });

                  labels.add("Infos de l'application");
                  actions.add(() -> startFirst(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                          Uri.parse("package:" + e.pkg))));

                  labels.add("Désinstaller");
                  actions.add(() -> startFirst(new Intent(Intent.ACTION_DELETE,
                          Uri.parse("package:" + e.pkg))));

                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(e.label)
                          .setItems(labels.toArray(new String[0]), (d, which) -> actions.get(which).run())
                          .show();
              }

              private void showHiddenApps() {
                  final List<String> pkgs = new ArrayList<>(prefs.hidden());
                  final List<String> names = new ArrayList<>();
                  for (String p : pkgs) {
                      AppEntry e = find(p);
                      names.add(e != null ? e.label : p);
                  }
                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle("Choisis une appli à réafficher")
                          .setItems(names.toArray(new String[0]), (d, which) -> {
                              String p = pkgs.get(which);
                              prefs.setHidden(p, false);
                              render(p, false);
                          })
                          .setNegativeButton("Fermer", null)
                          .show();
              }
          }
