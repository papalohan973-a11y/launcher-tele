          cat > src/main/java/com/launchertele/app/Prefs.java <<'LTEOF'
          package com.launchertele.app;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.text.TextUtils;

          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          /** Stockage des favoris (ordonnés) et des applis masquées. */
          final class Prefs {
              private static final String FILE = "launcher";
              private static final String KEY_FAVS = "favs";
              private static final String KEY_HIDDEN = "hidden";
              private static final String KEY_INIT = "init_done";

              private final SharedPreferences sp;

              Prefs(Context c) {
                  sp = c.getSharedPreferences(FILE, Context.MODE_PRIVATE);
              }

              boolean isInitialized() {
                  return sp.getBoolean(KEY_INIT, false);
              }

              void setInitialized() {
                  sp.edit().putBoolean(KEY_INIT, true).apply();
              }

              List<String> favorites() {
                  String raw = sp.getString(KEY_FAVS, "");
                  List<String> out = new ArrayList<>();
                  if (raw == null || raw.isEmpty()) return out;
                  for (String s : Arrays.asList(raw.split(","))) {
                      if (!s.isEmpty() && !out.contains(s)) out.add(s);
                  }
                  return out;
              }

              void saveFavorites(List<String> favs) {
                  sp.edit().putString(KEY_FAVS, TextUtils.join(",", favs)).apply();
              }

              boolean isFavorite(String pkg) {
                  return favorites().contains(pkg);
              }

              void toggleFavorite(String pkg) {
                  List<String> f = favorites();
                  if (f.contains(pkg)) f.remove(pkg); else f.add(pkg);
                  saveFavorites(f);
              }

              /** Déplace un favori : delta = -1 (gauche) ou +1 (droite). */
              void moveFavorite(String pkg, int delta) {
                  List<String> f = favorites();
                  int i = f.indexOf(pkg);
                  int j = i + delta;
                  if (i < 0 || j < 0 || j >= f.size()) return;
                  f.remove(i);
                  f.add(j, pkg);
                  saveFavorites(f);
              }

              Set<String> hidden() {
                  Set<String> s = sp.getStringSet(KEY_HIDDEN, null);
                  return s == null ? new HashSet<>() : new HashSet<>(s);
              }

              void setHidden(String pkg, boolean hide) {
                  Set<String> s = hidden();
                  if (hide) s.add(pkg); else s.remove(pkg);
                  sp.edit().putStringSet(KEY_HIDDEN, s).apply();
                  if (hide) {
                      List<String> f = favorites();
                      if (f.remove(pkg)) saveFavorites(f);
                  }
              }
          }
