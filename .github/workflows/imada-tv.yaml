          package tv.imada.app;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RadialGradient;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.os.SystemClock;
          import android.view.View;

          import java.util.Random;

          /** Fond animé d'une session : Globe Terre, Néon, Holographique, Aurore boréale, Étoiles. */
          public class SceneView extends View {

              private int scene, accent;
              private float speed;
              private final boolean compact;
              private final long start = SystemClock.uptimeMillis();

              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint bmpPaint = new Paint(Paint.FILTER_BITMAP_FLAG | Paint.ANTI_ALIAS_FLAG);
              private final Path path = new Path();
              private final RectF rf = new RectF();
              private final Rect dst = new Rect();

              private final float[] sx, sy, ss, sph;      // étoiles
              private final float[] qx, qs, qo;           // particules
              private final float[] ridge;                // relief des montagnes
              private EarthRenderer earth;

              private int w, h;
              private Shader bgShader, haloShader, sunShader;
              private Path hexPath;

              public SceneView(Context c, int scene, int accent, float speed, boolean compact) {
                  super(c);
                  this.scene = scene; this.accent = accent; this.speed = speed; this.compact = compact;
                  Random r = new Random(7);
                  int n = compact ? 70 : 240;
                  sx = new float[n]; sy = new float[n]; ss = new float[n]; sph = new float[n];
                  for (int i = 0; i < n; i++) {
                      sx[i] = r.nextFloat(); sy[i] = r.nextFloat();
                      ss[i] = 0.4f + r.nextFloat() * r.nextFloat() * 2.2f; sph[i] = r.nextFloat() * 6.28f;
                  }
                  int m = compact ? 16 : 46;
                  qx = new float[m]; qs = new float[m]; qo = new float[m];
                  for (int i = 0; i < m; i++) { qx[i] = r.nextFloat(); qs[i] = 0.03f + r.nextFloat() * 0.07f; qo[i] = r.nextFloat(); }
                  ridge = new float[33];
                  for (int i = 0; i < ridge.length; i++) ridge[i] = 0.35f + r.nextFloat() * 0.65f;
                  if (scene == Prefs.SCENE_GLOBE) EarthRenderer.prepareAsync();
              }

              public void configure(int scene, int accent, float speed) {
                  this.scene = scene; this.accent = accent; this.speed = speed;
                  if (scene == Prefs.SCENE_GLOBE) EarthRenderer.prepareAsync();
                  buildShaders();
                  invalidate();
              }

              @Override protected void onSizeChanged(int nw, int nh, int ow, int oh) {
                  w = nw; h = nh;
                  buildShaders();
              }

              private void buildShaders() {
                  if (w == 0 || h == 0) return;
                  hexPath = null;
                  switch (scene) {
                      case Prefs.SCENE_GLOBE:
                      case Prefs.SCENE_STARS:
                          bgShader = new LinearGradient(0, 0, 0, h, 0xFF010309, 0xFF070C22, Shader.TileMode.CLAMP);
                          break;
                      case Prefs.SCENE_NEON:
                          bgShader = new LinearGradient(0, 0, 0, h * 0.6f, 0xFF0A0020, 0xFF4A0758, Shader.TileMode.CLAMP);
                          float sr = h * (compact ? 0.24f : 0.22f);
                          float scy = h * 0.6f - sr * 0.35f;
                          sunShader = new LinearGradient(0, scy - sr, 0, scy + sr, 0xFFFFE36B, 0xFFFF2E8A, Shader.TileMode.CLAMP);
                          break;
                      case Prefs.SCENE_HOLO:
                          bgShader = new RadialGradient(w / 2f, h / 2f, Math.max(w, h) * 0.7f, 0xFF04324A, 0xFF01060E, Shader.TileMode.CLAMP);
                          break;
                      case Prefs.SCENE_AURORA:
                          bgShader = new LinearGradient(0, 0, 0, h, 0xFF02040E, 0xFF0A1A2C, Shader.TileMode.CLAMP);
                          break;
                  }
                  float[] g = globeGeom();
                  haloShader = new RadialGradient(g[0], g[1], g[2] * 1.28f,
                          new int[]{0x00000000, 0x00000000, 0x993F8CFF, 0x333F8CFF, 0x00000000},
                          new float[]{0f, 0.74f, 0.79f, 0.86f, 1f}, Shader.TileMode.CLAMP);
              }

              private float[] globeGeom() {
                  if (compact) return new float[]{w / 2f, h * 0.52f, Math.min(w, h) * 0.36f};
                  return new float[]{w * 0.70f, h * 0.56f, h * 0.40f};
              }

              @Override protected void onDraw(Canvas c) {
                  if (w == 0) return;
                  float t = (SystemClock.uptimeMillis() - start) / 1000f * speed;
                  switch (scene) {
                      case Prefs.SCENE_GLOBE: drawGlobe(c, t); break;
                      case Prefs.SCENE_NEON: drawNeon(c, t); break;
                      case Prefs.SCENE_HOLO: drawHolo(c, t); break;
                      case Prefs.SCENE_AURORA: drawAurora(c, t); break;
                      default: drawStars(c, t); break;
                  }
                  postInvalidateDelayed(compact ? 50 : 33);
              }

              // ================= GLOBE TERRE =================
              private void drawGlobe(Canvas c, float t) {
                  fillBg(c);
                  drawStarField(c, t, 1f);
                  float[] g = globeGeom();
                  float cx = g[0], cy = g[1], R = g[2];
                  // nébuleuse discrète couleur de session
                  p.setShader(new RadialGradient(w * 0.2f, h * 0.25f, h * 0.7f, (accent & 0x00FFFFFF) | 0x22000000, 0, Shader.TileMode.CLAMP));
                  c.drawRect(0, 0, w, h, p);
                  p.setShader(haloShader);
                  c.drawCircle(cx, cy, R * 1.28f, p);
                  p.setShader(null);
                  if (EarthRenderer.isReady()) {
                      if (earth == null) earth = new EarthRenderer(compact ? 180 : 440);
                      float rot = t * EarthRenderer.TW * 0.011f;
                      Bitmap b = earth.render(rot, rot * 1.35f + 40f);
                      dst.set((int) (cx - R), (int) (cy - R), (int) (cx + R), (int) (cy + R));
                      if (b != null) c.drawBitmap(b, null, dst, bmpPaint);
                  } else {
                      p.setColor(0xFF0A1C3A);
                      c.drawCircle(cx, cy, R, p);
                  }
              }

              // ================= NÉON =================
              private void drawNeon(Canvas c, float t) {
                  fillBg(c);
                  float hz = h * 0.6f;
                  drawStarField(c, t, 0.5f, hz);
                  float sr = h * (compact ? 0.24f : 0.22f);
                  float scx = w / 2f, scy = hz - sr * 0.35f;
                  c.save();
                  path.reset();
                  path.addCircle(scx, scy, sr, Path.Direction.CW);
                  c.clipPath(path);
                  p.setShader(sunShader);
                  c.drawRect(scx - sr, scy - sr, scx + sr, scy + sr, p);
                  p.setShader(null);
                  p.setColor(0xFF2A0440);
                  for (int i = 0; i < 7; i++) {
                      float y = scy + sr * (0.05f + i * 0.14f) + ((t * 8f) % (sr * 0.14f));
                      c.drawRect(scx - sr, y, scx + sr, y + sr * (0.015f + i * 0.012f), p);
                  }
                  c.restore();
                  // halo du soleil
                  p.setShader(new RadialGradient(scx, scy, sr * 1.8f, 0x55FF3E9E, 0x00FF3E9E, Shader.TileMode.CLAMP));
                  c.drawCircle(scx, scy, sr * 1.8f, p);
                  p.setShader(null);
                  // montagnes
                  path.reset();
                  path.moveTo(0, hz);
                  int n = ridge.length;
                  for (int i = 0; i < n; i++) {
                      float x = w * i / (float) (n - 1);
                      float centre = Math.abs(x - w / 2f) / (w / 2f);
                      float hh = ridge[i] * h * 0.16f * (0.25f + centre);
                      path.lineTo(x, hz - hh);
                  }
                  path.lineTo(w, hz);
                  path.close();
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(0xFF160226);
                  c.drawPath(path, p);
                  glowPath(c, path, accent, compact ? 1.5f : 2.5f);
                  // sol
                  p.setColor(0xFF07000F);
                  c.drawRect(0, hz, w, h, p);
                  float lw = compact ? 1.2f : 2f;
                  for (int i = -14; i <= 14; i++) {
                      float xt = w / 2f + i * w * 0.018f, xb = w / 2f + i * w * 0.14f;
                      glowLine(c, xt, hz, xb, h, accent, lw);
                  }
                  int K = 14;
                  float phase = (t * 0.6f) % 1f;
                  for (int k = 0; k < K; k++) {
                      float q = (k + phase) / K;
                      float y = hz + (h - hz) * q * q;
                      glowLine(c, 0, y, w, y, accent, lw * (0.4f + q));
                  }
                  glowLine(c, 0, hz, w, hz, 0xFFFF7AD9, lw * 1.4f);
                  drawParticles(c, t, accent, hz);
              }

              // ================= HOLOGRAPHIQUE =================
              private void drawHolo(Canvas c, float t) {
                  fillBg(c);
                  if (hexPath == null) hexPath = buildHex();
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(1f);
                  p.setColor((accent & 0x00FFFFFF) | 0x16000000);
                  c.drawPath(hexPath, p);
                  float cx = compact ? w / 2f : w * 0.68f, cy = h * 0.52f;
                  float R = Math.min(w, h) * (compact ? 0.27f : 0.28f);
                  float rot = t * 0.35f;
                  double tilt = Math.toRadians(20);
                  float ct = (float) Math.cos(tilt), st = (float) Math.sin(tilt);
                  p.setStrokeWidth(compact ? 1f : 1.6f);
                  // méridiens
                  for (int m = 0; m < 12; m++) {
                      double lon = m * Math.PI / 12 + rot;
                      float px0 = 0, py0 = 0, pz0 = 0; boolean first = true;
                      for (int s = 0; s <= 18; s++) {
                          double lat = -Math.PI / 2 + s * Math.PI / 18;
                          float x = (float) (Math.cos(lat) * Math.sin(lon)), y = (float) Math.sin(lat), z = (float) (Math.cos(lat) * Math.cos(lon));
                          float y2 = y * ct - z * st, z2 = y * st + z * ct;
                          if (!first) holoSeg(c, cx + px0 * R, cy - py0 * R, cx + x * R, cy - y2 * R, (pz0 + z2) / 2f);
                          px0 = x; py0 = y2; pz0 = z2; first = false;
                      }
                  }
                  // parallèles
                  for (int l = -2; l <= 2; l++) {
                      double lat = l * Math.PI / 6;
                      float px0 = 0, py0 = 0, pz0 = 0; boolean first = true;
                      for (int s = 0; s <= 36; s++) {
                          double lon = s * Math.PI / 18;
                          float x = (float) (Math.cos(lat) * Math.sin(lon)), y = (float) Math.sin(lat), z = (float) (Math.cos(lat) * Math.cos(lon));
                          float y2 = y * ct - z * st, z2 = y * st + z * ct;
                          if (!first) holoSeg(c, cx + px0 * R, cy - py0 * R, cx + x * R, cy - y2 * R, (pz0 + z2) / 2f);
                          px0 = x; py0 = y2; pz0 = z2; first = false;
                      }
                  }
                  // cœur lumineux
                  p.setStyle(Paint.Style.FILL);
                  p.setShader(new RadialGradient(cx, cy, R * 1.1f, (accent & 0x00FFFFFF) | 0x40000000, accent & 0x00FFFFFF, Shader.TileMode.CLAMP));
                  c.drawCircle(cx, cy, R * 1.1f, p);
                  p.setShader(null);
                  // anneaux tournants
                  p.setStyle(Paint.Style.STROKE);
                  float[] radii = {1.22f, 1.38f, 1.56f};
                  for (int i = 0; i < radii.length; i++) {
                      float rr = R * radii[i];
                      rf.set(cx - rr, cy - rr, cx + rr, cy + rr);
                      float dir = (i % 2 == 0 ? 1 : -1) * (40 + i * 25);
                      float base = t * dir;
                      p.setStrokeWidth((compact ? 1.5f : 3f) - i * 0.5f);
                      p.setColor((accent & 0x00FFFFFF) | ((200 - i * 50) << 24));
                      int segs = 3 + i * 2;
                      for (int sgi = 0; sgi < segs; sgi++)
                          c.drawArc(rf, base + sgi * 360f / segs, 360f / segs * 0.55f, false, p);
                  }
                  // ligne de balayage
                  float scanY = (t * 0.18f % 1f) * h;
                  p.setStyle(Paint.Style.FILL);
                  p.setShader(new LinearGradient(0, scanY - h * 0.08f, 0, scanY, accent & 0x00FFFFFF, (accent & 0x00FFFFFF) | 0x30000000, Shader.TileMode.CLAMP));
                  c.drawRect(0, scanY - h * 0.08f, w, scanY, p);
                  p.setShader(null);
                  // lignes de trame
                  p.setColor(0x10000000);
                  for (int y = 0; y < h; y += 4) c.drawRect(0, y, w, y + 1, p);
                  drawParticles(c, t, accent, h);
              }

              private void holoSeg(Canvas c, float x1, float y1, float x2, float y2, float z) {
                  int a = (int) (40 + 190 * Math.max(0f, (z + 1f) / 2f));
                  p.setColor((accent & 0x00FFFFFF) | (a << 24));
                  c.drawLine(x1, y1, x2, y2, p);
              }

              private Path buildHex() {
                  Path hp = new Path();
                  float s = compact ? 18 : 34;
                  float hh = (float) (Math.sqrt(3) * s);
                  for (float y = -hh; y < h + hh; y += hh) {
                      int row = (int) (y / hh);
                      for (float x = -s * 3; x < w + s * 3; x += s * 3) {
                          float ox = x + ((row & 1) == 0 ? 0 : s * 1.5f);
                          for (int i = 0; i < 6; i++) {
                              double a = Math.PI / 3 * i;
                              float px = ox + (float) (s * Math.cos(a)), py = y + (float) (s * Math.sin(a));
                              if (i == 0) hp.moveTo(px, py); else hp.lineTo(px, py);
                          }
                          hp.close();
                      }
                  }
                  return hp;
              }

              // ================= AURORE BORÉALE =================
              private void drawAurora(Canvas c, float t) {
                  fillBg(c);
                  drawStarField(c, t, 0.8f);
                  int[] cols = {0xFF2BFF9C, 0xFF19D3FF, accent};
                  for (int r = 0; r < 3; r++) {
                      float base = h * (0.32f + r * 0.08f);
                      float amp = h * 0.06f;
                      float height = h * (0.22f - r * 0.04f);
                      path.reset();
                      int steps = 48;
                      for (int i = 0; i <= steps; i++) {
                          float x = w * i / (float) steps;
                          float y = base + (float) (Math.sin(x / w * 6.0 + t * (0.4 + r * 0.15) + r) * amp
                                  + Math.sin(x / w * 13.0 - t * 0.7) * amp * 0.35);
                          if (i == 0) path.moveTo(x, y); else path.lineTo(x, y);
                      }
                      for (int i = steps; i >= 0; i--) {
                          float x = w * i / (float) steps;
                          float y = base - height + (float) (Math.sin(x / w * 6.0 + t * (0.4 + r * 0.15) + r) * amp * 1.4);
                          path.lineTo(x, y);
                      }
                      path.close();
                      int col = cols[r] & 0x00FFFFFF;
                      p.setStyle(Paint.Style.FILL);
                      p.setShader(new LinearGradient(0, base - height, 0, base + amp, col, col | 0x88000000, Shader.TileMode.CLAMP));
                      c.drawPath(path, p);
                      p.setShader(null);
                  }
                  // montagnes et lac
                  path.reset();
                  float hz = h * 0.78f;
                  path.moveTo(0, hz);
                  for (int i = 0; i < ridge.length; i++) path.lineTo(w * i / (float) (ridge.length - 1), hz - ridge[i] * h * 0.12f);
                  path.lineTo(w, h); path.lineTo(0, h); path.close();
                  p.setColor(0xFF02050A);
                  c.drawPath(path, p);
                  p.setColor(0xFF050C16);
                  c.drawRect(0, h * 0.86f, w, h, p);
              }

              // ================= ÉTOILES =================
              private void drawStars(Canvas c, float t) {
                  fillBg(c);
                  float nx = w * (0.5f + 0.2f * (float) Math.sin(t * 0.05)), ny = h * (0.4f + 0.1f * (float) Math.cos(t * 0.04));
                  p.setShader(new RadialGradient(nx, ny, h * 0.8f, (accent & 0x00FFFFFF) | 0x33000000, 0, Shader.TileMode.CLAMP));
                  c.drawRect(0, 0, w, h, p);
                  p.setShader(new RadialGradient(w - nx, h - ny, h * 0.6f, 0x225A3CFF, 0, Shader.TileMode.CLAMP));
                  c.drawRect(0, 0, w, h, p);
                  p.setShader(null);
                  drawStarField(c, t, 1.4f);
                  // étoile filante
                  float cyc = t % 9f;
                  if (cyc < 1.2f) {
                      float k = cyc / 1.2f;
                      float x = w * (0.15f + 0.6f * k), y = h * (0.12f + 0.25f * k);
                      p.setStrokeWidth(compact ? 1.5f : 2.5f);
                      p.setShader(new LinearGradient(x - w * 0.12f, y - h * 0.05f, x, y, 0x00FFFFFF, 0xFFFFFFFF, Shader.TileMode.CLAMP));
                      c.drawLine(x - w * 0.12f, y - h * 0.05f, x, y, p);
                      p.setShader(null);
                  }
              }

              // ================= outils =================
              private void fillBg(Canvas c) {
                  p.setStyle(Paint.Style.FILL);
                  if (bgShader == null) buildShaders();
                  p.setShader(bgShader);
                  c.drawRect(0, 0, w, h, p);
                  p.setShader(null);
              }

              private void drawStarField(Canvas c, float t, float drift) { drawStarField(c, t, drift, h); }

              private void drawStarField(Canvas c, float t, float drift, float maxY) {
                  p.setStyle(Paint.Style.FILL);
                  for (int i = 0; i < sx.length; i++) {
                      float x = ((sx[i] - t * 0.004f * drift * ss[i]) % 1f + 1f) % 1f * w;
                      float y = sy[i] * maxY;
                      float a = 0.45f + 0.55f * (float) Math.sin(t * (1.2f + ss[i]) + sph[i]);
                      p.setColor(Color.argb((int) (255 * Math.max(0.1f, a)), 255, 255, 255));
                      c.drawCircle(x, y, ss[i] * (compact ? 0.7f : 1.1f), p);
                  }
              }

              private void drawParticles(Canvas c, float t, int col, float maxY) {
                  p.setStyle(Paint.Style.FILL);
                  for (int i = 0; i < qx.length; i++) {
                      float k = (t * qs[i] + qo[i]) % 1f;
                      float y = maxY * (1f - k);
                      float a = (float) Math.sin(k * Math.PI);
                      p.setColor((col & 0x00FFFFFF) | ((int) (200 * a) << 24));
                      c.drawCircle(qx[i] * w + (float) Math.sin(t + i) * 8f, y, compact ? 1.5f : 2.5f, p);
                  }
              }

              private void glowLine(Canvas c, float x1, float y1, float x2, float y2, int col, float width) {
                  int rgb = col & 0x00FFFFFF;
                  p.setShader(null);
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeCap(Paint.Cap.ROUND);
                  p.setStrokeWidth(width * 6); p.setColor(rgb | 0x22000000); c.drawLine(x1, y1, x2, y2, p);
                  p.setStrokeWidth(width * 2.6f); p.setColor(rgb | 0x66000000); c.drawLine(x1, y1, x2, y2, p);
                  p.setStrokeWidth(width); p.setColor(rgb | 0xFF000000); c.drawLine(x1, y1, x2, y2, p);
                  p.setStyle(Paint.Style.FILL);
              }

              private void glowPath(Canvas c, Path pa, int col, float width) {
                  int rgb = col & 0x00FFFFFF;
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeJoin(Paint.Join.ROUND);
                  p.setStrokeWidth(width * 6); p.setColor(rgb | 0x22000000); c.drawPath(pa, p);
                  p.setStrokeWidth(width * 2.6f); p.setColor(rgb | 0x66000000); c.drawPath(pa, p);
                  p.setStrokeWidth(width); p.setColor(rgb | 0xFF000000); c.drawPath(pa, p);
                  p.setStyle(Paint.Style.FILL);
              }
          }
