name: IMADA TV - compiler et publier

# Fichier unique : il crée tout le projet IMADA TV v2.0, compile l'APK
# et le publie avec un lien direct fixe pour l'appli Downloader.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/imada-tv.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Créer le projet IMADA TV
        run: |
          mkdir -p imada && cd imada
          mkdir -p app/src/main/res/values app/src/main/res/drawable app/src/main/java/tv/imada/app
          cat > settings.gradle.kts <<'IMADA_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "IMADA-TV"
          include(":app")
          IMADA_EOF
          cat > build.gradle.kts <<'IMADA_EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          IMADA_EOF
          cat > gradle.properties <<'IMADA_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          IMADA_EOF
          cat > app/build.gradle.kts <<'IMADA_EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "tv.imada.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "tv.imada.app"
                  minSdk = 23
                  targetSdk = 28
                  versionCode = 2
                  versionName = "2.0"
              }

              // Clé fixe : chaque nouvelle version s'installe par-dessus l'ancienne,
              // sans devoir désinstaller (les paramètres et favoris sont conservés).
              signingConfigs {
                  create("imada") {
                      storeFile = file("imada.keystore")
                      storePassword = "imadatv"
                      keyAlias = "imada"
                      keyPassword = "imadatv"
                  }
              }

              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("imada")
                  }
                  getByName("release") {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("imada")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }
          IMADA_EOF
          cat > app/src/main/AndroidManifest.xml <<'IMADA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="IMADA TV"
                  android:icon="@drawable/ic_launcher"
                  android:banner="@drawable/banner"
                  android:theme="@style/ImadaTheme"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false">

                  <!-- Accueil IMADA : peut remplacer l'écran d'accueil de la télé (zéro pub) -->
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape"
                      android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
