          IMADA_EOF
          cat > app/src/main/java/tv/imada/app/AppsRepo.java <<'IMADA_EOF'
          package tv.imada.app;

          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.drawable.Drawable;

          import java.text.Collator;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;

          /** Liste des applications installées sur la télé. */
          final class AppsRepo {

              static final class App {
                  final String pkg, label;
                  final Drawable icon;
                  App(String pkg, String label, Drawable icon) { this.pkg = pkg; this.label = label; this.icon = icon; }
              }

              private AppsRepo() {}

              static List<App> load(Context c) {
                  PackageManager pm = c.getPackageManager();
                  Map<String, App> map = new LinkedHashMap<>();
                  addAll(c, pm, map, Intent.CATEGORY_LEANBACK_LAUNCHER);
                  addAll(c, pm, map, Intent.CATEGORY_LAUNCHER);
                  List<App> out = new ArrayList<>(map.values());
                  Collator col = Collator.getInstance(Locale.FRANCE);
                  Collections.sort(out, (a, b) -> col.compare(a.label, b.label));
                  return out;
              }

              private static void addAll(Context c, PackageManager pm, Map<String, App> map, String category) {
                  Intent i = new Intent(Intent.ACTION_MAIN);
                  i.addCategory(category);
                  List<ResolveInfo> list;
                  try { list = pm.queryIntentActivities(i, 0); } catch (Exception e) { return; }
                  for (ResolveInfo ri : list) {
                      String pkg = ri.activityInfo.packageName;
                      if (pkg.equals(c.getPackageName()) || map.containsKey(pkg)) continue;
                      String label = String.valueOf(ri.loadLabel(pm));
                      Drawable icon;
                      try { icon = ri.loadIcon(pm); } catch (Exception e) { icon = null; }
                      map.put(pkg, new App(pkg, label, icon));
                  }
              }

              static boolean launch(Context c, String pkg) {
                  PackageManager pm = c.getPackageManager();
                  Intent i = pm.getLeanbackLaunchIntentForPackage(pkg);
                  if (i == null) i = pm.getLaunchIntentForPackage(pkg);
                  if (i == null) return false;
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try { c.startActivity(i); return true; } catch (Exception e) { return false; }
              }
          }
          IMADA_EOF
          cat > app/src/main/java/tv/imada/app/EarthRenderer.java <<'IMADA_EOF'
          package tv.imada.app;

          import android.graphics.Bitmap;

          /**
           * Planète Terre rendue pixel par pixel : continents placés à leurs vraies positions,
           * océans avec profondeur, déserts, forêts, calottes glaciaires, nuages qui tournent
           * indépendamment, reflet du soleil sur l'océan, lumières des villes côté nuit
           * et halo d'atmosphère. Inclinaison de l'axe : 23,4°.
           */
          final class EarthRenderer {

              static final int TW = 512, TH = 256;

              private static volatile boolean ready = false;
              private static boolean started = false;
              private static int[] tex;        // couleur du sol
              private static byte[] ocean;     // 1 = océan
              private static byte[] lights;    // lumières des villes
              private static byte[] clouds;    // densité des nuages

              // Continents : longitude, latitude, rayon en longitude, rayon en latitude (degrés)
              private static final float[][] LAND = {
                      {-100, 47, 30, 16}, {-88, 35, 14, 12}, {-150, 64, 16, 7}, {-118, 60, 22, 9}, {-95, 18, 10, 6},
                      {-84, 11, 5, 5}, {-75, 70, 20, 7}, {-42, 72, 13, 9},
                      {-60, -8, 16, 17}, {-64, -32, 9, 15}, {-70, -47, 4, 8}, {-45, -5, 9, 8},
                      {14, 50, 16, 7}, {16, 63, 7, 8}, {-4, 40, 5, 4}, {-2, 54, 3, 4}, {28, 46, 10, 6},
                      {12, 22, 24, 10}, {20, 5, 18, 10}, {27, -14, 12, 15}, {38, 7, 6, 6}, {47, -19, 2.5f, 6},
                      {45, 23, 9, 8}, {55, 33, 9, 6},
                      {90, 50, 40, 13}, {105, 30, 18, 12}, {115, 64, 42, 8}, {78, 21, 8, 10}, {102, 15, 6, 8},
                      {116, 32, 10, 10}, {138, 37, 3, 6}, {160, 64, 12, 6}, {65, 44, 12, 7},
                      {115, -2, 15, 4}, {114, 1, 5, 4}, {142, -5, 8, 3}, {122, 10, 3, 6},
                      {134, -25, 17, 11}, {172, -42, 2, 5}
              };

              static boolean isReady() { return ready; }

              /** Génère les textures une seule fois, en arrière-plan. */
              static synchronized void prepareAsync() {
                  if (started) return;
                  started = true;
                  Thread th = new Thread(EarthRenderer::generate, "imada-earth");
                  th.setPriority(Thread.NORM_PRIORITY - 1);
                  th.start();
              }

              private static void generate() {
                  int[] t = new int[TW * TH];
                  byte[] oc = new byte[TW * TH];
                  byte[] li = new byte[TW * TH];
                  byte[] cl = new byte[TW * TH];
                  for (int y = 0; y < TH; y++) {
                      float lat = 90f - (y + 0.5f) / TH * 180f;
                      float alat = Math.abs(lat);
                      for (int x = 0; x < TW; x++) {
                          float lon = (x + 0.5f) / TW * 360f - 180f;
                          float nx = (float) x / TW, ny = (float) y / TH;
                          // déformation du domaine : côtes découpées, formes naturelles
                          float wl = lon + (fbm(nx * 6, ny * 3, 6, 5, 31) - 0.5f) * 34f;
                          float wa = lat + (fbm(nx * 6, ny * 3, 6, 5, 37) - 0.5f) * 18f;
                          float field = -1f;
                          for (float[] b : LAND) {
                              float dl = wl - b[0];
                              if (dl > 180) dl -= 360;
                              if (dl < -180) dl += 360;
                              float dx = dl / b[2], dy = (wa - b[1]) / b[3];
                              float f = 1f - (dx * dx + dy * dy);
                              if (f > field) field = f;
                          }
                          float n = fbm(nx * 16, ny * 8, 16, 6, 11);
                          field += (n - 0.5f) * 1.25f;
                          if (lat < -67) field = Math.max(field, 0.35f + (n - 0.5f));
                          float m = fbm(nx * 10, ny * 5, 10, 5, 23);          // humidité
                          float d = fbm(nx * 48, ny * 24, 48, 3, 41);         // relief fin
                          int i = y * TW + x;
                          int col;
                          if (field > 0) {
                              boolean snow = lat < -62 || alat > 74 || (alat > 62 && m > 0.52f);
                              if (snow) {
                                  col = mix(rgb(214, 224, 236), rgb(246, 250, 255), d);
                              } else {
                                  int forest = mix(rgb(30, 62, 28), rgb(64, 92, 44), m);
                                  if (alat < 12) forest = mix(rgb(20, 56, 24), rgb(38, 76, 32), m);
                                  if (alat > 52) forest = mix(forest, rgb(92, 96, 70), (alat - 52) / 12f);
                                  float belt = (float) Math.exp(-Math.pow((alat - 24f) / 9f, 2));
                                  float dry = Math.max(0f, Math.min(1f, (0.62f - m) * 4f)) * belt;
                                  int desert = mix(rgb(206, 174, 124), rgb(170, 122, 78), d);
                                  col = mix(forest, desert, dry);
                                  if (field > 0.45f && d > 0.6f) col = mix(col, rgb(112, 98, 82), 0.5f);
                                  col = shade(col, 0.82f + 0.36f * d);
                                  if (alat < 62 && hash(x * 7, y * 13, 5) > 0.87f + (Math.abs(alat - 40) / 220f))
                                      li[i] = (byte) (150 + (int) (hash(x, y, 9) * 105));
                              }
                              oc[i] = 0;
                          } else {
                              float depth = Math.min(1f, -field / 0.3f);
                              col = mix(rgb(22, 78, 124), rgb(5, 22, 58), (float) Math.sqrt(depth));
                              if (alat > 72) col = mix(col, rgb(200, 215, 230), Math.min(1f, (alat - 72) / 6f));
                              oc[i] = 1;
                          }
                          t[i] = col;
                          float cw = fbm(nx * 12 + (fbm(nx * 4, ny * 4, 4, 3, 55) - 0.5f) * 2.4f, ny * 6, 12, 6, 77);
                          float band = 1f - 0.22f * (float) Math.exp(-Math.pow((alat - 24f) / 10f, 2));
                          float cv = (cw * band - 0.5f) * 3.6f;
                          cl[i] = (byte) (int) (235 * Math.max(0f, Math.min(1f, cv)));
                      }
                  }
                  tex = t; ocean = oc; lights = li; clouds = cl;
                  ready = true;
              }

              // ---------- rendu de la sphère ----------

              final int size;
              final Bitmap bitmap;
              private final int[] px;
              private final int[] idx, v;
              private final float[] u0, diff, term, spec, fres, edge;

              EarthRenderer(int size) {
                  this.size = size;
                  bitmap = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                  px = new int[size * size];
                  int count = 0;
                  float half = size / 2f;
                  for (int y = 0; y < size; y++)
                      for (int x = 0; x < size; x++) {
                          float nx = (x + 0.5f - half) / half, ny = (y + 0.5f - half) / half;
                          if (nx * nx + ny * ny < 1f) count++;
                      }
                  idx = new int[count]; v = new int[count];
                  u0 = new float[count]; diff = new float[count]; term = new float[count];
                  spec = new float[count]; fres = new float[count]; edge = new float[count];

                  double tilt = Math.toRadians(23.4);
                  float ct = (float) Math.cos(tilt), st = (float) Math.sin(tilt);
                  float lx = -0.78f, ly = 0.30f, lz = 0.55f;
                  float ll = (float) Math.sqrt(lx * lx + ly * ly + lz * lz);
                  lx /= ll; ly /= ll; lz /= ll;
                  float hx = lx, hy = ly, hz = lz + 1f;
                  float hl = (float) Math.sqrt(hx * hx + hy * hy + hz * hz);
                  hx /= hl; hy /= hl; hz /= hl;

                  int k = 0;
                  for (int y = 0; y < size; y++)
                      for (int x = 0; x < size; x++) {
                          float nx = (x + 0.5f - half) / half, ny = -(y + 0.5f - half) / half;
                          float r2 = nx * nx + ny * ny;
                          if (r2 >= 1f) continue;
                          float nz = (float) Math.sqrt(1f - r2);
                          float ex = nx * ct + ny * st, ey = -nx * st + ny * ct;
                          double lat = Math.asin(Math.max(-1f, Math.min(1f, ey)));
                          double lon = Math.atan2(ex, nz);
                          idx[k] = y * size + x;
                          u0[k] = (float) ((lon / (2 * Math.PI) + 0.5) * TW);
                          v[k] = Math.max(0, Math.min(TH - 1, (int) ((0.5 - lat / Math.PI) * TH)));
                          float d = nx * lx + ny * ly + nz * lz;
                          diff[k] = d;
                          term[k] = smooth(-0.14f, 0.22f, d);
                          float sh = Math.max(0f, nx * hx + ny * hy + nz * hz);
                          spec[k] = (float) Math.pow(sh, 48) * 0.75f;
                          fres[k] = (float) Math.pow(1f - nz, 2.6);
                          edge[k] = Math.min(1f, (1f - (float) Math.sqrt(r2)) * half * 1.2f);
                          k++;
                      }
              }

              /** @param rot rotation de la Terre (en texels), @param cloudRot rotation des nuages */
              Bitmap render(float rot, float cloudRot) {
                  if (!ready) return null;
                  final int[] tx = tex; final byte[] oc = ocean, li = lights, cl = clouds;
                  final int mask = TW - 1;
                  for (int k = 0; k < idx.length; k++) {
                      int row = v[k] * TW;
                      int ti = row + (((int) (u0[k] + rot)) & mask);
                      int ci = row + (((int) (u0[k] + cloudRot)) & mask);
                      int c = tx[ti];
                      float r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
                      float d = diff[k], tm = term[k];
                      float lit = 0.05f + 1.08f * Math.max(0f, d) * (0.6f + 0.4f * tm);
                      r *= lit; g *= lit; b *= lit;
                      if (oc[ti] != 0) { float s = spec[k] * 255f * tm; r += s; g += s * 0.95f; b += s * 0.85f; }
                      float a = (cl[ci] & 255) / 255f;
                      if (a > 0f) {
                          float cw = 250f * (0.04f + 1.0f * Math.max(0f, d));
                          r += (cw - r) * a; g += (cw - g) * a; b += (cw * 1.02f - b) * a;
                      }
                      float L = (li[ti] & 255) / 255f * (1f - tm) * (1f - a * 0.8f);
                      if (L > 0f) { r += 255f * L; g += 178f * L; b += 96f * L; }
                      float f = fres[k] * (0.18f + 0.95f * tm);
                      r += 70f * f; g += 150f * f; b += 255f * f;
                      int ir = r > 255 ? 255 : (int) r, ig = g > 255 ? 255 : (int) g, ib = b > 255 ? 255 : (int) b;
                      int al = (int) (255 * edge[k]);
                      px[idx[k]] = (al << 24) | (ir << 16) | (ig << 8) | ib;
                  }
                  bitmap.setPixels(px, 0, size, 0, 0, size, size);
                  return bitmap;
              }

              // ---------- bruit ----------

              private static float hash(int x, int y, int seed) {
                  int h = x * 374761393 + y * 668265263 + seed * 1442695041;
                  h = (h ^ (h >>> 13)) * 1274126177;
                  h ^= h >>> 16;
                  return (h & 0xFFFFFF) / (float) 0xFFFFFF;
              }

              private static int wrap(int a, int p) { int m = a % p; return m < 0 ? m + p : m; }

              private static float vnoise(float x, float y, int period, int seed) {
                  int xi = (int) Math.floor(x), yi = (int) Math.floor(y);
                  float fx = x - xi, fy = y - yi;
                  int x0 = wrap(xi, period), x1 = wrap(xi + 1, period);
                  float a = hash(x0, yi, seed), b = hash(x1, yi, seed);
                  float c = hash(x0, yi + 1, seed), d = hash(x1, yi + 1, seed);
                  float sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
                  float top = a + (b - a) * sx, bot = c + (d - c) * sx;
                  return top + (bot - top) * sy;
              }

              private static float fbm(float x, float y, int period, int oct, int seed) {
                  float s = 0, amp = 0.5f, norm = 0;
                  for (int i = 0; i < oct; i++) {
                      s += amp * vnoise(x, y, period, seed + i * 17);
                      norm += amp;
                      x *= 2; y *= 2; period *= 2; amp *= 0.5f;
                  }
                  return s / norm;
              }

              private static float smooth(float e0, float e1, float x) {
                  float t = Math.max(0f, Math.min(1f, (x - e0) / (e1 - e0)));
                  return t * t * (3 - 2 * t);
              }

              private static int rgb(int r, int g, int b) { return (r << 16) | (g << 8) | b; }

              private static int shade(int c, float k) {
                  int r = Math.min(255, (int) (((c >> 16) & 255) * k));
                  int g = Math.min(255, (int) (((c >> 8) & 255) * k));
                  int b = Math.min(255, (int) ((c & 255) * k));
                  return rgb(r, g, b);
              }

              private static int mix(int c1, int c2, float t) {
                  t = Math.max(0f, Math.min(1f, t));
                  int r = (int) (((c1 >> 16) & 255) * (1 - t) + ((c2 >> 16) & 255) * t);
                  int g = (int) (((c1 >> 8) & 255) * (1 - t) + ((c2 >> 8) & 255) * t);
                  int b = (int) ((c1 & 255) * (1 - t) + (c2 & 255) * t);
                  return rgb(r, g, b);
              }
          }
          IMADA_EOF
          cat > app/src/main/java/tv/imada/app/MainActivity.java <<'IMADA_EOF'
          package tv.imada.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          /** Accueil IMADA : choix de la session (3 univers visuels distincts). */
          public class MainActivity extends Activity {

              private static final int GOLD = 0xFFE8B84A;

              private LinearLayout cardsRow;
              private TextView clock, date;
              private final View[] cards = new View[Prefs.SESSIONS];
              private int lastFocus = 0;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Runnable tick = new Runnable() {
                  @Override public void run() {
                      clock.setText(Ui.clock());
