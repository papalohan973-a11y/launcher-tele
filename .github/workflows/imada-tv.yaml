          package tv.imada.app;

          import android.content.Context;
          import android.content.SharedPreferences;

          import java.util.ArrayList;
          import java.util.List;

          /** Réglages propres à chaque session (0, 1, 2). Chaque session a ses propres valeurs. */
          public final class Prefs {

              public static final int SESSIONS = 3;

              public static final int SCENE_GLOBE = 0, SCENE_NEON = 1, SCENE_HOLO = 2, SCENE_AURORA = 3, SCENE_STARS = 4;
              public static final String[] SCENES = {"Globe Terre", "Néon", "Holographique", "Aurore boréale", "Étoiles"};

              public static final String[] ACCENT_NAMES = {"Or", "Cyan", "Magenta", "Vert émeraude", "Blanc"};
              public static final int[] ACCENTS = {0xFFE8B84A, 0xFF35E0FF, 0xFFFF3EB5, 0xFF34E39A, 0xFFF2F4F8};

              public static final String[] SPEEDS = {"Lente", "Normale", "Rapide"};
              public static final float[] SPEED_VALUES = {0.5f, 1f, 1.8f};

              public static final String[] SHAPES = {"Ronde", "Carrée arrondie"};

              public static final String DEFAULT_NEWS = "https://www.tiktok.com/tag/actualite";

              private static final String[] DEFAULT_NAMES = {"Arnaud", "Vikiana", "Invités"};
              private static final int[] DEFAULT_SCENE = {SCENE_GLOBE, SCENE_NEON, SCENE_HOLO};
              private static final int[] DEFAULT_ACCENT = {0, 2, 1};

              private final SharedPreferences sp;
              public final int id;

              public Prefs(Context c, int id) {
                  this.sp = c.getSharedPreferences("imada", Context.MODE_PRIVATE);
                  this.id = Math.max(0, Math.min(SESSIONS - 1, id));
              }

              private String k(String n) { return "s" + id + "_" + n; }

              public String name() { return sp.getString(k("name"), DEFAULT_NAMES[id]); }
              public void setName(String v) { sp.edit().putString(k("name"), v).apply(); }

              public int scene() { return clamp(sp.getInt(k("scene"), DEFAULT_SCENE[id]), SCENES.length); }
              public void setScene(int v) { sp.edit().putInt(k("scene"), v).apply(); }

              public int accentIndex() { return clamp(sp.getInt(k("accent"), DEFAULT_ACCENT[id]), ACCENTS.length); }
              public int accent() { return ACCENTS[accentIndex()]; }
              public void setAccent(int v) { sp.edit().putInt(k("accent"), v).apply(); }

              public int speedIndex() { return clamp(sp.getInt(k("speed"), 1), SPEEDS.length); }
              public float speed() { return SPEED_VALUES[speedIndex()]; }
              public void setSpeed(int v) { sp.edit().putInt(k("speed"), v).apply(); }

              public int shape() { return clamp(sp.getInt(k("shape"), 0), SHAPES.length); }
              public void setShape(int v) { sp.edit().putInt(k("shape"), v).apply(); }

              public boolean newsOn() { return sp.getBoolean(k("news"), true); }
              public void setNewsOn(boolean v) { sp.edit().putBoolean(k("news"), v).apply(); }

              public String newsUrl() { return sp.getString(k("newsUrl"), DEFAULT_NEWS); }
              public void setNewsUrl(String v) { sp.edit().putString(k("newsUrl"), v).apply(); }

              public String pin() { return sp.getString(k("pin"), ""); }
              public void setPin(String v) { sp.edit().putString(k("pin"), v).apply(); }

              public boolean lockEntry() { return sp.getBoolean(k("lock"), false); }
              public void setLockEntry(boolean v) { sp.edit().putBoolean(k("lock"), v).apply(); }

              public List<String> favorites() {
                  List<String> out = new ArrayList<>();
                  String raw = sp.getString(k("fav"), "");
                  for (String s : raw.split(",")) if (!s.isEmpty()) out.add(s);
                  return out;
              }

              public boolean toggleFavorite(String pkg) {
                  List<String> f = favorites();
                  boolean added;
                  if (f.contains(pkg)) { f.remove(pkg); added = false; } else { f.add(pkg); added = true; }
                  StringBuilder b = new StringBuilder();
                  for (String s : f) { if (b.length() > 0) b.append(','); b.append(s); }
                  sp.edit().putString(k("fav"), b.toString()).apply();
                  return added;
              }

              public void clearFavorites() { sp.edit().remove(k("fav")).apply(); }

              private static int clamp(int v, int n) { return v < 0 || v >= n ? 0 : v; }
          }
