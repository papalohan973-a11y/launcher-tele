                  sub.setPadding(0, Ui.dp(this, 2), 0, Ui.dp(this, 14));
                  panel.addView(sub);
                  ScrollView sv = new ScrollView(this);
                  sv.setVerticalScrollBarEnabled(false);
                  sv.setClipToPadding(false);
                  list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);
                  list.setPadding(Ui.dp(this, 6), Ui.dp(this, 4), Ui.dp(this, 6), Ui.dp(this, 20));
                  sv.addView(list);
                  panel.addView(sv, new LinearLayout.LayoutParams(-1, 0, 1f));
                  root.addView(panel, new FrameLayout.LayoutParams(Ui.dp(this, 540), -1));
                  setContentView(root);

                  Ui.askPin(this, pr.pin(), "Paramètres de " + pr.name(), this::build, this::finish);
              }

              private void build() {
                  int accent = pr.accent();
                  title.setText("Paramètres — " + pr.name());
                  title.setTextColor(accent);
                  preview.configure(pr.scene(), accent, pr.speed());
                  list.removeAllViews();

                  row("Nom de la session", pr::name, () ->
                          Ui.askText(this, "Nom de la session", pr.name(), InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_CAP_WORDS, s -> {
                              if (!s.isEmpty()) { pr.setName(s); build(); }
                          }));
                  row("Fond animé", () -> Prefs.SCENES[pr.scene()], () -> {
                      pr.setScene((pr.scene() + 1) % Prefs.SCENES.length); build();
                  });
                  row("Couleur de la session", () -> Prefs.ACCENT_NAMES[pr.accentIndex()], () -> {
                      pr.setAccent((pr.accentIndex() + 1) % Prefs.ACCENTS.length); build();
                  });
                  row("Vitesse de l'animation", () -> Prefs.SPEEDS[pr.speedIndex()], () -> {
                      pr.setSpeed((pr.speedIndex() + 1) % Prefs.SPEEDS.length); build();
                  });
                  row("Forme des icônes", () -> Prefs.SHAPES[pr.shape()], () -> {
                      pr.setShape((pr.shape() + 1) % Prefs.SHAPES.length); build();
                  });
                  row("Fenêtre Actualités", () -> pr.newsOn() ? "Activée" : "Désactivée", () -> {
                      pr.setNewsOn(!pr.newsOn()); build();
                  });
                  row("Adresse des actualités", () -> shortUrl(pr.newsUrl()), () ->
                          Ui.askText(this, "Adresse de la fenêtre Actualités", pr.newsUrl(), InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_URI, s -> {
                              if (s.isEmpty()) s = Prefs.DEFAULT_NEWS;
                              if (!s.startsWith("http")) s = "https://" + s;
                              pr.setNewsUrl(s); build();
                          }));
                  row("Code PIN des paramètres", () -> pr.pin().isEmpty() ? "Aucun" : "••••", this::editPin);
                  row("Code demandé pour entrer", () -> pr.lockEntry() ? "Oui" : "Non", () -> {
                      if (pr.pin().isEmpty()) { Toast.makeText(this, "Définis d'abord un code PIN", Toast.LENGTH_SHORT).show(); return; }
                      pr.setLockEntry(!pr.lockEntry()); build();
                  });
                  row("Favoris", () -> pr.favorites().size() + " appli(s) — réinitialiser", () ->
                          Ui.dialog(this).setTitle("Vider les favoris de " + pr.name() + " ?")
                                  .setPositiveButton("Vider", (d, w) -> { pr.clearFavorites(); build(); })
                                  .setNegativeButton("Annuler", null).show());
                  row("Retour", () -> "", this::finish);

                  int i = Math.min(focusIndex, list.getChildCount() - 1);
                  list.getChildAt(i).requestFocus();
              }

              private void editPin() {
                  if (pr.pin().isEmpty()) {
                      askNewPin();
                  } else {
                      Ui.dialog(this).setTitle("Code PIN")
                              .setItems(new String[]{"Changer le code", "Supprimer le code"}, (d, which) -> {
                                  if (which == 0) askNewPin();
                                  else { pr.setPin(""); pr.setLockEntry(false); build(); }
                              }).show();
                  }
              }

              private void askNewPin() {
                  Ui.askText(this, "Nouveau code (4 chiffres ou plus)", "",
                          InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_VARIATION_PASSWORD, s -> {
                              if (s.length() < 4) { Toast.makeText(this, "4 chiffres minimum", Toast.LENGTH_SHORT).show(); return; }
                              pr.setPin(s);
                              Toast.makeText(this, "Code enregistré", Toast.LENGTH_SHORT).show();
                              build();
                          });
              }

              private void row(String label, Val value, Runnable action) {
                  final int index = list.getChildCount();
                  int accent = pr.accent();
                  LinearLayout r = new LinearLayout(this);
                  r.setGravity(Gravity.CENTER_VERTICAL);
                  r.setPadding(Ui.dp(this, 20), Ui.dp(this, 14), Ui.dp(this, 20), Ui.dp(this, 14));
                  float rad = Ui.dp(this, 14);
                  Ui.focusFx(r, r, Ui.box(0x26FFFFFF, rad, 0, 0), Ui.box(0x40FFFFFF, rad, accent, Ui.dp(this, 3)), 1.03f);
                  TextView l = Ui.text(this, label, 18, 0xFFFFFFFF, false);
                  r.addView(l, new LinearLayout.LayoutParams(0, -2, 1f));
                  String v = value.get();
                  if (!v.isEmpty()) r.addView(Ui.text(this, v + "  ›", 17, accent, true));
                  r.setOnClickListener(x -> { focusIndex = index; action.run(); });
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                  lp.setMargins(0, Ui.dp(this, 4), 0, Ui.dp(this, 4));
                  list.addView(r, lp);
              }

              private static String shortUrl(String u) {
                  String s = u.replaceFirst("^https?://(www\\.)?", "");
                  return s.length() > 26 ? s.substring(0, 25) + "…" : s;
              }
          }
          IMADA_EOF
          cat > app/src/main/java/tv/imada/app/Ui.java <<'IMADA_EOF'
          package tv.imada.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.graphics.Typeface;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.text.InputType;
          import android.util.TypedValue;
          import android.view.View;
          import android.widget.EditText;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          /** Petits outils d'interface partagés. */
          final class Ui {

              private Ui() {}

              static int dp(Context c, float v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, c.getResources().getDisplayMetrics());
              }

              static GradientDrawable box(int fill, float radiusPx, int stroke, int strokePx) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(fill);
                  g.setCornerRadius(radiusPx);
                  if (strokePx > 0) g.setStroke(strokePx, stroke);
                  return g;
              }

              static GradientDrawable oval(int fill, int stroke, int strokePx) {
                  GradientDrawable g = new GradientDrawable();
                  g.setShape(GradientDrawable.OVAL);
                  g.setColor(fill);
                  if (strokePx > 0) g.setStroke(strokePx, stroke);
                  return g;
              }

              static TextView text(Context c, String s, float sp, int color, boolean bold) {
                  TextView t = new TextView(c);
                  t.setText(s);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, sp);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(Typeface.create("sans-serif-medium", Typeface.BOLD));
                  else t.setTypeface(Typeface.create("sans-serif-light", Typeface.NORMAL));
                  t.setShadowLayer(8f, 0f, 2f, 0xAA000000);
                  return t;
              }

              /**
               * Effet de sélection à la télécommande : agrandissement doux + contour couleur de session.
               * @param target vue qui change de fond (peut être la vue elle-même)
               */
              static void focusFx(View v, View target, Drawable normal, Drawable focused, float scale) {
                  v.setFocusable(true);
                  target.setBackground(normal);
                  v.setOnFocusChangeListener((view, has) -> {
                      target.setBackground(has ? focused : normal);
                      view.animate().scaleX(has ? scale : 1f).scaleY(has ? scale : 1f)
                              .translationZ(has ? 12f : 0f).setDuration(160).start();
                  });
              }

              static String clock() { return new SimpleDateFormat("HH:mm", Locale.FRANCE).format(new Date()); }

              static String date() {
                  String d = new SimpleDateFormat("EEEE d MMMM", Locale.FRANCE).format(new Date());
                  return d.isEmpty() ? d : Character.toUpperCase(d.charAt(0)) + d.substring(1);
              }

              static AlertDialog.Builder dialog(Context c) {
                  return new AlertDialog.Builder(c, android.R.style.Theme_Material_Dialog_Alert);
              }

              /** Demande le code PIN si la session en a un. */
              static void askPin(Activity a, String pin, String title, Runnable ok, Runnable cancel) {
                  if (pin == null || pin.isEmpty()) { ok.run(); return; }
                  EditText in = new EditText(a);
                  in.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_VARIATION_PASSWORD);
                  in.setHint("Code PIN");
                  dialog(a).setTitle(title).setView(in)
                          .setPositiveButton("Valider", (d, w) -> {
                              if (pin.equals(in.getText().toString().trim())) ok.run();
                              else {
                                  Toast.makeText(a, "Code incorrect", Toast.LENGTH_SHORT).show();
                                  if (cancel != null) cancel.run();
                              }
                          })
                          .setNegativeButton("Annuler", (d, w) -> { if (cancel != null) cancel.run(); })
                          .setOnCancelListener(d -> { if (cancel != null) cancel.run(); })
                          .show();
                  in.requestFocus();
              }

              interface TextResult { void onText(String s); }

              static void askText(Activity a, String title, String current, int inputType, TextResult res) {
                  EditText in = new EditText(a);
                  in.setInputType(inputType);
                  in.setText(current);
                  in.setSelection(in.getText().length());
                  dialog(a).setTitle(title).setView(in)
                          .setPositiveButton("Enregistrer", (d, w) -> res.onText(in.getText().toString().trim()))
                          .setNegativeButton("Annuler", null)
                          .show();
                  in.requestFocus();
              }
          }
          IMADA_EOF
          echo '' | base64 -d > app/imada.keystore
          find . -type f | sort

      - name: Compiler l'APK
        working-directory: imada
        run: gradle --no-daemon :app:assembleDebug

      - name: Publier le lien direct pour Downloader
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp imada/app/build/outputs/apk/debug/app-debug.apk IMADA-TV.apk
          gh release delete imada-tv --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create imada-tv IMADA-TV.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "IMADA TV v2.0" --notes "Lien Downloader : https://github.com/$GITHUB_REPOSITORY/releases/download/imada-tv/IMADA-TV.apk"
          echo "LIEN DOWNLOADER : https://github.com/$GITHUB_REPOSITORY/releases/download/imada-tv/IMADA-TV.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: IMADA-TV-apk
          path: IMADA-TV.apk
