                  android:pathData="M48,64 A26,26 0 1,1 47.99,64 Z" />
              <path android:strokeColor="#E8B84A" android:strokeWidth="8"
                  android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M100,62 L100,118
                      M116,118 L116,62 L136,94 L156,62 L156,118
                      M172,118 L190,62 L208,118 M178,100 L202,100
                      M224,62 L224,118 L240,118 Q262,118 262,90 Q262,62 240,62 Z
