      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler et tester
        working-directory: nova
        run: |
          set -o pipefail
          if ! gradle assembleRelease testReleaseUnitTest --no-daemon --console=plain 2>&1 | tee build.log; then
            set +e +o pipefail
            { grep -E "^e: " build.log | sed -E 's#^e: file://.*/java/#e: #' ; grep -A8 "What went wrong" build.log ; grep -E "AAPT|error:|FAILED|Could not|not found" build.log ; } | grep -v "^\s*at " | head -60 > errors.txt
            if [ ! -s errors.txt ]; then grep -v "^\s*at " build.log | tail -40 > errors.txt; fi
            {
              echo "## Erreurs NOVA TV"
              echo "Copiez ce bloc et envoyez-le a Claude."
              echo '```'
              cat errors.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            head -10 errors.txt | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp nova/app/build/outputs/apk/release/app-release.apk nova-tv.apk
          gh release delete nova-tv --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create nova-tv nova-tv.apk -R "$GITHUB_REPOSITORY" --prerelease --title "NOVA TV" --notes "APK NOVA TV (build ${{ github.run_number }})."

      - uses: actions/upload-artifact@v4
        with:
          name: nova-tv-apk
          path: nova-tv.apk
