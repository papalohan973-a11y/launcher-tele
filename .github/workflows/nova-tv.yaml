      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Tests unitaires
        working-directory: nova
        run: gradle testReleaseUnitTest --no-daemon --stacktrace

      - name: Compiler l'APK
        working-directory: nova
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp nova/app/build/outputs/apk/release/app-release.apk nova-tv.apk
          gh release delete nova-tv --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create nova-tv nova-tv.apk -R "$GITHUB_REPOSITORY" --prerelease --title "NOVA TV" --notes "APK NOVA TV pour Android TV (build ${{ github.run_number }})."

      - uses: actions/upload-artifact@v4
        with:
          name: nova-tv-apk
          path: nova-tv.apk
