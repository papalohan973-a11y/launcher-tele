      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialiser Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK NOVA TV Vikiana
        working-directory: nova
        shell: bash
        run: |
          set -euo pipefail
          if ! gradle assembleRelease testReleaseUnitTest --no-daemon --console=plain 2>&1 | tee build.log; then
            {
              echo "## Echec de compilation NOVA TV Vikiana"
              echo "Ouvrez l'etape de compilation et consultez les erreurs ci-dessous."
              echo '```text'
              tail -70 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Preparer le fichier APK
        shell: bash
        run: |
          set -euo pipefail
          cp nova/app/build/outputs/apk/release/app-release.apk nova-tv-vikiana.apk
          test -s nova-tv-vikiana.apk
          sha256sum nova-tv-vikiana.apk

      - name: Sauvegarder l'APK dans Actions
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-TV-Vikiana-APK
          path: nova-tv-vikiana.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publier le lien de telechargement dans Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="nova-tv-vikiana"
          APK="nova-tv-vikiana.apk"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" -R "$GITHUB_REPOSITORY" \
              --title "NOVA TV - Vikiana Familia Galva" \
              --notes "Application Android TV NOVA TV avec espace Vikiana. APK genere par GitHub Actions."
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK}"
          {
            echo "## NOVA TV - Vikiana Familia Galva"
            echo "Compilation terminee et APK publie."
            echo ""
            echo "Lien direct (connexion GitHub requise si depot prive) :"
            echo ""
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK : $URL"
